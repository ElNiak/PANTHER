tools:
    - name: eslint
      languages: []
      extensions: []
      files: []
    - name: lizard
      languages: [Python]
      extensions: [.py]
      files: []
    - name: pmd
      languages: []
      extensions: []
      files: []
    - name: pylint
      languages: [Python]
      extensions: [.py]
      files: []
    - name: semgrep
      languages: [Dockerfile, Python, Shell, YAML]
      extensions: [.bash, .dockerfile, .env, .py, .sh, .yaml, .yml]
      files: []
    - name: trivy
      languages: [Dockerfile, JSON, Python, YAML]
      extensions: [.dockerfile, .env, .json, .py, .yaml, .yml]
      files: [.env, .env.dev, .env.development, .env.prod, .env.production, .env.staging, Dockerfile, Pipfile.lock, poetry.lock, requirements.txt, uv.lock]
