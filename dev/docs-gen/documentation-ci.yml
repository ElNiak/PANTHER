name: Documentation Link Check

on:
  push:
    branches: [ main, master ]
    paths:
      - '**.md'
      - 'mkdocs.yml'
      - 'dev/docs-gen/**'
      - 'panther/**/*.py'  # Check when Python files change (for docstrings)
  pull_request:
    branches: [ main, master ]
    paths:
      - '**.md'
      - 'mkdocs.yml'
      - 'dev/docs-gen/**'
      - 'panther/**/*.py'  # Check when Python files change (for docstrings)
  # Weekly scheduled run to check external links
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM
  # Allow manually triggering the workflow
  workflow_dispatch:

jobs:
  validate-documentation:
    name: Validate Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Required for mkdocs navigation

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml requests mkdocs mkdocs-material mkdocstrings mkdocstrings-python
          pip install -e .

      - name: Add cross-references
        run: |
          python dev/docs-gen/add_cross_references.py

      - name: Update MkDocs navigation
        run: |
          python dev/docs-gen/update_mkdocs_nav.py

      - name: Generate API documentation
        run: |
          python dev/docs-gen/mkdocs/gen_ref_pages.py

      - name: Verify internal links
        run: |
          python dev/docs-gen/verify_links.py

      # Optional: Cache external URL validation results to speed up CI
      - name: Cache external URL validation results
        uses: actions/cache@v3
        with:
          path: .link-check-cache
          key: link-check-cache-${{ hashFiles('**/*.md') }}

      - name: Check external links (on scheduled or manual runs)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python dev/docs-gen/verify_links.py --check-external

      - name: Build documentation
        run: |
          mkdocs build --strict

      # Only commit changes on push to main/master
      - name: Commit documentation changes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add docs/ mkdocs.yml
          git diff --quiet && git diff --staged --quiet || git commit -m "Update documentation [skip ci]"

      - name: Push changes
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
