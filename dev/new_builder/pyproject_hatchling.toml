# pyproject.toml - Hatchling backend configuration (for gradual migration)
[build-system]
requires = ["hatchling>=1.18.0", "hatch-vcs>=0.3.0"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "1.1.3"

[tool.hatch.build]
# Preserve directory structure for plugins
preserve-include-patterns = [
    "panther/plugins/**/*",
    "panther/webapp/**/*",
]

# Artifacts to include beyond Python files
artifacts = [
    "panther/**/*.yaml",
    "panther/**/*.yml", 
    "panther/**/*.jinja",
    "panther/**/*.j2",
    "panther/**/*.sh",
    "panther/**/Dockerfile*",
    "panther/py.typed",
]

[tool.hatch.build.targets.sdist]
include = [
    "/panther",
    "/tests",
    "/docs",
    "*.md",
    "*.txt",
    "pyproject.toml",
]
exclude = [
    "*.pyc",
    "__pycache__",
    ".git",
    ".github",
    "outputs*",
]

[tool.hatch.build.targets.wheel]
packages = ["panther"]

# Force include all plugin files
[tool.hatch.build.targets.wheel.force-include]
"panther/plugins" = "panther/plugins"
"panther/webapp" = "panther/webapp"
"panther/py.typed" = "panther/py.typed"

# Shared data files (backward compatible with setuptools)
[tool.hatch.build.targets.wheel.shared-data]
"panther/generate_certificates.sh" = "share/panther/scripts/generate_certificates.sh"

# Hook to ensure all plugin files are included
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project]
name = "panther-net"
# Version is managed by hatch-vcs from git tags
dynamic = ["version"]
description = "Panther: Protocol formal Analysis and formal Network Threat Evaluation Resources"
readme = "README.md"
authors = [
    { name = "ElNiak", email = "christophe.crochet.researcher@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Framework :: Flask",
    "Environment :: Console",
    "Environment :: Web Environment"
]
requires-python = ">=3.10"
keywords = ["testing", "networking", "protocols", "formal-verification", "docker", "security"]

# Dependencies - same as enhanced pyproject.toml
dependencies = [
    # Core dependencies with version constraints
    "omegaconf>=2.3.0,<3.0",
    "cerberus>=1.3.4,<2.0",
    "jinja2>=3.1.0,<4.0",
    "requests>=2.28.0,<3.0",
    "importlib_resources>=5.12.0,<7.0",
    "PyYAML>=6.0,<7.0",
    "importlib_metadata>=6.0.0,<8.0",

    # Command line interface
    "termcolor>=2.3.0,<3.0",
    "terminal_banner>=0.3.0,<1.0",
    "tqdm>=4.65.0,<5.0",
    "colorlog>=6.7.0,<7.0",

    # Docker support
    "docker>=6.0.0,<8.0",

    # Web interface dependencies
    "flask>=2.3.0,<4.0",
    "flask_session>=0.5.0,<1.0",
    "flask_wtf>=1.1.0,<2.0",
    "django>=4.2.0,<6.0",
    "flask-socketio>=5.3.0,<6.0",
    "Flask-Cors>=4.0.0,<5.0",
    "npf-web-extension>=1.0.0,<2.0",

    # Network and system utilities
    "execnet>=1.9.0,<3.0",
    "pexpect>=4.8.0,<5.0",
    "chardet>=5.0.0,<6.0",
    "gperf>=1.0",
    "pandas>=2.0.0,<3.0",
    "ply>=3.11,<4.0",
    "plantuml>=0.3.0,<1.0",
    "scapy>=2.5.0,<3.0",
    "argcomplete>=3.0.0,<4.0",

    # Metrics and monitoring
    "psutil>=5.9.0,<6.0"
]

[project.optional-dependencies]
# Same optional dependencies as enhanced version
tests = [
    "pytest>=7.3.0,<9.0",
    "pytest-cov>=4.1.0,<6.0",
    "hypothesis>=6.80.0,<7.0",
    "pytest-mock>=3.11.0,<4.0",
    "pytest-timeout>=2.1.0,<3.0",
    "pytest-xdist>=3.3.0,<4.0",
]

lint = [
    "black>=23.7.0,<25.0",
    "flake8>=6.0.0,<8.0",
    "pylint>=2.17.0,<4.0",
    "pre-commit>=3.3.0,<4.0",
    "isort>=5.12.0,<6.0",
    "mypy>=1.4.0,<2.0",
]

doc = [
    "mkdocs>=1.5.0,<2.0",
    "mkdocs-material>=9.1.0,<10.0",
    "mkdocs-minify-plugin>=0.7.0,<1.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0,<2.0",
    "mkdocs-git-authors-plugin>=0.7.0,<1.0",
    "mkdocs-table-reader-plugin>=2.0.0,<3.0",
    "mkdocs-img2fig-plugin>=0.9.0,<1.0",
    "mknotebooks>=0.8.0,<1.0",
    "mkdocs-awesome-pages-plugin>=2.9.0,<3.0",
    "mkdocs-enumerate-headings-plugin>=0.6.0,<1.0",
    "mkdocs-print-site-plugin>=2.3.0,<3.0",
    "mkgendocs>=0.9.0,<1.0",
    "markdown-callouts>=0.3.0,<1.0",
    "mkdocs-coverage>=1.0.0,<2.0",
    "pymdown-extensions>=10.0.0,<11.0",
    "mkdocs-material-extensions>=1.1.0,<2.0",
    "mkdocs-gen-files>=0.5.0,<1.0",
    "mkdocs-literate-nav>=0.6.0,<1.0",
    "mkdocs-section-index>=0.3.0,<1.0",
    "mkdocstrings[python]>=0.22.0,<1.0",
    "mkdocs-exclude>=1.0.0,<2.0",
    "mkdocs-same-dir>=0.1.0,<1.0",
    "mkdocs-mermaid2-plugin>=1.1.0,<2.0"
]

dev = [
    "panther-net[tests,lint,doc]",
    "twine>=4.0.0,<6.0",
    "build>=0.10.0,<2.0",
    "wheel>=0.41.0,<1.0",
    "hatch>=1.7.0,<2.0",
]

security = [
    "safety>=2.3.0,<4.0",
    "bandit[toml]>=1.7.5,<2.0",
    "semgrep>=1.45.0,<2.0",
    "pip-audit>=2.6.0,<3.0",
]

profiling = [
    "py-spy>=0.3.14,<1.0",
    "memory-profiler>=0.61.0,<1.0",
    "line-profiler>=4.1.0,<5.0",
]

[project.urls]
repository = "https://github.com/ElNiak/PANTHER"
documentation = "https://elniak.github.io/PANTHER/"
ivy = "https://github.com/ElNiak/PANTHER-Ivy"
issues = "https://github.com/ElNiak/PANTHER/issues"
changelog = "https://github.com/ElNiak/PANTHER/blob/main/CHANGELOG.md"

[project.scripts]
panther = "panther.__main__:main"
panther-metrics = "panther.metrics.cli:main"
panther-plugin-tool = "panther.plugins.plugin_migration_tool:create_cli"

# Hatchling-specific metadata
[tool.hatch.metadata]
allow-direct-references = true

# Build hooks configuration
[tool.hatch.build.hooks.vcs]
version-file = "panther/_version.py"

# Environment configuration for development
[tool.hatch.envs.default]
dependencies = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "mypy",
    "pre-commit",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "pytest --cov=panther --cov-report=html {args:tests}"
lint = [
    "black --check panther tests",
    "isort --check-only panther tests",
    "flake8 panther tests",
]
format = [
    "black panther tests",
    "isort panther tests",
]
typecheck = "mypy panther"

# Matrix testing configuration
[tool.hatch.envs.test]
dependencies = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "pytest-mock",
]

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12"]

[tool.hatch.envs.test.scripts]
run = "pytest {args}"

# Documentation environment
[tool.hatch.envs.docs]
dependencies = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[tool.hatch.envs.docs.scripts]
build = "mkdocs build"
serve = "mkdocs serve"
deploy = "mkdocs gh-deploy --force"