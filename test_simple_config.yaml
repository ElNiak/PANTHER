logging:
  level: INFO

paths:
  output_dir: "test_output"

docker:
  build_docker_image: false

tests:
  - name: "Simple QUIC Test"
    network_environment:
      type: docker_compose
    services:
      server:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          role: server
        timeout: 30
      client:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          role: client
          target: server
        timeout: 30
    steps:
      wait: 10