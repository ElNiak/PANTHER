general:
  stop_time: 60
  model_unblocked_syscall_latency:   false  


experimental:
  strace_logging_mode: ""


network:
  # TODO improve network configuration -> make more modular
  graph:
    type: gml
    inline: |
      graph [
        directed 0
        node [
            id 0
            host_bandwidth_down "100 Gbit"
            host_bandwidth_up "100 Gbit"
        ]
        edge [
            source 0
            target 0
            latency " ms"
            jitter " ms"
            packet_loss 
        ]
      ]

host_option_defaults:
  pcap_enabled:  false 

hosts:
  picoquic_server:
    # TODO improve process configuration -> make more modular (need better config format for experiment paramters and allowed values)
    network_node_id: 1
    ip_addr: 11.0.0.1

    processes:
    - path: /opt/picoquic/./picoquicdemo
      args: -c /opt/certs/cert.pem -k /opt/certs/key.pem -a hq-interop -l - -n servername -D -L  -e eth0  -p 4443 > /app/logs/server.log 2> /app/logs/server.err.log
      start_time: 1
      environment:
  picoquic_client:
    # TODO improve process configuration -> make more modular (need better config format for experiment paramters and allowed values)
    network_node_id: 0
    ip_addr: 11.0.0.2

    processes:
    - path: /opt/picoquic/./picoquicdemo
      args: -c /opt/certs/cert.pem -k /opt/certs/key.pem -T /opt/ticket/ticket.key -a hq-interop -l - -D -L  -e eth0   -v 00000001  picoquic_server 4443 > /app/logs/client.log 2> /app/logs/client.err.log
      start_time: 5
      environment:
