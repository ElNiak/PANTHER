general:
  # stop after  100 simulated seconds
  stop_time: 100s
  # old versions of cURL use a busy loop, so to avoid spinning in this busy
  # loop indefinitely, we add a system call latency to advance the simulated
  # time when running non-blocking system calls
  model_unblocked_syscall_latency: false

experimental:
  strace_logging_mode: "standard"

# TODO improve network configuration -> make more modular
network:
  graph:
    # use a built-in network graph containing
    # a single vertex with a bandwidth of 1 Gbit
    # type: 1_gbit_switch
    type: gml
    # file:
    # path: /app/topo.gml
    inline: |
      graph [
        directed 0
        node [
          id 0
          host_bandwidth_down "100 Gbit"
          host_bandwidth_up "100 Gbit"
        ]
        edge [
          source 0
          target 0
          latency "10 ms"
          jitter "10 ms"
          packet_loss 0.0
        ]
      ]

host_option_defaults:
  pcap_enabled: true

# TODO improve process configuration -> make more modular (need better config format for experiment paramters and allowed values)
hosts:
  picoquic.server:
    network_node_id: 0
    ip_addr: "11.0.0.1"
    processes:
    - path: /opt/picoquic_server/picoquic/./picoquicdemo
      args: -c /opt/certs/cert.pem -k /opt/certs/key.pem -a hq-interop -l - -n servername -D -L  -e eth0  -p 4443 
      start_time: 1s
      environment:
        SHADOW_TEST: "1"

  picoquic.client:
    network_node_id: 0
    ip_addr: "11.0.0.2"
    processes:
    - path: /opt/picoquic_client/picoquic/./picoquicdemo
      args: -c /opt/certs/cert.pem -k /opt/certs/key.pem -T /opt/ticket/ticket.key -a hq-interop -l - -D -L  -e eth0   -v 00000001  picoquic.server 4443 
      start_time: 5s
      environment:
        SHADOW_TEST: "1"

