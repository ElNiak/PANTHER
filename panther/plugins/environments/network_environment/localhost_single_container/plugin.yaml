# Localhost Single Container Network Environment Plugin Manifest
name: localhost_single_container
version: 1.0.0
type: environment
author: PANTHER Team
description: Single container network environment for running multiple services locally
license: MIT

# Compatibility
min_panther_version: 1.0.0

# Dependencies
dependencies: []

# Configuration schema
config_schema:
  type:
    type: string
    default: localhost_single_container
    const: localhost_single_container

  container_config:
    type: object
    properties:
      image_name:
        type: string
        default: panther-localhost-env
        description: Name for the Docker image

      build_context:
        type: string
        default: "."
        description: Docker build context path

      network_mode:
        type: string
        default: host
        enum: ["host", "bridge", "none"]
        description: Docker network mode

      volumes:
        type: array
        items:
          type: string
        description: Volume mappings

      environment:
        type: object
        additionalProperties:
          type: string
        description: Environment variables

# Capabilities
capabilities:
  - single_container
  - multi_service
  - fast_iteration
  - local_development
  - minimal_overhead

# Requirements
requirements:
  docker: ">=20.10.0"
  platform: ["linux", "darwin"]

# Tags
tags:
  - environment
  - network
  - localhost
  - container
  - development