general:
  stop_time:
    description: "The total simulation time in seconds."
    type: "string"
    default: "300s"
  model_unblocked_syscall_latency:
    description: "Whether to add latency for unblocked system calls to prevent busy loops."
    type: "boolean"
    default: false

experimental:
  strace_logging_mode:
    description: "The mode for strace logging. Options are 'none', 'standard', or 'detailed'."
    type: "string"
    default: "standard"

network:
  graph:
    description: "The network topology configuration."
    type: "object"
    fields:
      type:
        description: "The type of network graph. Options are '1_gbit_switch' or 'gml'."
        type: "string"
        default: "gml"
      nodes:
        description: "The nodes in the network graph."
        type: "list"
        items:
          id:
            description: "The ID of the network node."
            type: "integer"
          bandwidth_down:
            description: "The download bandwidth of the node."
            type: "string"
            default: "100 Gbit"
          bandwidth_up:
            description: "The upload bandwidth of the node."
            type: "string"
            default: "100 Gbit"
      edges:
        description: "The edges in the network graph."
        type: "list"
        items:
          source:
            description: "The source node ID for the edge."
            type: "integer"
          target:
            description: "The target node ID for the edge."
            type: "integer"
          latency:
            description: "The latency of the edge in milliseconds."
            type: "integer"
            default: 10
          jitter:
            description: "The jitter of the edge in milliseconds."
            type: "integer"
            default: 10
          packet_loss:
            description: "The packet loss rate for the edge."
            type: "number"
            default: 0.0

host_option_defaults:
  pcap_enabled:
    description: "Whether to enable PCAP capture for all hosts."
    type: "boolean"
    default: true

hosts:
  server:
    description: "The server configuration."
    network_node_id:
      description: "The network node ID for the server."
      type: "integer"
      default: 0
    ip_addr:
      description: "The IP address of the server."
      type: "string"
      default: "11.0.0.1"
    start_time:
      description: "The time at which the server process should start."
      type: "string"
      default: "1s"

  client:
    description: "The client configuration."
    network_node_id:
      description: "The network node ID for the client."
      type: "integer"
      default: 0
    ip_addr:
      description: "The IP address of the client."
      type: "string"
      default: "11.0.0.2"
    start_time:
      description: "The time at which the client process should start."
      type: "string"
      default: "5s"