name: quic_client_server_communication_test
# When no services are provided, a placeholder service is used
services:
  ivy_panther_ivy:
    image: panther_ivy_rfc9000_panther:latest
    container_name: ivy_panther_ivy
    stop_grace_period: 30s
    ports:
      - "4443:4443"
      - "4987:4987"
      - "8080:8080"
    environment:
      ROLE: server
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt"
      UID: "${UID}"
      GID: "${GID}"
      PROTOCOL_TESTED: "quic"
      RUST_LOG: "debug"
      RUST_BACKTRACE: "1"
      SOURCE_DIR: "/opt/"
      IVY_DIR: "$SOURCE_DIR/panther_ivy"
      PYTHON_IVY_DIR: "/usr/local/lib/python3.10/dist-packages/"
      IVY_INCLUDE_PATH: "$IVY_INCLUDE_PATH:/usr/local/lib/python3.10/dist-packages/ivy/include/1.7"
      Z3_LIBRARY_DIRS: "$IVY_DIR/submodules/z3/build"
      Z3_LIBRARY_PATH: "$IVY_DIR/submodules/z3/build"
      LD_LIBRARY_PATH: "$LD_LIBRARY_PATH:$IVY_DIR/submodules/z3/build"
      PROOTPATH: "$SOURCE_DIR"
      ADDITIONAL_PYTHONPATH: "/app/implementations/quic-implementations/aioquic/src/:$IVY_DIR/submodules/z3/build/python:$PYTHON_IVY_DIR"
      ADDITIONAL_PATH: "/go/bin:$IVY_DIR/submodules/z3/build"
      TEST_ALPN: "hq-interop"
      ZRTT_SSLKEYLOGFILE: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/last_tls_key.txt"
      RETRY_TOKEN_FILE: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/last_retry_token.txt"
      NEW_TOKEN_FILE: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/last_new_token.txt"
      ENCRYPT_TICKET_FILE: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/last_encrypt_session_ticket.txt"
      SESSION_TICKET_FILE: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/last_session_ticket_cb.txt"
      SAVED_PACKET: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/saved_packet.txt"
      initial_max_stream_id_bidi: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/initial_max_stream_id_bidi.txt"
      active_connection_id_limit: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/active_connection_id_limit.txt"
      initial_max_stream_data_bidi_local: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/initial_max_stream_data_bidi_local.txt"
      initial_max_stream_data_bidi_remote: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/initial_max_stream_data_bidi_remote.txt"
      initial_max_stream_data_uni: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/initial_max_stream_data_uni.txt"
      initial_max_data: "$SOURCE_DIR/panther_ivy/protocol-testing/quic/initial_max_data.txt"
      INITIAL_VERSION: "1"
      TEST_TYPE: "client"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/panther_ivy/protocol-testing/quic/"
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod +x /app/entrypoint.sh \
        && exec /app/entrypoint.sh

    # TODO fix sudo tshark
    volumes:
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-06-13_01-01-15/QUIC_Client_Server_Communication_Test/logs/ivy_panther_ivy:/app/logs/
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-06-13_01-01-15/QUIC_Client_Server_Communication_Test/entrypoint_ivy_panther_ivy.sh:/app/entrypoint.sh
      - "/Users/elniak/Documents/Project/PANTHER/panther/plugins/services/testers/panther_ivy/ivy/include/1.7:/opt/panther_ivy/ivy/include/1.7"
      - "/Users/elniak/Documents/Project/PANTHER/panther/plugins/services/testers/panther_ivy/protocol-testing/quic:/opt/panther_ivy/protocol-testing/quic"
      - "shared_logs:/app/sync_logs"
    networks:
      panther_network:
        aliases:
          - ivy_panther_ivy
  picoquic_client:
    image: picoquic_rfc9000_panther:latest
    container_name: picoquic_client
    stop_grace_period: 30s
    ports:
      - "5000:5000"
      - "8081:8081"
    environment:
      ROLE: client
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt"
      UID: "${UID}"
      GID: "${GID}"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/picoquic"
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod +x /app/entrypoint.sh \
        && exec /app/entrypoint.sh

    # TODO fix sudo tshark
    volumes:
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-06-13_01-01-15/QUIC_Client_Server_Communication_Test/logs/picoquic_client:/app/logs/
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-06-13_01-01-15/QUIC_Client_Server_Communication_Test/entrypoint_picoquic_client.sh:/app/entrypoint.sh
      - "shared_logs:/app/sync_logs"
    networks:
      panther_network:
        aliases:
          - picoquic_client

networks:
  panther_network:
    driver: bridge

volumes:
  shared_logs:
    driver: local