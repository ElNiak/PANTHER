name: Fuzz_QUIC_IyvClient_Server_Communication_Test
services:
  picoquic_server:
    image: picoquic_rfc9000_panther:latest
    container_name: picoquic_server
    ports:
      - "4443:4443"
    environment:
      ROLE: server
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt" 
      UID: "${UID}"
      GID: "${GID}"
      DISPLAY: "${DISPLAY}"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/picoquic"
    command: 
      - /bin/sh -c '
          set -x;
          export PATH=$$PATH:$$ADDITIONAL_PATH;
          export PYTHONPATH=$$PYTHONPATH:$$ADDITIONAL_PYTHONPATH;
          env >> /app/logs/ivy_setup.log;
          while [ ! -f /app/sync_logs/ivy_ready.log ]; do
          	echo "Waiting for Ivy testers to be ready..." >> /app/logs/tester_ready.log;
          	sleep 2;
          done;
          echo "Ivy testers is ready, starting picoquic_server..." >> /app/logs/tester_ready.log;
          (touch /app/logs/picoquic_server.pcap; tshark -a duration:60 -i any -w /app/logs/picoquic_server.pcap > /app/logs/tshark_logs.log) & 
          (echo "Running   timeout 60  ./picoquicdemo -a hq-interop -l - -n servername -D -L  -e eth0  -p 4443 > /app/logs/server.log 2> /app/logs/server.err.log" >> /app/logs/picoquic_server_setup.log;) &
          (cd /opt/picoquic;   timeout 60  ./picoquicdemo -a hq-interop -l - -n servername -D -L  -e eth0  -p 4443 > /app/logs/server.log 2> /app/logs/server.err.log)
 
          && ( cp /opt/picoquic/picoquicdemo /app/logs/picoquicdemo; )'
          

    # TODO fix sudo tshark
    volumes:
      - /home/crochetch/Documents/Projects/VerificationQUIC/SCP-TEST/PANTHER/outputs/2024-12-24_12-21-17_unnamed_experiment/Fuzz_QUIC_IyvClient_Server_Communication_Test/logs/picoquic_server:/app/logs/
      - "shared_logs:/app/sync_logs"
    networks:
      panther_network:
        aliases: 
          - picoquic_server
  picoquic_client:
    image: picoquic_rfc9000_panther:latest
    container_name: picoquic_client
    ports:
      - "8081:8081"
    depends_on:
      - fuzz_in_the_middle
    environment:
      ROLE: client
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt" 
      UID: "${UID}"
      GID: "${GID}"
      DISPLAY: "${DISPLAY}"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/picoquic"
    command: 
      - /bin/sh -c '
          set -x;
          export PATH=$$PATH:$$ADDITIONAL_PATH;
          export PYTHONPATH=$$PYTHONPATH:$$ADDITIONAL_PYTHONPATH;
          env >> /app/logs/ivy_setup.log;
          while [ ! -f /app/sync_logs/ivy_ready.log ]; do
          	echo "Waiting for Ivy testers to be ready..." >> /app/logs/tester_ready.log;
          	sleep 2;
          done;
          echo "Ivy testers is ready, starting picoquic_client..." >> /app/logs/tester_ready.log;
          (touch /app/logs/picoquic_client.pcap; tshark -a duration:60 -i any -w /app/logs/picoquic_client.pcap > /app/logs/tshark_logs.log) & 
          (echo "Running   timeout 60  ./picoquicdemo -T /opt/ticket/ticket.key -a hq-interop -l - -D -L  -e lo   -v 00000001  fuzz_in_the_middle 8080 > /app/logs/client.log 2> /app/logs/client.err.log" >> /app/logs/picoquic_client_setup.log;) &
          (sleep 5; cd /opt/picoquic;   timeout 60  ./picoquicdemo -T /opt/ticket/ticket.key -a hq-interop -l - -D -L  -e lo   -v 00000001  fuzz_in_the_middle 8080 > /app/logs/client.log 2> /app/logs/client.err.log)
 
          && ( cp /opt/picoquic/picoquicdemo /app/logs/picoquicdemo; )'
          

    # TODO fix sudo tshark
    volumes:
      - /home/crochetch/Documents/Projects/VerificationQUIC/SCP-TEST/PANTHER/outputs/2024-12-24_12-21-17_unnamed_experiment/Fuzz_QUIC_IyvClient_Server_Communication_Test/logs/picoquic_client:/app/logs/
      - "shared_logs:/app/sync_logs"
    networks:
      panther_network:
        aliases: 
          - picoquic_client
  fuzz_in_the_middle:
    image: panther_fuzz_in_the_middle_rfc9000_panther:latest
    container_name: fuzz_in_the_middle
    ports:
      - "8080:8080"
      - "1883:1883"
    environment:
      ROLE: mitm
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt" 
      UID: "${UID}"
      GID: "${GID}"
      IN_DOCKER: "true"
      TEST_TYPE: "mitm"
      DISPLAY: "${DISPLAY}"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/panther_fuzz_in_the_middle/"
    command: 
      - /bin/sh -c '
          set -x;
          export PATH=$$PATH:$$ADDITIONAL_PATH;
          export PYTHONPATH=$$PYTHONPATH:$$ADDITIONAL_PYTHONPATH;
          env >> /app/logs/ivy_setup.log;
          TARGET_IP=$(getent hosts picoquic_server | awk "{ print \$1 }");
          echo "Resolved picoquic_server IP - $$TARGET_IP" >> /app/logs/ivy_setup.log;
          IVY_IP=$(hostname -I | awk "{ print \$1 }");
          echo "Resolved  fuzz_in_the_middle IP - $$IVY_IP" >> /app/logs/ivy_setup.log;
           
          ip_to_hex() {
            echo $1 | awk -F"." "{ printf(\"%02X%02X%02X%02X\", \$1, \$2, \$3, \$4) }";
          }
           
          ip_to_decimal() {
            echo $1 | awk -F"." "{ printf(\"%.0f\", (\$1 * 256 * 256 * 256) + (\$2 * 256 * 256) + (\$3 * 256) + \$4) }";
          }
           
          TARGET_IP_HEX=$(ip_to_decimal $$TARGET_IP);
          IVY_IP_HEX=$(ip_to_decimal $$IVY_IP);
          echo "Resolved picoquic_server IP in hex - $$TARGET_IP_HEX" >> /app/logs/ivy_setup.log;
          echo "Resolved fuzz_in_the_middle IP in hex - $$IVY_IP_HEX" >> /app/logs/ivy_setup.log;
          (cd /opt/panther_fuzz_in_the_middle/; ant; mkdir /tmp/logs/; touch /tmp/logs/trace.txt;) 
           && 
           (touch /app/sync_logs/ivy_ready.log) && 
          (touch /app/logs/fuzz_in_the_middle.pcap; tshark -a duration:100 -i any -w /app/logs/fuzz_in_the_middle.pcap > /app/logs/tshark_logs.log) & 
          (echo "Running  java -jar dist/binfuzz-cli.jar  startproxy udp-quic picoquic_server 4443 > /app/logs/testers.log 2> /app/logs/testers.err" >> /app/logs/fuzz_in_the_middle_setup.log;) &
          (cd /opt/panther_fuzz_in_the_middle/;  java -jar dist/binfuzz-cli.jar  startproxy udp-quic picoquic_server 4443 > /app/logs/testers.log 2> /app/logs/testers.err)
 
          && ( cp /tmp/logs/trace.txt /app/logs/fuzz_in_the_middle_trace.txt; )'
          

    # TODO fix sudo tshark
    volumes:
      - /home/crochetch/Documents/Projects/VerificationQUIC/SCP-TEST/PANTHER/outputs/2024-12-24_12-21-17_unnamed_experiment/Fuzz_QUIC_IyvClient_Server_Communication_Test/logs/fuzz_in_the_middle:/app/logs/
      - "shared_logs:/app/sync_logs"
      - "/tmp/.X11-unix:/tmp/.X11-unix"
    networks:
      panther_network:
        aliases: 
          - fuzz_in_the_middle

networks:
  panther_network:
    driver: bridge

volumes:
  shared_logs:
    driver: local