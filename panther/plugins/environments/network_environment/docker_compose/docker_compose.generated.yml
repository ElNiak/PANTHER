name: quic_iyvclient_server_test
# When no services are provided, a placeholder service is used
services:
  placeholder:
    image: alpine:latest
    container_name: placeholder
    command: ["echo", "No services defined, using placeholder"]
    networks:
      - panther_network

networks:
  panther_network:
    driver: bridge

volumes:
  shared_logs:
    driver: local