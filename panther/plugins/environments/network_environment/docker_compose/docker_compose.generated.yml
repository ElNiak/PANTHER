name: quic_ivyclient_server_communication_test___strace
services:
  picoquic_server:
    image: picoquic_rfc9000_panther:latest
    container_name: picoquic_server
    stop_grace_period: 30s
    ports:
      - "4443:4443"
      - "8080:8080"
    environment:
      ROLE: server
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt" 
      UID: "${UID}"
      GID: "${GID}"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/picoquic"
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod +x /app/entrypoint.sh \
        && exec /app/entrypoint.sh
          
    # TODO fix sudo tshark
    volumes:
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-05-24_23-33-54/QUIC_IvyClient_Server_Communication_Test___Strace/logs/picoquic_server:/app/logs/
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-05-24_23-33-54/QUIC_IvyClient_Server_Communication_Test___Strace/entrypoint_picoquic_server.sh:/app/entrypoint.sh
      - "shared_logs:/app/sync_logs"
    networks:
      panther_network:
        aliases: 
          - picoquic_server
  ivy_client:
    image: panther_ivy_rfc9000_panther:latest
    container_name: ivy_client
    stop_grace_period: 30s
    ports:
      - "5000:5000"
      - "4987:4987"
      - "8081:8081"
    environment:
      ROLE: client
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt" 
      UID: "${UID}"
      GID: "${GID}"
      PROTOCOL_TESTED: "quic"
      RUST_LOG: "debug"
      RUST_BACKTRACE: "1"
      SOURCE_DIR: "/opt/"
      IVY_DIR: "/opt//panther_ivy"
      PYTHON_IVY_DIR: "/usr/local/lib/python3.10/dist-packages/"
      IVY_INCLUDE_PATH: "$$IVY_INCLUDE_PATH:/usr/local/lib/python3.10/dist-packages/ivy/include/1.7"
      Z3_LIBRARY_DIRS: "/opt//panther_ivy/submodules/z3/build"
      Z3_LIBRARY_PATH: "/opt//panther_ivy/submodules/z3/build"
      LD_LIBRARY_PATH: "$$LD_LIBRARY_PATH:/opt//panther_ivy/submodules/z3/build"
      PROOTPATH: "/opt/"
      ADDITIONAL_PYTHONPATH: "/app/implementations/quic-implementations/aioquic/src/:/opt//panther_ivy/submodules/z3/build/python:/usr/local/lib/python3.10/dist-packages/"
      ADDITIONAL_PATH: "/go/bin:/opt//panther_ivy/submodules/z3/build"
      TEST_ALPN: "hq-interop"
      ZRTT_SSLKEYLOGFILE: "/opt//panther_ivy/protocol-testing/quic/last_tls_key.txt"
      RETRY_TOKEN_FILE: "/opt//panther_ivy/protocol-testing/quic/last_retry_token.txt"
      NEW_TOKEN_FILE: "/opt//panther_ivy/protocol-testing/quic/last_new_token.txt"
      ENCRYPT_TICKET_FILE: "/opt//panther_ivy/protocol-testing/quic/last_encrypt_session_ticket.txt"
      SESSION_TICKET_FILE: "/opt//panther_ivy/protocol-testing/quic/last_session_ticket_cb.txt"
      SAVED_PACKET: "/opt//panther_ivy/protocol-testing/quic/saved_packet.txt"
      initial_max_stream_id_bidi: "/opt//panther_ivy/protocol-testing/quic/initial_max_stream_id_bidi.txt"
      active_connection_id_limit: "/opt//panther_ivy/protocol-testing/quic/active_connection_id_limit.txt"
      initial_max_stream_data_bidi_local: "/opt//panther_ivy/protocol-testing/quic/initial_max_stream_data_bidi_local.txt"
      initial_max_stream_data_bidi_remote: "/opt//panther_ivy/protocol-testing/quic/initial_max_stream_data_bidi_remote.txt"
      initial_max_stream_data_uni: "/opt//panther_ivy/protocol-testing/quic/initial_max_stream_data_uni.txt"
      initial_max_data: "/opt//panther_ivy/protocol-testing/quic/initial_max_data.txt"
      INITIAL_VERSION: "1"
      TEST_TYPE: "server"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/panther_ivy/protocol-testing/quic/"
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod +x /app/entrypoint.sh \
        && exec /app/entrypoint.sh
          
    # TODO fix sudo tshark
    volumes:
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-05-24_23-33-54/QUIC_IvyClient_Server_Communication_Test___Strace/logs/ivy_client:/app/logs/
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-05-24_23-33-54/QUIC_IvyClient_Server_Communication_Test___Strace/entrypoint_ivy_client.sh:/app/entrypoint.sh
      - "/Users/elniak/Documents/Project/PANTHER/panther/plugins/services/testers/panther_ivy/ivy/include/1.7:/opt/panther_ivy/ivy/include/1.7"
      - "/Users/elniak/Documents/Project/PANTHER/panther/plugins/services/testers/panther_ivy/protocol-testing/quic:/opt/panther_ivy/protocol-testing/quic"
      - "shared_logs:/app/sync_logs"
    networks:
      panther_network:
        aliases: 
          - ivy_client

networks:
  panther_network:
    driver: bridge

volumes:
  shared_logs:
    driver: local