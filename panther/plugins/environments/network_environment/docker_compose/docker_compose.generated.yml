name: quic_client_server_communication_test
# When no services are provided, a placeholder service is used
services:
  ivy_panther_ivy:
    image: panther_ivy_rfc9000_panther:latest
    container_name: ivy_panther_ivy
    stop_grace_period: 30s
    ports:
      - "4443:4443"
      - "4987:4987"
      - "8080:8080"
    environment:
      ROLE: server
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt"
      UID: "${UID}"
      GID: "${GID}"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: ""
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod +x /app/entrypoint.sh \
        && exec /app/entrypoint.sh

    # TODO fix sudo tshark
    volumes:
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-06-11_19-49-14/QUIC_Client_Server_Communication_Test/logs/ivy_panther_ivy:/app/logs/
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-06-11_19-49-14/QUIC_Client_Server_Communication_Test/entrypoint_ivy_panther_ivy.sh:/app/entrypoint.sh
    networks:
      panther_network:
        aliases:
          - ivy_panther_ivy
  picoquic_client:
    image: picoquic_rfc9000_panther:latest
    container_name: picoquic_client
    stop_grace_period: 30s
    ports:
      - "5000:5000"
      - "8081:8081"
    environment:
      ROLE: client
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt"
      UID: "${UID}"
      GID: "${GID}"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/picoquic"
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod +x /app/entrypoint.sh \
        && exec /app/entrypoint.sh

    # TODO fix sudo tshark
    volumes:
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-06-11_19-49-14/QUIC_Client_Server_Communication_Test/logs/picoquic_client:/app/logs/
      - /Users/elniak/Documents/Project/PANTHER/outputs/2025-06-11_19-49-14/QUIC_Client_Server_Communication_Test/entrypoint_picoquic_client.sh:/app/entrypoint.sh
      - "shared_logs:/app/sync_logs"
    networks:
      panther_network:
        aliases:
          - picoquic_client

networks:
  panther_network:
    driver: bridge

volumes:
  shared_logs:
    driver: local