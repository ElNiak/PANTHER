name: .
# When no services are provided, a placeholder service is used
services:
  ivy_client:
    image: panther_ivy_rfc9000:latest
    container_name: ivy_client
    stop_grace_period: 30s
    ports:
      - "5000:5000"
      - "4987:4987"
      - "8081:8081"
    environment:
      ROLE: client
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt"
      UID: "${UID}"
      GID: "${GID}"
    tty: true
    stdin_open: true
    hostname: ivy_client
    domainname: panther.local
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/app"
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod +x /app/entrypoint.sh \
        && exec /app/entrypoint.sh

    # TODO fix sudo tshark
    volumes:
      - /Users/elniak/Documents/Project/PANTHER/logs/ivy_client:/app/logs/
      - /Users/elniak/Documents/Project/PANTHER/entrypoint_ivy_client.sh:/app/entrypoint.sh
      - "/Users/elniak/Documents/Project/PANTHER/panther/plugins/services/testers/panther_ivy/ivy/include/1.7:/opt/panther_ivy/ivy/include/1.7"
      - "/Users/elniak/Documents/Project/PANTHER/panther/plugins/services/testers/panther_ivy/protocol-testing/quic:/opt/panther_ivy/protocol-testing/quic/"
      - "shared_logs:/app/sync_logs"
    networks:
      panther_network:
        aliases:
          - ivy_client
  picoquic_server:
    image: picoquic_rfc9000:latest
    container_name: picoquic_server
    stop_grace_period: 30s
    ports:
      - "4443:4443"
      - "8080:8080"
    environment:
      ROLE: server
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt"
      UID: "${UID}"
      GID: "${GID}"
    tty: true
    stdin_open: true
    hostname: picoquic_server
    domainname: panther.local
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/picoquic"
    entrypoint:
      - /bin/sh
      - -c
      - |
        chmod +x /app/entrypoint.sh \
        && exec /app/entrypoint.sh

    # TODO fix sudo tshark
    volumes:
      - /Users/elniak/Documents/Project/PANTHER/logs/picoquic_server:/app/logs/
      - /Users/elniak/Documents/Project/PANTHER/entrypoint_picoquic_server.sh:/app/entrypoint.sh
    networks:
      panther_network:
        aliases:
          - picoquic_server

networks:
  panther_network:
    driver: bridge

volumes:
  shared_logs:
    driver: local