name: Minip_Client_Server_Random_Communication_Test
services:
  ping_pong_client:
    image: ping_pong_random_panther:latest
    container_name: ping_pong_client
    ports:
      - "5000:5000"
      - "8081:8081"
    environment:
      ROLE: client
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt" 
      UID: "${UID}"
      GID: "${GID}"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/ping-pong/"
    command: 
      - /bin/sh -c '
          set -x;
          export PATH=$$PATH:$$ADDITIONAL_PATH;
          export PYTHONPATH=$$PYTHONPATH:$$ADDITIONAL_PYTHONPATH;
          env >> /app/logs/ivy_setup.log;
          TARGET_IP=$(getent hosts ping_pong_server | awk "{ print \$1 }");
          echo "Resolved ping_pong_server IP - $$TARGET_IP" >> /app/logs/ivy_setup.log;
          IVY_IP=$(hostname -I | awk "{ print \$1 }");
          echo "Resolved  ping_pong_client IP - $$IVY_IP" >> /app/logs/ivy_setup.log;
           
          ip_to_hex() {
            echo $1 | awk -F"." "{ printf(\"%02X%02X%02X%02X\", \$1, \$2, \$3, \$4) }";
          }
           
          ip_to_decimal() {
            echo $1 | awk -F"." "{ printf(\"%.0f\", (\$1 * 256 * 256 * 256) + (\$2 * 256 * 256) + (\$3 * 256) + \$4) }";
          }
           
          TARGET_IP_HEX=$(ip_to_decimal $$TARGET_IP);
          IVY_IP_HEX=$(ip_to_decimal $$IVY_IP);
          echo "Resolved ping_pong_server IP in hex - $$TARGET_IP_HEX" >> /app/logs/ivy_setup.log;
          echo "Resolved ping_pong_client IP in hex - $$IVY_IP_HEX" >> /app/logs/ivy_setup.log;
          (touch /app/logs/ping_pong_client.pcap; tshark -a duration:100 -i any -w /app/logs/ping_pong_client.pcap;) & 
          echo "Running timeout 100 ./miniP_client -p 4443 -i $$TARGET_IP_HEX > /app/logs/client.log 2> /app/logs/client.err.log" >> /app/logs/ping_pong_client_setup.log;
          (sleep 5; timeout 100 ./miniP_client -p 4443 -i $$TARGET_IP_HEX > /app/logs/client.log 2> /app/logs/client.err.log)
 
          && ( cp /opt/ping-pong/miniP_* /app/logs/miniP_*; )'
          

    # TODO fix sudo tshark
    volumes:
      - /home/crochetch/Documents/Projects/VerificationQUIC/PANTHER-SCP/outputs/experiment_2024-12-11_15-48-27/Minip_Client_Server_Random_Communication_Test/logs/ping_pong_client:/app/logs/
    networks:
      panther_network:
        aliases: 
          - ping_pong_client
  ping_pong_server:
    image: ping_pong_random_panther:latest
    container_name: ping_pong_server
    ports:
      - "4443:4443"
      - "4987:4987"
      - "8080:8080"
    environment:
      ROLE: server
      SSLKEYLOGFILE: "/app/logs/sslkeylogfile.txt" 
      UID: "${UID}"
      GID: "${GID}"
    tty: true
    stdin_open: true
    # TODO fix in the docker
    cap_add:
      - CAP_NET_ADMIN
      - CAP_NET_RAW
    working_dir: "/opt/ping-pong/"
    command: 
      - /bin/sh -c '
          set -x;
          export PATH=$$PATH:$$ADDITIONAL_PATH;
          export PYTHONPATH=$$PYTHONPATH:$$ADDITIONAL_PYTHONPATH;
          env >> /app/logs/ivy_setup.log;
          TARGET_IP=$(getent hosts  | awk "{ print \$1 }");
          echo "Resolved  IP - $$TARGET_IP" >> /app/logs/ivy_setup.log;
          IVY_IP=$(hostname -I | awk "{ print \$1 }");
          echo "Resolved  ping_pong_server IP - $$IVY_IP" >> /app/logs/ivy_setup.log;
           
          ip_to_hex() {
            echo $1 | awk -F"." "{ printf(\"%02X%02X%02X%02X\", \$1, \$2, \$3, \$4) }";
          }
           
          ip_to_decimal() {
            echo $1 | awk -F"." "{ printf(\"%.0f\", (\$1 * 256 * 256 * 256) + (\$2 * 256 * 256) + (\$3 * 256) + \$4) }";
          }
           
          TARGET_IP_HEX=$(ip_to_decimal $$TARGET_IP);
          IVY_IP_HEX=$(ip_to_decimal $$IVY_IP);
          echo "Resolved  IP in hex - $$TARGET_IP_HEX" >> /app/logs/ivy_setup.log;
          echo "Resolved ping_pong_server IP in hex - $$IVY_IP_HEX" >> /app/logs/ivy_setup.log;
          (touch /app/logs/ping_pong_server.pcap; tshark -a duration:60 -i any -w /app/logs/ping_pong_server.pcap;) & 
          echo "Running timeout 60 ./miniP_server -p 4443 -i 127.0.0.1 > /app/logs/server.log 2> /app/logs/server.err.log" >> /app/logs/ping_pong_server_setup.log;
          (timeout 60 ./miniP_server -p 4443 -i 127.0.0.1 > /app/logs/server.log 2> /app/logs/server.err.log)
 
          && ( cp /opt/ping-pong/miniP_* /app/logs/miniP_*; )'
          

    # TODO fix sudo tshark
    volumes:
      - /home/crochetch/Documents/Projects/VerificationQUIC/PANTHER-SCP/outputs/experiment_2024-12-11_15-48-27/Minip_Client_Server_Random_Communication_Test/logs/ping_pong_server:/app/logs/
    networks:
      panther_network:
        aliases: 
          - ping_pong_server

networks:
  panther_network:
    driver: bridge

volumes:
  shared_logs:
    driver: local