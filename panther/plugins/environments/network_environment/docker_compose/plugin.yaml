# Docker Compose Network Environment Plugin Manifest
name: docker_compose
version: 1.0.0
type: environment
author: PANTHER Team
description: Docker Compose-based network environment for containerized service orchestration
license: MIT

# Compatibility
min_panther_version: 1.0.0

# Dependencies
dependencies:
  - name: docker
    version_spec: ">=20.10.0"

# Configuration schema
config_schema:
  type:
    type: string
    enum: ["docker_compose"]
    default: docker_compose
    description: Environment type identifier

  version:
    type: string
    default: "3.8"
    description: Docker Compose file version

  network_name:
    type: string
    default: panther_network
    description: Name for the Docker network

  volumes:
    type: array
    items:
      type: string
    description: Additional volumes to mount

  environment:
    type: object
    description: Environment variables to set

  build_args:
    type: object
    description: Build arguments for Docker images

# Default configuration
default_config:
  type: docker_compose
  version: "3.8"
  network_name: panther_network
  volumes: []
  environment: {}
  build_args: {}

# Capabilities
capabilities:
  - container_orchestration
  - network_isolation
  - volume_management
  - service_discovery
  - health_checks
  - log_aggregation

# Supported events
supported_events:
  - environment_setup_started
  - environment_setup_completed
  - environment_teardown_started
  - environment_teardown_completed
  - service_deployed
  - service_started
  - service_stopped

# Tags
tags:
  - network
  - docker
  - containerization
  - orchestration