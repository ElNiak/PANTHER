picoquic_shadow:
  shadow_compatible: True
  versions:
    rfc9000:
      commit: "master"
      dependencies:
        - name: "picotls"
          url: "https://github.com/h2o/picotls.git"
          commit: "7d294ab4f2e0ed749b4bcfaf533225a4e0c096f7"

      client:
        initial_version: "00000001"
        protocol:
          alpn:
            param: "-a"
            value: "hq-interop"
          additional_parameters: "-l - -D -L"
        binary:
          dir: "/opt/picoquic"
          name: "./picoquicdemo"
        network:
          interface:
            param: "-e"
            value: "eth0"
          port: 4443
          destination: "11.0.0.1"
        certificates:
          cert:
            param: "-c"
            file: "/opt/certs/cert.pem"
            local_file: "config/certs/cert.pem"
          key:
            param: "-k"
            file: "/opt/certs/key.pem"
            local_file: "config/certs/key.pem"
        ticket_file:
          param: "-T"
          file: "/opt/ticket/ticket.key"
          local_file: "config/tls_keys/"
        logging:
          log_path: "/app/logs/client.log"
          qlog:
            param: "-q"
            path: "/app/logs/client.qlog"

      server:
        initial_version: "00000001"
        protocol:
          alpn:
            param: "-a"
            value: "hq-interop"
          additional_parameters: "-l - -n servername -D -L"
        binary:
          dir: "/opt/picoquic"
          name: "./picoquicdemo"
        network:
          interface:
            param: "-e"
            value: "eth0"
          port: 4443
          destination: "11.0.0.1"
        certificates:
          cert:
            param: "-c"
            file: "/opt/certs/cert.pem"
            local_file: "config/certs/cert.pem"
          key:
            param: "-k"
            file: "/opt/certs/key.pem"
            local_file: "config/certs/key.pem"
        ticket_file:
          param: "-T"
          file: "/opt/ticket/ticket.key"
          local_file: "config/tls_keys/"
        logging:
          log_path: "/app/logs/server.log"
          qlog:
            param: "-q"
            path: "/app/logs/server.qlog"