# PicoQUIC Plugin Manifest
name: picoquic
version: 1.0.0
type: iut
author: PANTHER Team
description: PicoQUIC - Minimalist implementation of the QUIC protocol
license: MIT
homepage: https://github.com/private-octopus/picoquic

# Compatibility
min_panther_version: 1.0.0

# Dependencies
dependencies:
  - name: quic_protocol
    version_spec: ">=1.0.0"
    plugin_type: protocol

# Configuration schema
config_schema:
  timeout:
    type: number
    default: 60
    description: Service execution timeout in seconds

  certificates:
    type: object
    properties:
      cert_file:
        type: string
        description: Path to certificate file
      key_file:
        type: string
        description: Path to private key file

  server:
    type: object
    properties:
      port:
        type: number
        default: 4443
      binary:
        type: object
        properties:
          name:
            type: string
            default: picoquicdemo
          dir:
            type: string
            default: /opt/picoquic

  client:
    type: object
    properties:
      binary:
        type: object
        properties:
          name:
            type: string
            default: picoquicdemo
          dir:
            type: string
            default: /opt/picoquic

# Default configuration
default_config:
  timeout: 60
  generate_new_certificates: true
  server:
    port: 4443
    binary:
      name: picoquicdemo
      dir: /opt/picoquic
  client:
    binary:
      name: picoquicdemo
      dir: /opt/picoquic

# Supported protocols
supported_protocols:
  - quic
  - http3

# Capabilities
capabilities:
  - tls13
  - 0rtt
  - connection_migration
  - multipath
  - datagram
  - version_negotiation

# Tags for categorization
tags:
  - quic
  - implementation
  - c
  - minimalist
  - research