# AioQUIC IUT Plugin Manifest
name: aioquic
version: 1.0.0
type: iut
author: PANTHER Team
description: AioQUIC - Python asyncio QUIC implementation
license: MIT

# Compatibility
min_panther_version: 1.0.0

# Dependencies
dependencies:
  - name: quic_protocol
    version_spec: ">=1.0.0"
    plugin_type: protocol

# Configuration schema
config_schema:
  timeout:
    type: number
    default: 60
    description: Connection timeout in seconds

  implementation:
    type: object
    properties:
      name:
        type: string
        default: aioquic
      type:
        type: string
        enum: ["iut", "IUT"]
        default: iut

  protocol:
    type: object
    properties:
      name:
        type: string
        default: quic
      version:
        type: string
        default: rfc9000
      role:
        type: string
        enum: ["server", "client"]
      target:
        type: string
        description: Target service name for client connections

  generate_new_certificates:
    type: boolean
    default: true
    description: Generate new certificates for this service

  ports:
    type: array
    items:
      type: string
    description: Port mappings for the service

# Supported protocols
supported_protocols:
  - quic
  - http3

# Capabilities
capabilities:
  - tls13
  - 0rtt
  - connection_migration
  - multipath_draft
  - datagram_draft

# Tags
tags:
  - implementation
  - quic
  - python
  - asyncio