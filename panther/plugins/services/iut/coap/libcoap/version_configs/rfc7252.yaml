version: "rfc7252"
commit: "d4f78cd5600a15a0599db21d3d2eb34a36c8c209"
# TODO - the template should be defined in the plugin protocols
server:
  binary:
    dir: "/opt/libcoap/libcoap-minimal/"
    name: "./server"
  network:
    port: 4443
    source: "127.0.0.1"
  logging:
    log_path: "/app/logs/artifacts/server.log"
    err_path: "/app/logs/artifacts/server.err.log"
    qlog:
      param: "-q"
      path: "/app/logs/artifacts/server.qlog"

client:
  binary:
    dir: "/opt/libcoap/libcoap-minimal/"
    name: "./client"
  network:
    port: 4443
    destination: "11.0.0.1"
  logging:
    log_path: "/app/logs/artifacts/client.log"
    err_path: "/app/logs/artifacts/client.err.log"
    qlog:
      param: "-q"
      path: "/app/logs/artifacts/client.qlog"
