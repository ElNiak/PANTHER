version: "rfc4271"
commit: "v8.4.1"
server:
  as_number: 2
  router_id: "@{self_service:ip:decimal}"
  neighbor_ip: "@{client_service:ip:decimal}"
  neighbor_as: 1
  hold_time: 180
  keepalive_time: 60
  listen_port: 179
  binary:
    dir: "/usr/lib/frr"
    name: "bgpd"
  logging:
    log_path: "/tmp/frr/bgpd.log"
    err_path: "/tmp/frr/bgpd.err.log"
