# QUIC Protocol Plugin Manifest
name: quic_protocol
version: 1.0.0
type: protocol
author: PANTHER Team
description: QUIC protocol plugin supporting RFC 9000 and draft versions
license: MIT

# Compatibility
min_panther_version: 1.0.0

# Dependencies (protocols typically don't have dependencies)
dependencies: []

# Configuration schema
config_schema:
  version:
    type: string
    default: rfc9000
    enum: ["rfc9000", "draft-29", "draft-34"]
    description: QUIC protocol version

  role:
    type: string
    enum: ["client", "server"]
    required: true
    description: Role in the QUIC connection

  target:
    type: string
    description: Target service name for client connections

  connection_parameters:
    type: object
    properties:
      initial_max_data:
        type: number
        default: 1048576
      initial_max_stream_data_bidi_local:
        type: number
        default: 524288
      initial_max_stream_data_bidi_remote:
        type: number
        default: 524288
      initial_max_stream_data_uni:
        type: number
        default: 524288
      initial_max_streams_bidi:
        type: number
        default: 100
      initial_max_streams_uni:
        type: number
        default: 100
      ack_delay_exponent:
        type: number
        default: 3
      max_ack_delay:
        type: number
        default: 25
      disable_active_migration:
        type: boolean
        default: false

# Protocol information
protocol_info:
  transport: UDP
  port: 443
  encryption: TLS 1.3
  multiplexing: true
  reliability: true
  ordered_delivery: true
  congestion_control: true

# Supported features
features:
  - stream_multiplexing
  - connection_migration
  - 0rtt_resumption
  - datagram_support
  - multipath_extensions

# Tags
tags:
  - protocol
  - quic
  - transport
  - encrypted