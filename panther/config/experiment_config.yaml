logging:
  level: DEBUG
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "configs"
  plugin_dir: "plugins"
docker:
  build_docker_image: True
generate_new_certificates: True  
tests:
  - name: "QUIC IyvClient-Server Communication Test"
    description: "Verify that the Picoquic server can communicate with the Ivy-Tester client over Docker Compose network."
    protocol: ["quic"]  # Protocol name should match the folder name in plugins/
    network_environment: "docker_compose"  # Environment plugin name
    execution_environment: [] 
    debug_environment: [ ]
    services:
      picoquic_server:
        name: "picoquic_server"  # Added 'name' key
        type: "iut"
        implementation: "picoquic" # parameters are presents in folder plugins/services/implementations/quic/picoquic/config.yaml
        version: "rfc9000"
        role: "server"
        ports:
          - "4443:4443"
          - "8080:8080"  # Health check endpoint
      ivy_client:
        name: "ivy_client"  # Added 'name' key
        implementation: "panther_ivy"
        type: "tester"
        protocol:
          name: "quic"
          version:  "rfc9000"
          test: quic_server_test_stream
        role: "client"
        target: "picoquic_server"  # Docker Compose service name
        ports:
          - "5000:5000"  # Example port if needed
          - "4987:4987"  #
          - "8081:8081"  # Changed to avoid port conflict
    steps:
      # record_pcap: True
      wait:
        duration: 100  # seconds to wait during the test
      # record_pcap: False
    assertions:
      - type: "service_responsive"
        service: "picoquic_server"
        endpoint: "8080/health"  # Adjust based on health endpoint
        expected_status: 200
      - type: "service_responsive"
        service: "ivy_client"
        endpoint: "8081/health"  # Adjust based on health endpoint
        expected_status: 200
  
  - name: "QUIC Client-IvyServer Communication Test"
    description: "Verify that the Picoquic client can communicate with the Picoquic server over Docker Compose network."
    protocol: ["quic"]  # Protocol name should match the folder name in plugins/
    network_environment: "docker_compose"  # Environment plugin name
    execution_environment: [] 
    debug_environment: [ ]
    services:
      picoquic_client:
        name: "picoquic_client"  # Added 'name' key
        implementation: "picoquic"
        version: "rfc9000"
        role: "client"
        type: "iut"
        target: "ivy_server"  # Docker Compose service name
        ports:
          - "5000:5000"  # Example port if needed
          - "8081:8081"  # Changed to avoid port conflict
      ivy_server:
        name: "ivy_server"  # Added 'name' key
        implementation: "panther_ivy"
        protocol:
          name: "quic"
          version:  "rfc9000"
          test: quic_client_test_max
        version: "rfc9000"
        role: "server"
        type: "tester"
        target: "picoquic_client"  # Docker Compose service name
        ports:
          - "4443:4443"
          - "4987:4987"  #
          - "8080:8080"  # Health check endpoint
    steps:
      # record_pcap: True
      wait:
        duration: 100  # seconds to wait during the test
      # record_pcap: False
    assertions:
      - type: "service_responsive"
        service: "picoquic_client"
        endpoint: "8080/health"  # Adjust based on health endpoint
        expected_status: 200
      - type: "service_responsive"
        service: "ivy_server"
        endpoint: "8081/health"  # Adjust based on health endpoint
        expected_status: 200

  - name: "Shadow QUIC Client-Server Communication Test"
    description: "Verify that the Picoquic server can communicate with the Picoquic client over Shadow network."
    protocol: ["quic"]  # Protocol name should match the folder name in plugins/
    network_environment: "shadow_ns"  # Environment plugin name
    # TODO change as:
    # network_environment: 
    #    shadow_ns:
    #     type: "shadow_ns"
    #     parameters:
    #      topology: "topologies/shadow_ns/topology.json"
    #      timeout: 100
    #      simulation_settings:
    #        stop_time: 100 #}
    simulation_settings:
      stop_time: 100 # TODO - copy from timeout
      model_unblocked_syscall_latency: True
      lattency: 10
      strace_logging_mode: "standard"
      jitter: 10
      packet_loss: 0.1
      pcap_enabled: True

    execution_environment: [] 
    debug_environment: [ ]
    services:
      picoquic_server:
        name: "picoquic_server"  # Added 'name' key
        type: "iut"
        implementation: "picoquic_shadow" # parameters are presents in folder plugins/services/implementations/quic/picoquic/config.yaml
        version: "rfc9000"
        role: "server"
        ports:
          - "4443:4443"
