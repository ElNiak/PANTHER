# Documentation Validation CI Pipeline

name: Command Processor Documentation Validation

on:
  push:
    paths:
      - 'panther/core/command_processor/**/*.md'
      - 'panther/core/command_processor/**/*.py'
  pull_request:
    paths:
      - 'panther/core/command_processor/**/*.md'
      - 'panther/core/command_processor/**/*.py'

jobs:
  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli

      - name: Install Vale
        run: |
          wget https://github.com/errata-ai/vale/releases/download/v2.29.6/vale_2.29.6_Linux_64-bit.tar.gz
          tar -xzf vale_2.29.6_Linux_64-bit.tar.gz
          sudo mv vale /usr/local/bin/

      - name: Configure Vale
        run: |
          mkdir -p .vale/styles/Microsoft
          curl -o .vale/styles/Microsoft/Microsoft.zip -L https://github.com/errata-ai/Microsoft/releases/latest/download/Microsoft.zip
          unzip .vale/styles/Microsoft/Microsoft.zip -d .vale/styles/Microsoft

      - name: Create Vale config
        run: |
          cat > .vale.ini << EOF
          StylesPath = .vale/styles
          MinAlertLevel = suggestion

          [*.md]
          BasedOnStyles = Microsoft
          Microsoft.Contractions = NO
          Microsoft.FirstPerson = NO
          Microsoft.We = NO
          EOF

      - name: Run markdownlint
        run: |
          markdownlint panther/core/command_processor/**/*.md \
            --config .markdownlint.json \
            --ignore node_modules

      - name: Run Vale
        run: |
          vale panther/core/command_processor/**/*.md

      - name: Check line length (MD013)
        run: |
          find panther/core/command_processor -name "*.md" -exec awk '
            length > 120 {
              print FILENAME ":" NR ": Line too long (" length " characters): " $0;
              exit_code=1
            }
            END { exit exit_code }
          ' {} \;

  doctest:
    name: Test Documentation Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install doctest-modules

      - name: Extract and test code examples
        run: |
          python -c "
          import re
          import ast
          import doctest
          import glob
          import sys

          def extract_python_code_blocks(file_path):
              with open(file_path, 'r') as f:
                  content = f.read()

              # Find Python code blocks
              pattern = r'```python\n(.*?)\n```'
              matches = re.findall(pattern, content, re.DOTALL)
              return matches

          def test_code_block(code, file_path, block_index):
              try:
                  # Try to parse as valid Python
                  ast.parse(code)

                  # Try to compile
                  compile(code, f'{file_path}:block_{block_index}', 'exec')

                  print(f'✓ {file_path}:block_{block_index} - Valid Python syntax')
                  return True
              except SyntaxError as e:
                  print(f'✗ {file_path}:block_{block_index} - Syntax error: {e}')
                  return False
              except Exception as e:
                  print(f'? {file_path}:block_{block_index} - Warning: {e}')
                  return True  # Non-syntax errors are warnings, not failures

          # Test all markdown files
          md_files = glob.glob('panther/core/command_processor/**/*.md', recursive=True)
          total_blocks = 0
          failed_blocks = 0

          for md_file in md_files:
              code_blocks = extract_python_code_blocks(md_file)
              for i, code_block in enumerate(code_blocks):
                  total_blocks += 1
                  if not test_code_block(code_block, md_file, i):
                      failed_blocks += 1

          print(f'\nSummary: {total_blocks - failed_blocks}/{total_blocks} code blocks passed')
          if failed_blocks > 0:
              sys.exit(1)
          "

  docstring-validation:
    name: Validate Docstring Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydocstyle

      - name: Check PEP 257 compliance
        run: |
          pydocstyle panther/core/command_processor/ \
            --convention=pep257 \
            --add-ignore=D100,D104,D105,D107

      - name: Check docstring line length
        run: |
          python -c "
          import ast
          import glob
          import sys

          def check_docstring_length(file_path):
              with open(file_path, 'r') as f:
                  try:
                      tree = ast.parse(f.read())
                  except SyntaxError:
                      return True  # Skip files with syntax errors

              violations = []

              for node in ast.walk(tree):
                  if isinstance(node, (ast.FunctionDef, ast.ClassDef, ast.AsyncFunctionDef)):
                      if ast.get_docstring(node):
                          docstring = ast.get_docstring(node)
                          first_line = docstring.split('\n')[0]
                          if len(first_line) > 72:
                              violations.append({
                                  'line': node.lineno,
                                  'name': node.name,
                                  'length': len(first_line),
                                  'first_line': first_line
                              })

              if violations:
                  print(f'Docstring violations in {file_path}:')
                  for v in violations:
                      print(f'  Line {v[\"line\"]} ({v[\"name\"]}): First line too long ({v[\"length\"]} chars)')
                      print(f'    \"{v[\"first_line\"]}\"')
                  return False

              return True

          # Check all Python files
          py_files = glob.glob('panther/core/command_processor/**/*.py', recursive=True)
          all_passed = True

          for py_file in py_files:
              if not check_docstring_length(py_file):
                  all_passed = False

          if not all_passed:
              sys.exit(1)
          else:
              print('All docstrings comply with 72-character limit')
          "

  api-reference-sync:
    name: Validate API Reference Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check API reference completeness
        run: |
          python -c "
          import ast
          import glob
          import sys
          import inspect
          from panther.core.command_processor import *

          def get_public_methods_from_code(file_path):
              '''Extract public methods from Python file'''
              with open(file_path, 'r') as f:
                  try:
                      tree = ast.parse(f.read())
                  except SyntaxError:
                      return []

              methods = []
              for node in ast.walk(tree):
                  if isinstance(node, ast.ClassDef):
                      class_name = node.name
                      if not class_name.startswith('_'):  # Public class
                          for item in node.body:
                              if isinstance(item, ast.FunctionDef):
                                  method_name = item.name
                                  if not method_name.startswith('_'):  # Public method
                                      methods.append(f'{class_name}.{method_name}')
                  elif isinstance(node, ast.FunctionDef):
                      func_name = node.name
                      if not func_name.startswith('_'):  # Public function
                          methods.append(func_name)

              return methods

          def get_documented_methods():
              '''Extract methods documented in API reference'''
              api_ref_path = 'panther/core/command_processor/api_reference.md'
              try:
                  with open(api_ref_path, 'r') as f:
                      content = f.read()
              except FileNotFoundError:
                  return []

              # Find method definitions in markdown
              import re
              method_pattern = r'##### ([a-zA-Z_][a-zA-Z0-9_]*(?:\.[a-zA-Z_][a-zA-Z0-9_]*)?)\('
              methods = re.findall(method_pattern, content)
              return methods

          # Get methods from code
          py_files = [
              'panther/core/command_processor/core/processor.py',
              'panther/core/command_processor/core/interfaces.py',
              'panther/core/command_processor/models/shell_command.py',
              'panther/core/command_processor/builders/base_builder.py'
          ]

          code_methods = set()
          for py_file in py_files:
              try:
                  methods = get_public_methods_from_code(py_file)
                  code_methods.update(methods)
              except FileNotFoundError:
                  pass

          # Get documented methods
          documented_methods = set(get_documented_methods())

          # Find missing documentation
          missing_docs = code_methods - documented_methods
          extra_docs = documented_methods - code_methods

          if missing_docs:
              print('Methods missing from API documentation:')
              for method in sorted(missing_docs):
                  print(f'  - {method}')
              print()

          if extra_docs:
              print('Methods documented but not found in code:')
              for method in sorted(extra_docs):
                  print(f'  - {method}')
              print()

          if missing_docs or extra_docs:
              print('API reference is not in sync with code')
              sys.exit(1)
          else:
              print('API reference is in sync with code')
          "

  integration-test:
    name: Integration Test Documentation Examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Test tutorial examples
        run: |
          python -c "
          # Test examples from tutorial
          import sys
          sys.path.insert(0, 'panther/core/command_processor')

          try:
              from panther.core.command_processor import CommandProcessor

              # Test basic example from tutorial
              processor = CommandProcessor()
              commands = {
                  'pre_run_cmds': ['echo \"Setting up environment\"'],
                  'run_cmd': {
                      'command_args': 'python hello.py',
                      'working_dir': '/tmp',
                      'timeout': 30
                  },
                  'post_run_cmds': ['echo \"Cleanup complete\"']
              }

              result = processor.process_commands(commands)
              assert 'pre_run_cmds' in result
              assert 'run_cmd' in result
              assert 'post_run_cmds' in result

              print('✓ Tutorial basic example works')

              # Test builder pattern example
              from panther.core.command_processor.builders import CommandBuilder

              command = (CommandBuilder()
                        .set_command('python manage.py migrate')
                        .set_working_directory('/app')
                        .set_timeout(300)
                        .set_critical(True)
                        .build())

              print('✓ Builder pattern example works')

              print('All tutorial examples validated successfully')

          except Exception as e:
              print(f'✗ Tutorial example failed: {e}')
              sys.exit(1)
          "

  mkdocs-build:
    name: Test MkDocs Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material mkdocs-monorepo-plugin

      - name: Create test MkDocs config
        run: |
          cat > mkdocs.yml << EOF
          site_name: PANTHER Command Processor Documentation
          site_description: Documentation for PANTHER command processor module

          theme:
            name: material
            features:
              - navigation.tabs
              - navigation.sections
              - toc.integrate

          plugins:
            - search
            - monorepo

          nav:
            - Home: index.md
            - Command Processor:
              - Overview: panther/core/command_processor/README.md
              - Tutorial: panther/core/command_processor/tutorial/quickstart.md
              - Developer Guide: panther/core/command_processor/DEVELOPER_GUIDE.md
              - API Reference: panther/core/command_processor/api_reference.md
              - Advanced Patterns: panther/core/command_processor/ADVANCED_PATTERNS.md
              - Performance Guide: panther/core/command_processor/PERFORMANCE_GUIDE.md
              - Architecture Decisions:
                - Fast-Fail Validation: panther/core/command_processor/adr/0001-fast-fail-validation.md
                - High-Entropy Logging: panther/core/command_processor/adr/0002-high-entropy-logging.md
                - Command Combining: panther/core/command_processor/adr/0003-command-combining-optimization.md
          EOF

      - name: Create index page
        run: |
          cat > index.md << EOF
          # PANTHER Documentation

          Welcome to the PANTHER framework documentation.

          ## Command Processor Module

          The command processor module provides structured command processing capabilities.

          - [Overview](panther/core/command_processor/README.md)
          - [Getting Started](panther/core/command_processor/tutorial/quickstart.md)
          - [Developer Guide](panther/core/command_processor/DEVELOPER_GUIDE.md)
          - [API Reference](panther/core/command_processor/api_reference.md)
          EOF

      - name: Test MkDocs build
        run: |
          mkdocs build --strict

      - name: Validate generated site
        run: |
          test -f site/index.html
          test -f site/panther/core/command_processor/README/index.html
          test -f site/panther/core/command_processor/tutorial/quickstart/index.html
          echo "✓ MkDocs site built successfully"

  summary:
    name: Documentation Validation Summary
    runs-on: ubuntu-latest
    needs: [lint-docs, doctest, docstring-validation, api-reference-sync, integration-test, mkdocs-build]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "Documentation validation results:"
          echo "- Lint docs: ${{ needs.lint-docs.result }}"
          echo "- Doctest: ${{ needs.doctest.result }}"
          echo "- Docstring validation: ${{ needs.docstring-validation.result }}"
          echo "- API reference sync: ${{ needs.api-reference-sync.result }}"
          echo "- Integration test: ${{ needs.integration-test.result }}"
          echo "- MkDocs build: ${{ needs.mkdocs-build.result }}"

          if [[ "${{ needs.lint-docs.result }}" == "failure" ||
                "${{ needs.doctest.result }}" == "failure" ||
                "${{ needs.docstring-validation.result }}" == "failure" ||
                "${{ needs.api-reference-sync.result }}" == "failure" ||
                "${{ needs.integration-test.result }}" == "failure" ||
                "${{ needs.mkdocs-build.result }}" == "failure" ]]; then
            echo "❌ Documentation validation failed"
            exit 1
          else
            echo "✅ All documentation validation passed"
          fi
