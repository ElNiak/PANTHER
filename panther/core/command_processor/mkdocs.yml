# Extra CSS and JavaScript
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# Extra configuration
extra:
  version:
    provider: mike

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/panther-org/panther

  analytics:
    provider: google
    property: UA-XXXXXXXXX-X

  # Version selector
  version:
    default: stable

# Hook for custom processing
hooks:
  - hooks/process_api_docs.py
