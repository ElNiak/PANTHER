# MkDocs Configuration for Command Processor Module
# This configuration integrates with the PANTHER monorepo documentation

site_name: PANTHER Command Processor
site_description: Comprehensive documentation for the PANTHER command processor module
site_author: PANTHER Development Team
site_url: https://panther-docs.example.com/command-processor

# Repository information
repo_name: PANTHER/command_processor
repo_url: https://github.com/panther-org/panther
edit_uri: edit/main/panther/core/command_processor/

# Copyright
copyright: Copyright &copy; 2025 PANTHER Project

# Configuration
theme:
  name: material
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - search.highlight
    - search.share
    - toc.integrate
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

# Plugins
plugins:
  - search:
      lang: en
  - monorepo:
      # Enable monorepo plugin for PANTHER integration
      enabled: true
  - mermaid2:
      # Enable Mermaid diagrams
      arguments:
        theme: 'base'
        themeVariables:
          primaryColor: '#2196f3'
          primaryTextColor: '#ffffff'

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true
      toc_depth: 3

