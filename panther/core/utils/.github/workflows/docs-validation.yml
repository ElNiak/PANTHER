# Documentation Validation CI Pipeline
# Validates documentation quality, runs doctests, and builds documentation

name: Documentation Validation

on:
  push:
    paths:
      - 'panther/core/utils/**/*.md'
      - 'panther/core/utils/**/*.py'
      - '.github/workflows/docs-validation.yml'
  pull_request:
    paths:
      - 'panther/core/utils/**/*.md'
      - 'panther/core/utils/**/*.py'

jobs:
  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js for markdownlint
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install markdownlint-cli
      run: npm install -g markdownlint-cli

    - name: Run markdownlint
      run: |
        markdownlint \
          --config .markdownlint.json \
          'panther/core/utils/**/*.md'

    - name: Setup Vale for prose linting
      run: |
        wget -O vale.tar.gz https://github.com/errata-ai/vale/releases/latest/download/vale_Linux_64-bit.tar.gz
        tar -xzf vale.tar.gz
        chmod +x vale
        sudo mv vale /usr/local/bin/

    - name: Create Vale configuration
      run: |
        cat > .vale.ini << EOF
        StylesPath = .vale/styles
        MinAlertLevel = warning

        [*.md]
        BasedOnStyles = Vale
        EOF

        mkdir -p .vale/styles/Vale
        cat > .vale/styles/Vale/Terms.yml << EOF
        extends: existence
        message: "Use present tense instead of '%s'"
        level: error
        tokens:
          - will
          - shall
          - going to
          - would
          - should
        EOF

    - name: Run Vale prose linter
      run: vale panther/core/utils/**/*.md

  doctest:
    name: Run Doctests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install colorlog psutil
        # Install any other dependencies needed for doctests

    - name: Run doctests in Python files
      run: |
        cd panther/core/utils
        python -m doctest *.py -v

    - name: Extract and test code blocks from markdown
      run: |
        # Extract Python code blocks from markdown files
        python << 'EOF'
        import re
        import os
        import tempfile
        import subprocess

        def extract_python_blocks(filepath):
            """Extract Python code blocks from markdown files."""
            with open(filepath, 'r') as f:
                content = f.read()

            # Find all Python code blocks
            pattern = r'```python\n(.*?)\n```'
            blocks = re.findall(pattern, content, re.DOTALL)
            return blocks

        def test_code_block(code, filename):
            """Test a code block for syntax errors."""
            try:
                compile(code, filename, 'exec')
                print(f"✓ Syntax check passed for {filename}")
                return True
            except SyntaxError as e:
                print(f"✗ Syntax error in {filename}: {e}")
                return False

        # Test all markdown files
        md_files = []
        for root, dirs, files in os.walk('panther/core/utils'):
            for file in files:
                if file.endswith('.md'):
                    md_files.append(os.path.join(root, file))

        all_passed = True
        for md_file in md_files:
            blocks = extract_python_blocks(md_file)
            for i, block in enumerate(blocks):
                if not test_code_block(block, f"{md_file}:block_{i}"):
                    all_passed = False

        if not all_passed:
            exit(1)
        print("All Python code blocks passed syntax validation")
        EOF

  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: [lint-docs, doctest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install MkDocs and dependencies
      run: |
        pip install --upgrade pip
        pip install mkdocs mkdocs-material mkdocs-monorepo-plugin mkdocstrings[python]

    - name: Build documentation
      run: |
        cd panther/core/utils
        mkdocs build --strict

    - name: Upload documentation artifacts
      uses: actions/upload-artifact@v3
      with:
        name: documentation-site
        path: panther/core/utils/site/

    - name: Check for broken links
      run: |
        # Install linkchecker
        pip install linkchecker

        # Check for broken internal links
        cd panther/core/utils/site
        python -m http.server 8000 &
        SERVER_PID=$!
        sleep 2

        # Check links (ignore external links to avoid rate limiting)
        linkchecker --check-extern=0 http://localhost:8000

        # Cleanup
        kill $SERVER_PID

  validate-structure:
    name: Validate Documentation Structure
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate Diátaxis structure
      run: |
        cd panther/core/utils

        # Check required files exist
        required_files=(
          "README.md"
          "DEVELOPER_GUIDE.md"
          "api_reference.md"
          "tutorial/quickstart.md"
          "adr/0001-feature-aware-logging-architecture.md"
          "adr/0002-centralized-statistics-collection.md"
        )

        for file in "${required_files[@]}"; do
          if [[ ! -f "$file" ]]; then
            echo "❌ Missing required file: $file"
            exit 1
          else
            echo "✅ Found required file: $file"
          fi
        done

    - name: Validate content completeness
      run: |
        cd panther/core/utils

        # Check for minimum word counts
        echo "Checking content completeness..."

        # README should be substantial (>2000 words)
        readme_words=$(wc -w < README.md)
        if [[ $readme_words -lt 2000 ]]; then
          echo "❌ README.md too short: $readme_words words (minimum 2000)"
          exit 1
        fi
        echo "✅ README.md word count: $readme_words"

        # Developer guide should be comprehensive (>3000 words)
        dev_words=$(wc -w < DEVELOPER_GUIDE.md)
        if [[ $dev_words -lt 3000 ]]; then
          echo "❌ DEVELOPER_GUIDE.md too short: $dev_words words (minimum 3000)"
          exit 1
        fi
        echo "✅ DEVELOPER_GUIDE.md word count: $dev_words"

        # API reference should be detailed (>2000 words)
        api_words=$(wc -w < api_reference.md)
        if [[ $api_words -lt 2000 ]]; then
          echo "❌ api_reference.md too short: $api_words words (minimum 2000)"
          exit 1
        fi
        echo "✅ api_reference.md word count: $api_words"

  check-docstring-coverage:
    name: Check Docstring Coverage
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install interrogate for docstring coverage
      run: pip install interrogate

    - name: Check docstring coverage
      run: |
        cd panther/core/utils

        # Check docstring coverage (require 80% minimum)
        interrogate --fail-under=80 --verbose *.py

        # Generate coverage report
        interrogate --generate-badge --output=docs_coverage.svg *.py

    - name: Upload coverage badge
      uses: actions/upload-artifact@v3
      with:
        name: docstring-coverage-badge
        path: panther/core/utils/docs_coverage.svg
