# MkDocs Configuration for PANTHER Core Utilities
# This configuration integrates with mkdocs-monorepo-plugin for centralized documentation

site_name: PANTHER Core Utilities
site_description: Feature-aware logging and utility infrastructure for PANTHER framework
site_author: PANTHER Development Team

# Repository information
repo_name: PANTHER/core/utils
repo_url: https://github.com/panther-project/panther
edit_uri: edit/main/panther/core/utils/

# Configuration
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

# Extensions
markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

# Plugins
plugins:
  - search
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            merge_init_into_class: true
            show_submodules: false
  - monorepo

# Navigation structure for core utilities module
nav:
  - Overview: README.md
  - Tutorial:
    - Quick Start: tutorial/quickstart.md
  - How-To Guides:
    - Developer Guide: DEVELOPER_GUIDE.md
  - Reference:
    - API Reference: api_reference.md
  - Architecture:
    - Decision Records:
      - Feature-Aware Logging: adr/0001-feature-aware-logging-architecture.md
      - Statistics Collection: adr/0002-centralized-statistics-collection.md
  - Examples:
    - Basic Setup: examples/basic_setup.md
    - Advanced Configuration: examples/advanced_config.md
    - Custom Extensions: examples/custom_extensions.md
    - Performance Tuning: examples/performance_tuning.md
  - Development:
    - Migration Guide: migration_guide.md
    - Performance Analysis: performance_analysis.md
    - Contributing: CONTRIBUTING.md

# Monorepo plugin configuration for parent project integration
monorepo:
  # This module's documentation will be included under 'core/utils' in parent site
  include_paths:
    - "*.md"
    - "tutorial/*.md"
    - "adr/*.md"
    - "examples/*.md"

  # Navigation merging for parent project
  nav_template: |
    Core Utilities:
      - Overview: core/utils/README.md
      - Tutorial: core/utils/tutorial/quickstart.md
      - Developer Guide: core/utils/DEVELOPER_GUIDE.md
      - API Reference: core/utils/api_reference.md
      - Architecture Decisions:
        - Feature-Aware Logging: core/utils/adr/0001-feature-aware-logging-architecture.md
        - Statistics Collection: core/utils/adr/0002-centralized-statistics-collection.md

# Watch for changes during development
watch:
  - ../../../  # Watch parent directories for code changes

# Build directory
site_dir: ../../../docs/core/utils/

# Extra CSS and JavaScript for enhanced presentation
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# Social links and project information
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/panther-project/panther
  version:
    provider: mike
    default: latest

# Copyright information
copyright: Copyright &copy; 2024 PANTHER Project Contributors
