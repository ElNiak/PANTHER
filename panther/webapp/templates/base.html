<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="PANTHER - Protocol Analysis and Network Threat Evaluation Resources" />
        <meta name="author" content="Christophe Crochet" />
        <title>PANTHER - {% block title %}{% endblock %}</title>
        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css" rel="stylesheet" />
        <link href="/static/css/styles.css" rel="stylesheet" />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/js/all.min.js" crossorigin="anonymous"></script>
        <!-- Use Vue.js production version -->
        <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <!-- Navbar Brand-->
            <a class="navbar-brand ps-3" href="/index">PANTHER</a>
            <!-- Sidebar Toggle-->
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            <!-- Navbar Search-->
            <form class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0">
                <div class="input-group">
                    <input class="form-control" type="text" placeholder="Search for..." aria-label="Search for..." aria-describedby="btnNavbarSearch" />
                    <button class="btn btn-primary" id="btnNavbarSearch" type="button"><i class="fas fa-search"></i></button>
                </div>
            </form>
            <!-- Navbar-->
            <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fas fa-user fa-fw"></i></a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="#!">Settings</a></li>
                        <li><a class="dropdown-item" href="#!">Activity Log</a></li>
                        <li><hr class="dropdown-divider" /></li>
                        <li><a class="dropdown-item" href="#!">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu">
                        <div class="nav">
                            <div class="sb-sidenav-menu-heading">Core</div>
                            <a class="nav-link {% if active_page == 'dashboard' %}active{% endif %}" href="/index">
                                <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                                Dashboard
                            </a>

                            <div class="sb-sidenav-menu-heading">Testing</div>
                            <a class="nav-link {% if active_page == 'experiments' %}active{% endif %}" href="/experiments">
                                <div class="sb-nav-link-icon"><i class="fas fa-flask"></i></div>
                                Experiments
                            </a>
                            <a class="nav-link {% if active_page == 'plugins' %}active{% endif %}" href="/plugins">
                                <div class="sb-nav-link-icon"><i class="fas fa-puzzle-piece"></i></div>
                                Plugins
                            </a>

                            <div class="sb-sidenav-menu-heading">Configuration</div>
                            <a class="nav-link {% if active_page == 'configuration' %}active{% endif %}" href="/configuration">
                                <div class="sb-nav-link-icon"><i class="fas fa-cog"></i></div>
                                Settings
                            </a>
                            <a class="nav-link {% if active_page == 'logs' %}active{% endif %}" href="/logs">
                                <div class="sb-nav-link-icon"><i class="fas fa-file-alt"></i></div>
                                Logs
                            </a>
                        </div>
                    </div>
                    <div class="sb-sidenav-footer">
                        <div class="small">PANTHER:</div>
                        Protocol Analysis &amp; Testing
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <main>
                    {% block content %}{% endblock %}
                </main>
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; PANTHER 2023</div>
                            <div>
                                <a href="https://github.com/ElNiak/PANTHER">GitHub</a>
                                &middot;
                                <a href="https://elniak.github.io/PANTHER/">Documentation</a>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="/static/js/scripts.js"></script>
        <script>
    new Vue({
        el: '#app',
        data: {
            plugins: {},
            tests: []
        },
        mounted() {
            // Fetch plugins data
            fetch('/api/plugins')
                .then(response => response.json())
                .then(data => {
                    this.plugins = data;
                });

            // Fetch test cases data
            fetch('/api/test-cases')
                .then(response => response.json())
                .then(data => {
                    this.tests = data;
                });
        },
        methods: {
            runExperiment(testName) {
                fetch('/api/run-experiment', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ test_name: testName })
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.status === 'success' ? 'Test executed successfully' : 'Error: ' + data.message);
                });
            },
            // Safe methods for Vue templates
            safeLength(obj) {
                return obj && typeof obj === 'object' ? Object.keys(obj).length : 0;
            },
            safeAttr(obj, attr, defaultVal) {
                return obj && obj[attr] !== undefined ? obj[attr] : defaultVal;
            }
        },
        delimiters: ['${', '}'] // Use different delimiters to avoid conflict with Jinja2
    });
</script>
    </body>
</html>
