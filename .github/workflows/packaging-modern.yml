name: Modern Packaging CI/CD
on:
  push:
    branches: 
      - main
      - development-*
      - feature/packaging-modernization
  pull_request:
    branches: 
      - main
      - production
  workflow_dispatch:
    inputs:
      use_modern_backend:
        description: 'Use modern build backend (hatchling)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  # Default feature flags - can be overridden
  PANTHER_USE_MODERN_BACKEND: ${{ github.event.inputs.use_modern_backend || 'false' }}
  PANTHER_SECURITY_SCAN: 'true'
  PANTHER_BUILD_CACHE: 'true'
  PANTHER_USE_DEP_LOCKS: 'false'

jobs:
  validate-packaging:
    name: Validate Packaging Configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Validate pyproject.toml
        run: |
          pip install validate-pyproject[all]
          validate-pyproject pyproject.toml
      
      - name: Check MANIFEST.in
        run: |
          pip install check-manifest
          check-manifest --create
          check-manifest
      
      - name: Upload validation results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: validation-results
          path: |
            pyproject.toml
            MANIFEST.in
            *.log

  test-packaging:
    name: Test Packaging (${{ matrix.backend }} - Python ${{ matrix.python-version }})
    needs: validate-packaging
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
        backend: ['setuptools', 'hatchling']
        os: [ubuntu-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for version detection
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/pip
            ~/.cache/panther
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-
      
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel pytest
          
          # Install backend-specific dependencies
          if [ "${{ matrix.backend }}" = "hatchling" ]; then
            pip install hatchling hatch-vcs
          else
            pip install setuptools>=68.0 wheel>=0.41.0
          fi
      
      - name: Configure build backend
        run: |
          if [ "${{ matrix.backend }}" = "hatchling" ]; then
            cp pyproject_hatchling.toml pyproject.toml
            echo "Using Hatchling backend"
          else
            cp pyproject_enhanced.toml pyproject.toml
            echo "Using Setuptools backend"
          fi
      
      - name: Build package
        env:
          PANTHER_USE_MODERN_BACKEND: ${{ matrix.backend == 'hatchling' && 'true' || 'false' }}
        run: |
          python -m build --wheel --sdist
          
          # List built artifacts
          ls -la dist/
      
      - name: Test package installation
        run: |
          # Create virtual environment for testing
          python -m venv test_env
          source test_env/bin/activate || test_env\Scripts\activate
          
          # Install the built wheel
          pip install dist/*.whl
          
          # Test imports
          python -c "import panther; print(f'PANTHER version: {panther.__version__}')"
          python -c "from panther.plugins.plugin_manager import PluginManager; print('Plugin system OK')"
          
          # Test CLI entry points
          panther --help
          panther-metrics --help || echo "Metrics CLI not available"
      
      - name: Run packaging tests
        run: |
          pip install pytest
          pytest tests/test_packaging/ -v
      
      - name: Validate wheel contents
        run: |
          python tests/test_packaging/test_migration_validator.py \
            --project-root . \
            --compare-backends setuptools ${{ matrix.backend }} \
            --output packaging_comparison_${{ matrix.backend }}.json
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: dist-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.backend }}
          path: |
            dist/
            packaging_comparison_*.json

  security-scan:
    name: Security Scanning
    needs: validate-packaging
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install security tools
        run: |
          pip install safety bandit[toml] pip-audit semgrep
      
      - name: Run Safety check
        continue-on-error: true
        run: |
          safety check --json > security-reports/safety.json || true
          safety check || true
      
      - name: Run Bandit
        continue-on-error: true
        run: |
          bandit -r panther/ -f json -o security-reports/bandit.json || true
          bandit -r panther/ || true
      
      - name: Run pip-audit
        continue-on-error: true
        run: |
          pip-audit --format json --output security-reports/pip-audit.json || true
          pip-audit || true
      
      - name: Run Semgrep
        continue-on-error: true
        run: |
          semgrep --config=auto --json --output=security-reports/semgrep.json panther/ || true
      
      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports
          path: security-reports/

  build-and-test-enhanced:
    name: Enhanced Build and Test
    needs: [test-packaging, security-scan]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Graphviz (for documentation)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
      
      - name: Install enhanced builder
        run: |
          pip install -e .
          pip install -r requirements.txt 2>/dev/null || echo "No requirements.txt"
      
      - name: Show configuration
        run: |
          python panther_builder_enhanced.py show-config
      
      - name: Generate dependency locks
        if: env.PANTHER_USE_DEP_LOCKS == 'true'
        run: |
          python panther_builder_enhanced.py generate-locks
          
          # Upload lock files
          mkdir -p locks
          cp locks/*.lock ./locks/ 2>/dev/null || echo "No lock files generated"
      
      - name: Run comprehensive tests
        run: |
          python panther_builder_enhanced.py comprehensive-test
      
      - name: Generate SBOM
        run: |
          python panther_builder_enhanced.py generate-sbom
      
      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results-enhanced
          path: |
            htmlcov/
            coverage.xml
            .coverage
            locks/
            sbom/
            security-reports/

  performance-benchmark:
    name: Build Performance Benchmark
    needs: validate-packaging
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Benchmark setuptools build
        run: |
          cp pyproject_enhanced.toml pyproject.toml
          pip install build
          
          start_time=$(date +%s)
          python -m build --wheel
          end_time=$(date +%s)
          
          setuptools_time=$((end_time - start_time))
          echo "SETUPTOOLS_BUILD_TIME=$setuptools_time" >> $GITHUB_ENV
          
          # Clean build artifacts
          rm -rf dist/ build/
      
      - name: Benchmark hatchling build
        run: |
          cp pyproject_hatchling.toml pyproject.toml
          pip install hatchling
          
          start_time=$(date +%s)
          python -m build --wheel
          end_time=$(date +%s)
          
          hatchling_time=$((end_time - start_time))
          echo "HATCHLING_BUILD_TIME=$hatchling_time" >> $GITHUB_ENV
      
      - name: Report performance
        run: |
          echo "## Build Performance Comparison" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | Build Time (seconds) |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------------------|" >> $GITHUB_STEP_SUMMARY
          echo "| Setuptools | ${{ env.SETUPTOOLS_BUILD_TIME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Hatchling | ${{ env.HATCHLING_BUILD_TIME }} |" >> $GITHUB_STEP_SUMMARY
          
          # Calculate percentage difference
          if [ "${{ env.SETUPTOOLS_BUILD_TIME }}" -gt 0 ]; then
            diff=$(( (${{ env.HATCHLING_BUILD_TIME }} - ${{ env.SETUPTOOLS_BUILD_TIME }}) * 100 / ${{ env.SETUPTOOLS_BUILD_TIME }} ))
            echo "| Difference | ${diff}% |" >> $GITHUB_STEP_SUMMARY
          fi

  publish-test:
    name: Test PyPI Publishing (Dry Run)
    needs: [build-and-test-enhanced]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install twine
        run: pip install twine build
      
      - name: Build distribution
        run: python -m build
      
      - name: Check distribution
        run: |
          twine check dist/*
          
          # List package contents
          python -m zipfile -l dist/*.whl | head -50
      
      - name: Test upload (dry run)
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TEST_PYPI_API_TOKEN }}
        run: |
          # Only run if we have test PyPI credentials
          if [ -n "$TWINE_PASSWORD" ]; then
            twine upload --repository testpypi --skip-existing dist/* --verbose --dry-run || echo "Dry run completed"
          else
            echo "No Test PyPI credentials, skipping upload test"
          fi