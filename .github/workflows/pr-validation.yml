name: PR Validation

on:
  pull_request:
    branches: [ production, development-* ]
    paths:
      - 'tests/**/*.py'
      - 'panther/**/*.py'
      - 'pyproject.toml'
      - 'requirements*.txt'

jobs:
  pr-quick-validation:
    name: PR Quick Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[tests,lint,web]

    - name: Get changed files
      id: changed-files
      uses: tj-actions/changed-files@v44
      with:
        files: |
          tests/**/*.py
          panther/**/*.py

    - name: Quick lint check on changed files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        echo "Changed files: ${{ steps.changed-files.outputs.all_changed_files }}"

        # Check formatting on changed Python files
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == *.py ]]; then
            echo "Checking $file..."
            black --check "$file" || echo "::warning file=$file::Formatting issues found"
            isort --check-only "$file" || echo "::warning file=$file::Import sorting issues found"
            flake8 "$file" --max-line-length=88 || echo "::warning file=$file::Linting issues found"
          fi
        done

    - name: Run tests for changed test files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        # Run tests only for changed test files (skip non-test files)
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == tests/* && $file == *.py ]]; then
            base=$(basename "$file")
            if [[ "$base" == "conftest.py" || "$base" == "__init__.py" ]]; then
              echo "Skipping non-test file: $file"
              continue
            fi
            if [[ $file == tests/integration/* ]]; then
              echo "Skipping integration test: $file"
              continue
            fi
            echo "Running tests for $file..."
            exit_code=0
            pytest "$file" -v --tb=short -p no:panther_metrics -o "addopts=" || exit_code=$?
            # Exit code 5 = no tests collected (e.g., all skipped), which is OK
            if [[ $exit_code -ne 0 && $exit_code -ne 5 ]]; then
              echo "::error file=$file::Tests failed for this file (exit code $exit_code)"
              exit 1
            fi
          fi
        done

    - name: Run related unit tests for changed source files
      if: steps.changed-files.outputs.any_changed == 'true'
      run: |
        # For changed source files, run related unit tests
        for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
          if [[ $file == panther/* && $file == *.py ]]; then
            # Convert source file path to potential test file path
            test_file="tests/unit/test_${file#panther/}"
            test_file="${test_file%.py}_test.py"

            if [[ -f "$test_file" ]]; then
              echo "Running related tests for $file -> $test_file..."
              pytest "$test_file" -v --tb=short -p no:panther_metrics -o "addopts=" || true
            fi
          fi
        done

    - name: Quick smoke test
      run: |
        # Always run a basic smoke test
        pytest tests/unit/test_plugins/test_command_generation_validator_decorator.py \
          -v --tb=short -p no:panther_metrics -o "addopts="

    - name: Comment on PR with validation status
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;

          const comment = `❌ **PR Validation Failed**

          Your changes have validation issues. Please check the following:

          1. **Code Formatting**: Run \`black tests/ panther/\` to fix formatting
          2. **Import Sorting**: Run \`isort tests/ panther/\` to fix imports
          3. **Linting**: Run \`flake8 tests/ panther/ --max-line-length=88\` to check for issues
          4. **Tests**: Ensure all tests pass with \`pytest tests/unit/ -n auto -m "not slow" -p no:panther_metrics\`

          You can run the quick validation locally with:
          \`\`\`bash
          # Install dependencies
          pip install -e .
          pip install pytest black isort flake8

          # Run validation
          black --check tests/ panther/
          isort --check-only tests/ panther/
          flake8 tests/ panther/ --max-line-length=88
          pytest tests/unit/ -n auto -m "not slow" -p no:panther_metrics
          \`\`\`

          Please fix these issues and push again. The CI will automatically re-run.`;

          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number,
            body: comment
          });

    - name: Comment on PR with success status
      if: success()
      uses: actions/github-script@v6
      with:
        script: |
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;

          const comment = `✅ **PR Validation Passed**

          Your changes look good! The quick validation checks have passed:

          - ✅ Code formatting (Black)
          - ✅ Import sorting (isort)
          - ✅ Linting (flake8)
          - ✅ Basic tests

          The full CI pipeline will run when this PR is merged or when targeting the main branches.`;

          await github.rest.issues.createComment({
            owner,
            repo,
            issue_number,
            body: comment
          });

  pr-security-check:
    name: PR Security Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        trivyignores: '.trivyignore'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-results.sarif'

    - name: Check for high/critical vulnerabilities
      run: |
        # Basic check for high/critical issues in Trivy results
        if [ -f trivy-results.sarif ]; then
          # Count high/critical severity issues
          high_critical_count=$(jq '[.runs[].results[] | select(.level == "error")] | length' trivy-results.sarif 2>/dev/null || echo "0")

          if [ "$high_critical_count" -gt 0 ]; then
            echo "::error::Found $high_critical_count high/critical security issues"
            echo "Please review the security scan results and address critical vulnerabilities"
            exit 1
          else
            echo "✅ No high/critical security issues found"
          fi
        else
          echo "⚠️ Trivy scan results not found"
        fi
