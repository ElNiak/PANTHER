logging:
  level: DEBUG
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  build_docker_image: True

tests:
  - name: "Test - Strace - QUIC IyvClient-Server Communication Test"
    description: "Verify that the Picoquic server can communicate with the Ivy-Tester client over Shadow network."
    network_environment:
      type: "shadow_ns"  # Environment plugin name
      general:
        stop_time: 100 # TODO - copy from timeout
        model_unblocked_syscall_latency: false
      experimental:
        strace_logging_mode: "standard"
      network:
        latency: 10
        jitter: 10
        packet_loss: 0.0
      host_option_defaults:
        pcap_enabled: true
      # should_no_be_ignore : "should_no_be_ignore"
    iterations: 1
    should_be_ignore : "should_be_ignore"
    services:
      # should_no_be_ignore : "should_no_be_ignore"
      picoquic_server:
        name: "picoquic_server"
        timeout: 100
        implementation:
          name: "picoquic_shadow" # parameters are presents in folder plugins/services/implementations/quic/picoquic/config.yaml
          type: "IUT" # plugin is present plugins/services/iut/quic/picoquic
          # should_no_be_ignore : "should_no_be_ignore"
        protocol: # plugin is present plugins/services/iut/quic
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "8080:8080"  # Health check endpoint
        generate_new_certificates: True
        should_be_ignore : "should_be_ignore"

      ivy_client:
        name: "ivy_client"  # Added 'name' key
        timeout: 100
        implementation:
          name: "panther_ivy"
          type: "TESTERS"# plugin is present plugins/services/testers/panther_ivy
          test: quic_server_test_stream
        protocol:  # plugin is present plugins/services/iut/quic
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"  # Docker Compose service name
        ports:
          - "5000:5000"
          - "4987:4987"
          - "8081:8081"
        generate_new_certificates: True
    steps:
      wait: 100  # seconds to wait during the test

  - name: "Test - Strace - QUIC IvyServer-client Communication Test"
    description: "Verify that the Picoquic client can communicate with the Ivy-Tester server over Shadow NS network."
    network_environment:
      type: "shadow_ns"  # Environment plugin name
      general:
        stop_time: 100 # TODO - copy from timeout
        model_unblocked_syscall_latency: false
      experimental:
        strace_logging_mode: "standard"
      network:
        latency: 10
        jitter: 10
        packet_loss: 0.0
      host_option_defaults:
        pcap_enabled: true
      # should_no_be_ignore : "should_no_be_ignore"
    execution_environment:
      - type: "strace"
    iterations: 1
    should_be_ignore : "should_be_ignore"
    services:
      # should_no_be_ignore : "should_no_be_ignore"
      picoquic_client:
        name: "picoquic_client"
        timeout: 100
        implementation:
          name: "picoquic" # parameters are presents in folder plugins/services/implementations/quic/picoquic/config.yaml
          type: "IUT" # plugin is present plugins/services/iut/quic/picoquic
          # should_no_be_ignore : "should_no_be_ignore"
        protocol: # plugin is present plugins/services/iut/quic
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server"  # Docker Compose service name
        ports:
          - "4443:4443"
          - "8080:8080"  # Health check endpoint
        generate_new_certificates: True
        should_be_ignore : "should_be_ignore"

      ivy_server:
        name: "ivy_server"  # Added 'name' key
        timeout: 100
        implementation:
          name: "panther_ivy"
          type: "TESTERS"# plugin is present plugins/services/testers/panther_ivy
          test: quic_client_test_max
        protocol:  # plugin is present plugins/services/iut/quic
          name: "quic"
          version: "rfc9000"
          role: "server"
          target: "picoquic_client"  # Docker Compose service name
        ports:
          - "5000:5000"
          - "4987:4987"
          - "8081:8081"
        generate_new_certificates: True
    steps:
      wait: 100  # seconds to wait during the test