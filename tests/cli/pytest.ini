[pytest]
# Pytest configuration for CLI Click tests

# Test discovery
testpaths = tests/cli
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    --verbose
    --tb=short
    --strict-markers
    --strict-config
    --disable-warnings
    --color=yes
    --durations=10

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Tests that take a long time to run
    cli: CLI-specific tests
    config: Configuration-related tests
    plugins: Plugin-related tests
    docker: Docker-related tests
    requires_docker: Tests that require Docker to be available
    requires_network: Tests that require network access

# Test filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:click.*

# Minimum version
minversion = 6.0

# Coverage options (if pytest-cov is installed)
# addopts = --cov=panther.cli --cov-report=html --cov-report=term-missing

# Timeout for tests (if pytest-timeout is installed)
timeout = 300
timeout_method = thread
