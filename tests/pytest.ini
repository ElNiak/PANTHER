# Pytest Configuration for PANTHER Test Suite
[pytest]
addopts =
    -n auto
    --strict-markers
    --strict-config
    --disable-warnings
    -v
    --tb=short
    --maxfail=0
    --continue-on-collection-errors

# Test discovery
testpaths = tests
pythonpath = .. ../panther/plugins/services/testers
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .tox .env venv env .venv __pycache__ *.egg-info build docs site htmlcov panther

# Markers for test categorization
markers =
    unit: Unit tests - fast, isolated, no external dependencies
    integration: Integration tests - test component interactions
    property_based: Property-based tests using Hypothesis
    e2e: End-to-end tests - full system testing
    slow: Slow tests that take more than 1 second
    requires_docker: Tests that require Docker daemon
    docker_integration: Tests using pytest-docker for real Docker integration
    requires_network: Tests that require network access
    requires_ivy: Tests that require Ivy theorem prover
    requires_mcp: Tests that require panther-serena MCP server
    requires_root: Tests that require root privileges
    plugin_test: Tests for plugin functionality
    plugin_manager: Tests for the PluginManager core component
    experiment_manager: Tests for the ExperimentManager core component
    command_processor: Tests for the CommandProcessor core component
    event_system: Tests for the event-driven architecture
    command_generation: Tests for command generation pipeline
    template_rendering: Tests for template rendering system
    config_validation: Tests for configuration validation
    docker_compose: Tests specific to Docker Compose environment
    shadow_ns: Tests specific to Shadow NS environment
    localhost: Tests specific to localhost environment
    performance: Performance and benchmark tests
    security: Security-related tests
    compliance: Compliance and formal verification tests
    regression: Regression tests for specific bug fixes
    smoke: Smoke tests for basic functionality
    docker_system: Tests for Docker system functionality
    observer_system: Tests for observer system functionality
    plugin_system: Tests for plugin system functionality
    output_collection: Tests for output collection functionality
    docker_build: Tests for Docker build functionality
    docker_cache: Tests for Docker image cache functionality
    rust_quic: Tests for Rust QUIC implementations
    python_quic: Tests for Python QUIC implementations
    fast_fail: Tests for fast fail mechanism
    command_audit: Tests for command audit functionality
    complexity: Tests for high cyclomatic complexity methods
    maintainability: Tests for code quality and maintainability metrics
    state_machine: State machine testing for environment lifecycles
    complex_scenarios: Complex integration and failure scenarios
    performance_properties: Performance property validation tests
    complexity_focus: Tests specifically targeting high-complexity methods
    boundary: Boundary condition and resource limit tests
    stress: Stress testing under high load and resource pressure
    race_conditions: Race condition and timing-dependent tests
    chaos: Chaos engineering and failure injection tests
    enhanced: Enhanced tests with improved output recording
    cli_usage: Tests focusing on actively used CLI functions
    function_usage: Tests based on function usage patterns from Serena
    hypothesis: Property-based tests using Hypothesis
    linting: Code quality and linting tests
    docker_lifecycle: Tests for Docker image lifecycle management
    service_config: Property-based tests for service configuration
    docker_validation: Tests for Docker image validation
    functional: Functional tests for end-to-end scenarios
    docker_failures: Tests for Docker image failure scenarios
    benchmark: Performance benchmark tests

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_file_date_format = %Y-%m-%d %H:%M:%S

# Minimum Python version
minversion = 6.0

# Test execution options
junit_family = xunit2
junit_logging = all

# Filter warnings
filterwarnings =
    ignore::pytest.PytestCollectionWarning:.*TestConfig.*
    ignore::pytest.PytestCollectionWarning:.*TestCase.*
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*docker.*:UserWarning
    ignore:cannot collect test class.*TestConfig.*:pytest.PytestCollectionWarning
    error::pytest.PytestUnraisableExceptionWarning
