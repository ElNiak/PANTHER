# Pytest Configuration for PANTHER Test Suite
[pytest]
addopts =
    --strict-markers
    --strict-config
    --disable-warnings
    --cov-branch
    --cov-append
    --cov=panther
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=75
    -v
    --tb=short
    --maxfail=3
    --continue-on-collection-errors
    --hypothesis-show-statistics
    --hypothesis-seed=42

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
norecursedirs = .git .tox .env venv env .venv __pycache__ *.egg-info build docs site htmlcov panther

# Markers for test categorization
markers =
    unit: Unit tests - fast, isolated, no external dependencies
    integration: Integration tests - test component interactions
    property: Property-based tests using Hypothesis
    e2e: End-to-end tests - full system testing
    slow: Slow tests that take more than 1 second
    requires_docker: Tests that require Docker daemon
    requires_network: Tests that require network access
    requires_ivy: Tests that require Ivy theorem prover
    regression: Regression tests for specific bug fixes
    smoke: Smoke tests for basic functionality

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = tests/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s (%(filename)s:%(lineno)d)
log_file_date_format = %Y-%m-%d %H:%M:%S

# Minimum Python version
minversion = 6.0

# Test execution options
junit_family = xunit2
junit_logging = all

# Filter warnings
filterwarnings =
    ignore::pytest.PytestCollectionWarning:.*TestConfig.*
    ignore::pytest.PytestCollectionWarning:.*TestCase.*
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*docker.*:UserWarning
    ignore::urllib3.exceptions.InsecureRequestWarning
    ignore:cannot collect test class.*TestConfig.*:pytest.PytestCollectionWarning
    error::pytest.PytestUnraisableExceptionWarning
