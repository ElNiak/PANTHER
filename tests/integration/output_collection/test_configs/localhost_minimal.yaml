logging:
  level: INFO

observers:
  logger:
    enabled: true
  storage:
    enabled: true

paths:
  output_dir: "test_outputs"

docker:
  build_docker_image: true

tests:
  - name: "Output Collection Test - Localhost"
    description: "Test output collection in localhost single container"
    network_environment:
      type: localhost_single_container
    services:
      test_service:
        implementation:
          name: test_output_service
          type: iut
          runtime_seconds: 2
          create_additional_files: true
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 20
    steps:
      wait: 8
