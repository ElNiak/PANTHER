logging:
  level: INFO

observers:
  logger:
    enabled: true
  storage:
    enabled: true

paths:
  output_dir: "test_outputs"

docker:
  build_docker_image: true

tests:
  - name: "Output Collection Test - Shadow NS"
    description: "Test output collection in Shadow NS simulation"
    network_environment:
      type: shadow_ns
      shadow:
        duration: "15s"
        seed: 12345
    services:
      sim_server:
        implementation:
          name: test_output_service
          type: iut
          runtime_seconds: 2
          create_additional_files: false
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 25

      sim_client:
        implementation:
          name: test_output_service
          type: iut
          runtime_seconds: 1
          create_additional_files: false
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: sim_server
        timeout: 25
    steps:
      wait: 20
