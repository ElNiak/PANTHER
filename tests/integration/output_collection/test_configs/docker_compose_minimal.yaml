logging:
  level: INFO

observers:
  logger:
    enabled: true
    log_level: INFO
  storage:
    enabled: true

paths:
  output_dir: "test_outputs"
  log_dir: "test_outputs/logs"

docker:
  build_docker_image: true

tests:
  - name: "Output Collection Test - Docker Compose"
    description: "Test output collection in Docker Compose environment"
    network_environment:
      type: docker_compose
    services:
      test_server:
        implementation:
          name: test_output_service
          type: iut
          runtime_seconds: 3
          create_additional_files: true
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 30
        ports:
          - "4443:4443"
      
      test_client:
        implementation:
          name: test_output_service
          type: iut
          runtime_seconds: 2
          create_additional_files: false
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: test_server
        timeout: 30
    steps:
      wait: 10