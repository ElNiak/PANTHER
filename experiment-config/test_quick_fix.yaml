# Quick test configuration to verify picoquic fix
logging:
  level: DEBUG

docker:
  build_docker_image: false  # Use existing images

tests:
  - name: "Quick PicoQUIC Fix Test"
    description: "Verify picoquic Dockerfile discovery fix"
    iterations: 1
    network_environment:
      type: docker_compose
    services:
      picoquic_server:
        name: picoquic_server
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 180
        ports:
          - "4443:4443"
        generate_new_certificates: true
      picoquic_client:
        name: picoquic_client
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: picoquic_server
        timeout: 180
        generate_new_certificates: true
    steps:
      wait: 120  # 2 minutes to allow services to fully start and connect