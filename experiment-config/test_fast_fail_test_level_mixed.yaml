# Test Configuration: Test-Level Fast-Fail Control
# Validates per-test fast-fail overrides and inheritance behavior

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: true
  redirect_logging: true

observers:
  logger:
    enabled: true
    log_level: "INFO"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"
    track_timing: true
    track_steps: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  build_docker_image: true

# Fast-Fail Configuration: Test-Level Control Enabled
fast_fail:
  enabled: true                      # Global default is enabled
  test_level: true                   # Enable per-test control
  docker_build_failures: true
  docker_runtime_failures: true
  plugin_load_failures: true
  service_start_failures: true
  network_setup_failures: true
  port_conflict_failures: true
  ivy_compilation_failures: false   # Allow Ivy tests to continue by default
  resource_exhaustion: true
  certificate_failures: true
  configuration_failures: true
  timeout_cascades: true
  critical_only: false
  max_errors_before_fail: 8
  timeout_cascade_threshold: 3
  disk_space_threshold_gb: 1.5

tests:
  - name: "Inherit Global Enabled"
    description: "Test inherits global enabled setting (fast_fail_enabled not specified)"
    # fast_fail_enabled: not specified - should inherit global enabled=true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_inherit"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_inherit"
        ports:
          - "5000:5000"
          - "8081:8081"
        generate_new_certificates: true

      ivy_server_inherit:
        name: "ivy_server_inherit"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"
          - "8080:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Override to Disabled"
    description: "Test explicitly overrides to disable fast-fail"
    fast_fail_enabled: false          # Override global enabled=true to disabled
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_override_disabled"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_override_disabled"
        ports:
          - "5001:5000"
          - "8082:8081"
        generate_new_certificates: true

      ivy_server_override_disabled:
        name: "ivy_server_override_disabled"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4444:4443"
          - "4988:4987"
          - "8083:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Override to Enabled"
    description: "Test explicitly overrides to enable fast-fail (redundant but explicit)"
    fast_fail_enabled: true           # Explicit override to enabled (same as global)
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_override_enabled"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_override_enabled"
        ports:
          - "5002:5000"
          - "8084:8081"
        generate_new_certificates: true

      ivy_server_override_enabled:
        name: "ivy_server_override_enabled"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4445:4443"
          - "4989:4987"
          - "8085:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Critical Infrastructure Test"
    description: "Critical test that must fail fast on any error"
    fast_fail_enabled: true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_critical"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_critical"
        ports:
          - "5003:5000"
          - "8086:8081"
        generate_new_certificates: true

      ivy_server_critical:
        name: "ivy_server_critical"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4446:4443"
          - "4990:4987"
          - "8087:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Experimental Test"
    description: "Experimental test that should continue on errors"
    fast_fail_enabled: false
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_experimental"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_experimental"
        ports:
          - "5004:5000"
          - "8088:8081"
        generate_new_certificates: true

      ivy_server_experimental:
        name: "ivy_server_experimental"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4447:4443"
          - "4991:4987"
          - "8089:8080"
        generate_new_certificates: true
    steps:
      wait: 60