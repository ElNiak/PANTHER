logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true
  
  # Service Management Focus - Debug service coordination and QUIC implementations
  feature_levels:
    # Service Management - Maximum verbosity
    service_managers: TRACE         # Maximum service manager details
    quic_services: TRACE           # Maximum QUIC implementation debugging
    ivy_operations: DEBUG          # Ivy formal verification debugging
    service_coordination: TRACE    # Maximum service coordination details
    plugin_loading: DEBUG          # Plugin discovery and loading details
    
    # Command and Template Generation for Services
    command_generation: DEBUG      # Command building for services
    template_rendering: DEBUG      # Template processing for service commands
    
    # Protocol Operations - Detailed for service communication
    protocol_communication: DEBUG  # Protocol-level communication
    certificate_management: DEBUG  # TLS certificate handling for services
    port_management: DEBUG        # Port allocation and service conflicts
    
    # Environment Setup - Basic info for service deployment
    network_environments: INFO     # Network environment setup
    docker_compose: INFO          # Docker Compose for services
    docker_operations: INFO       # Docker operations
    
    # Core Components - Moderate verbosity
    config_processing: INFO        # Configuration loading
    file_operations: INFO         # File operations
    network_setup: INFO          # Network configuration
    
    # Event System - Moderate for service events
    event_system: INFO            # Event emission and processing
    event_emission: INFO          # Event creation
    event_processing: INFO        # Event handling for services
    state_management: INFO        # State transitions
    observer_operations: INFO     # Observer operations
    
    # Data and Metrics - Service-related metrics
    metrics_collection: DEBUG     # Service metrics collection
    result_processing: INFO       # Service test results
    output_aggregation: INFO     # Service output collection
    data_storage: INFO           # Data storage
    
    # Development and Debugging - Focus on service execution
    test_execution: DEBUG         # Test execution details
    experiment_workflow: INFO    # Experiment workflow
    validation_checks: INFO      # Validation
    error_handling: ERROR        # Service errors
    
    # Environment-specific features - Basic
    execution_environments: INFO  # Execution environments
    shadow_ns: INFO              # Shadow simulator
    localhost_container: INFO    # Container operations

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: false     # Reduce Docker noise to focus on services
  use_emojis: false
  redirect_logging: false

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  build_docker_image: false     # Use existing images to focus on service logic

observers:
  logger:
    enabled: true
    log_level: "DEBUG"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "DEBUG"           # Detailed metrics for service monitoring
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"           # Track service workflow
    track_timing: true
    track_steps: true

tests:
  - name: "Service Management Focus Test"
    description: "Test service-focused logging for debugging QUIC implementations and service coordination"
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      ivy_server:
        name: "ivy_server"
        timeout: 100
        implementation:
          type: "testers"
          name: "panther_ivy"
          test: "quic_client_test_max"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"
        generate_new_certificates: true

      picoquic_client:
        name: "picoquic_client"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server"
        generate_new_certificates: true
        
      # Add multiple implementations to test service coordination
      aioquic_client:
        name: "aioquic_client"
        timeout: 60
        implementation:
          name: "aioquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server"
        ports:
          - "5000:5000"
        generate_new_certificates: true
    steps:
      wait: 60