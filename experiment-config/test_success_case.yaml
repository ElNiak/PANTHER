# Test configuration to verify success case reporting
experiment:
  name: "Success Case Test"
  description: "Test that successful experiments are reported correctly"

# Global configuration
logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"

observers:
  logger:
    enabled: true
    log_level: "INFO"
  metrics:
    enabled: false
  storage:
    enabled: false
  experiment:
    enabled: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  plugin_dir: "panther/plugins"

docker:
  build_docker_image: true

tests:
  - name: "Simple QUIC Test"
    description: "Basic QUIC client-server test"
    network_environment:
      type: docker_compose
    services:
      quic_server:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 60
        ports:
          - "4443:4443"
        generate_new_certificates: true
      
      quic_client:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: quic_server
        timeout: 60
        generate_new_certificates: true
    steps:
      wait: 30  # Short wait time