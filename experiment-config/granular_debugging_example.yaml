logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true
  
  # Feature-specific logging levels for granular debugging
  feature_levels:
    # Core Components - set to DEBUG for detailed debugging
    command_generation: DEBUG        # Show command building details
    template_rendering: INFO        # Template processing
    docker_operations: DEBUG        # Docker build and container management
    config_processing: INFO         # Configuration loading and validation
    event_system: WARNING           # Event emission and processing
    file_operations: INFO           # File I/O operations
    
    # Service Management - useful for debugging service issues
    service_managers: DEBUG          # Service manager operations
    ivy_operations: DEBUG           # Ivy formal verification debugging
    quic_services: INFO             # QUIC implementation debugging
    plugin_loading: INFO            # Plugin discovery and loading
    service_coordination: INFO      # Service coordination and dependencies
    
    # Environment Management - critical for deployment debugging
    network_environments: DEBUG     # Network environment setup
    execution_environments: INFO    # Execution environment configuration
    docker_compose: DEBUG          # Docker Compose orchestration
    shadow_ns: INFO                 # Shadow Network Simulator
    localhost_container: INFO       # Single container deployments
    
    # Event System - reduce noise unless debugging events
    event_emission: WARNING         # Event creation and emission
    event_processing: WARNING       # Event handling and observers
    state_management: WARNING       # State transitions
    observer_operations: INFO       # Observer pattern implementations
    
    # Protocol Operations - useful for network debugging
    certificate_management: INFO    # TLS certificate handling
    network_setup: DEBUG           # Network configuration
    port_management: DEBUG         # Port allocation and conflicts
    protocol_communication: INFO    # Protocol-level communication
    
    # Data and Metrics - typically set to INFO unless debugging data issues
    metrics_collection: INFO        # System and custom metrics
    data_storage: INFO             # Data persistence and storage
    result_processing: INFO         # Test result processing
    output_aggregation: INFO       # Output collection and aggregation
    
    # Development and Debugging - adjust based on current focus
    test_execution: INFO            # Test case execution
    experiment_workflow: DEBUG      # Experiment lifecycle
    validation_checks: INFO         # Configuration and input validation
    error_handling: ERROR          # Error handling and fast-fail

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: false
  redirect_logging: false  # Keep false to preserve colored feature logging

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  build_docker_image: false

observers:
  logger:
    enabled: true
    log_level: "DEBUG"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"
    track_timing: true
    track_steps: true

tests:
  - name: "Feature Logging Test"
    description: "Test granular feature-based logging capabilities"
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_server:
        name: "picoquic_server"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
        generate_new_certificates: true
      
      picoquic_client:
        name: "picoquic_client"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"
        generate_new_certificates: true
    steps:
      wait: 30