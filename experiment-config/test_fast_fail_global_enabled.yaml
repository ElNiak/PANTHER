# Test Configuration: Global Fast-Fail Enabled
# Validates basic fast-fail behavior when globally enabled

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: true
  redirect_logging: true

observers:
  logger:
    enabled: true
    log_level: "INFO"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"
    track_timing: true
    track_steps: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  build_docker_image: true

# Fast-Fail Configuration: Global Enabled, No Test-Level Control
fast_fail:
  enabled: true                      # Global fast-fail enabled
  test_level: false                  # No per-test control
  docker_build_failures: true       # Fail on Docker build errors
  docker_runtime_failures: true     # Fail on Docker runtime errors
  plugin_load_failures: true        # Fail on plugin loading errors
  service_start_failures: true      # Fail on service startup errors
  network_setup_failures: true      # Fail on network setup errors
  port_conflict_failures: true      # Fail on port conflicts
  ivy_compilation_failures: true    # Fail on Ivy compilation errors
  resource_exhaustion: true         # Fail on resource exhaustion
  certificate_failures: true        # Fail on certificate errors
  configuration_failures: true      # Fail on configuration errors
  timeout_cascades: true           # Fail on timeout cascades
  critical_only: false              # Fail on all error types
  max_errors_before_fail: 5         # Lower threshold for testing
  timeout_cascade_threshold: 2      # Quick cascade detection
  disk_space_threshold_gb: 1.0      # Low disk space threshold

tests:
  - name: "Fast-Fail Global Enabled Test 1"
    description: "Test should inherit global fast-fail enabled setting"
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server"
        ports:
          - "5000:5000"
          - "8081:8081"
        generate_new_certificates: true

      ivy_server:
        name: "ivy_server"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"
          - "8080:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Fast-Fail Global Enabled Test 2"
    description: "Second test should also inherit global fast-fail enabled setting"
    # Note: fast_fail_enabled not specified - should inherit global enabled=true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_2"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_2"
        ports:
          - "5001:5000"
          - "8082:8081"
        generate_new_certificates: true

      ivy_server_2:
        name: "ivy_server_2"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4444:4443"
          - "4988:4987"
          - "8083:8080"
        generate_new_certificates: true
    steps:
      wait: 60