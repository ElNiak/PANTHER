# Test Configuration: Fast-Fail Cascade Detection Testing
# Validates error cascade detection and threshold-based fast-fail behavior

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: true
  redirect_logging: true

observers:
  logger:
    enabled: true
    log_level: "INFO"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"
    track_timing: true
    track_steps: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  force_build_docker_image: true

# Fast-Fail Configuration: Cascade Detection Focus
fast_fail:
  enabled: true                      # Global fast-fail enabled
  test_level: true                   # Enable per-test control

  # Error type configuration
  docker_build_failures: true
  docker_runtime_failures: true
  plugin_load_failures: true
  service_start_failures: true
  network_setup_failures: true
  port_conflict_failures: true
  ivy_compilation_failures: true
  resource_exhaustion: true
  certificate_failures: true
  configuration_failures: true
  timeout_cascades: true           # Enable timeout cascade detection

  # Cascade detection settings - AGGRESSIVE for testing
  critical_only: false              # Detect cascades for all error types
  max_errors_before_fail: 3         # LOW threshold - fail after 3 errors
  timeout_cascade_threshold: 2      # AGGRESSIVE - fail after 2 consecutive timeouts
  disk_space_threshold_gb: 0.1      # VERY LOW - 100MB threshold

tests:
  - name: "Low Error Threshold Test"
    description: "Test should fail fast after max_errors_before_fail (3 errors)"
    fast_fail_enabled: true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_low_threshold"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_low_threshold"
        ports:
          - "5000:5000"
          - "8081:8081"
        generate_new_certificates: true

      ivy_server_low_threshold:
        name: "ivy_server_low_threshold"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"
          - "8080:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Timeout Cascade Test"
    description: "Test should fail fast after timeout_cascade_threshold (2 consecutive timeouts)"
    fast_fail_enabled: true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 30                  # SHORT timeout to trigger timeouts
        name: "picoquic_client_timeout_cascade"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_timeout_cascade"
        ports:
          - "5001:5000"
          - "8082:8081"
        generate_new_certificates: true

      ivy_server_timeout_cascade:
        name: "ivy_server_timeout_cascade"
        timeout: 30                  # SHORT timeout to trigger timeouts
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4444:4443"
          - "4988:4987"
          - "8083:8080"
        generate_new_certificates: true
    steps:
      wait: 120                      # LONGER wait to trigger timeout cascade

  - name: "Disk Space Threshold Test"
    description: "Test should fail fast if disk space falls below threshold (100MB)"
    fast_fail_enabled: true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_disk_test"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_disk_test"
        ports:
          - "5002:5000"
          - "8084:8081"
        generate_new_certificates: true

      ivy_server_disk_test:
        name: "ivy_server_disk_test"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4445:4443"
          - "4989:4987"
          - "8085:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Cascade Disabled Test"
    description: "Test with fast-fail disabled should NOT trigger cascade detection"
    fast_fail_enabled: false         # Disabled - should ignore all thresholds
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 30                  # SHORT timeout but fast-fail disabled
        name: "picoquic_client_cascade_disabled"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_cascade_disabled"
        ports:
          - "5003:5000"
          - "8086:8081"
        generate_new_certificates: true

      ivy_server_cascade_disabled:
        name: "ivy_server_cascade_disabled"
        timeout: 30                  # SHORT timeout but fast-fail disabled
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4446:4443"
          - "4990:4987"
          - "8087:8080"
        generate_new_certificates: true
    steps:
      wait: 120                      # LONGER wait - should continue despite timeouts

  - name: "Multiple Error Types Test"
    description: "Test with multiple potential error sources to trigger various cascade types"
    fast_fail_enabled: true
    network_environment:
      type: "docker_compose"
    iterations: 2                    # Multiple iterations to increase error chances
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_multi_error"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_multi_error"
        ports:
          - "5004:5000"
          - "8088:8081"
        generate_new_certificates: true

      ivy_server_multi_error:
        name: "ivy_server_multi_error"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4447:4443"
          - "4991:4987"
          - "8089:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Resource Exhaustion Test"
    description: "Test designed to potentially trigger resource exhaustion errors"
    fast_fail_enabled: true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_resource_test"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_resource_test"
        ports:
          - "5005:5000"
          - "8090:8081"
        generate_new_certificates: true

      ivy_server_resource_test:
        name: "ivy_server_resource_test"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4448:4443"
          - "4992:4987"
          - "8091:8080"
        generate_new_certificates: true
    steps:
      wait: 60
