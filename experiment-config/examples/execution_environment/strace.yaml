logging:
  level: DEBUG

docker:
  force_build_docker_image: false

tests:
  - name: "Strace Test - IvyServer Client Communication"
    description: "Test strace execution environment wrapping"
    network_environment:
      type: docker_compose
    execution_environment:
      - type: strace
    iterations: 1
    services:
      ivy_server:
        name: ivy_server
        timeout: 60
        implementation:
          name: panther_ivy
          type: TESTERS
          test: quic_client_test_max
        protocol:
          name: quic
          version: rfc9000
          role: server
        ports:
          - "4443:4443"
        generate_new_certificates: true

      picoquic_client:
        name: picoquic_client
        timeout: 50
        implementation:
          name: picoquic
          type: IUT
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: ivy_server
        ports:
          - "5000:5000"
        generate_new_certificates: true
    steps:
      wait: 30
