name: Test GDB Fix
test_suite:
  tests:
    - name: Test GDB Wrapper
      type: QUIC_Server_Client_Communication_Test
      testname: test_stream
      network_environment:
        type: docker_compose
        enable_background_monitoring: true
        monitoring_interval_seconds: 5
        failure_threshold_count: 1
      execution_environment:
        - type: gdb
          enabled: true
          plugin_config:
            gdb_binary: /usr/bin/gdb
            enable_core_dumps: true
            auto_backtrace: true
      services:
        picoquic_server:
          implementation:
            name: picoquic
            type: iut
          protocol:
            name: quic
            version: rfc9000
            role: server
          timeout: 30
        ivy_client:
          implementation:
            name: ivy
            type: tester
            version: client
          protocol:
            name: quic
            version: rfc9000
            role: client
            target: picoquic_server
          timeout: 30
global:
  coordination:
    port_manager:
      start_port: 5000
      end_port: 9999
      reserved_ports: []
  runtime:
    default_timeout: 120
    cleanup_policy: keep_on_failure
    log_level: DEBUG
    parallel_execution: false
  plugins:
    lazy_loading: true
    cache_discovery: true
    auto_reload: false
  output:
    capture_stdout: true
    capture_stderr: true
    buffer_size: 1048576
    save_artifacts: true
