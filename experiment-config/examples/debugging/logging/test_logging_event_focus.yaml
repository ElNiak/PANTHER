logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

  # Event System Focus - Debug event flow, state management, and observer patterns
  feature_levels:
    # Event System - Maximum verbosity
    event_system: TRACE           # Maximum event emission and processing details
    event_emission: TRACE         # Maximum event creation details
    event_processing: TRACE       # Maximum event handling details
    state_management: TRACE       # Maximum state transition details
    observer_operations: TRACE    # Maximum observer pattern details

    # Experiment and Test Workflow - Detailed for event tracking
    experiment_workflow: DEBUG    # Experiment lifecycle events
    test_execution: DEBUG         # Test execution events

    # Service Events - Detailed for service state events
    service_managers: DEBUG       # Service manager events
    service_coordination: DEBUG   # Service coordination events

    # Environment Events - Detailed for environment state changes
    network_environments: DEBUG   # Network environment events
    docker_compose: DEBUG        # Docker Compose events

    # Data and Metrics - Event-related metrics
    metrics_collection: DEBUG     # Metrics collection events
    result_processing: DEBUG      # Result processing events
    output_aggregation: DEBUG     # Output aggregation events
    data_storage: DEBUG          # Storage events

    # Plugin Events - Plugin lifecycle events
    plugin_loading: DEBUG        # Plugin loading events

    # Core Components - Moderate verbosity for event context
    config_processing: INFO       # Configuration events
    file_operations: INFO        # File operation events
    command_generation: INFO     # Command generation events
    template_rendering: INFO     # Template rendering events

    # Infrastructure - Basic info
    docker_operations: INFO      # Docker operation events
    network_setup: INFO         # Network setup events
    port_management: INFO       # Port management events
    certificate_management: INFO # Certificate events
    protocol_communication: INFO # Protocol events

    # Service Implementation - Basic info
    quic_services: INFO          # QUIC service events
    ivy_operations: INFO         # Ivy operation events

    # Environment-specific - Basic info
    execution_environments: INFO # Execution environment events
    shadow_ns: INFO             # Shadow simulator events
    localhost_container: INFO   # Container events

    # Development and Debugging - Focus on event debugging
    validation_checks: INFO      # Validation events
    error_handling: DEBUG       # Error handling events

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: false     # Reduce Docker noise to focus on events
  use_emojis: false
  redirect_logging: false

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  force_build_docker_image: false     # Use existing images to focus on event flow

observers:
  logger:
    enabled: true
    log_level: "TRACE"           # Maximum logger observer verbosity
    enable_colors: true
    correlation_tracking: true   # Enable correlation tracking for event debugging

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "DEBUG"           # Detailed metrics observer logging
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "DEBUG"           # Detailed storage observer logging
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "TRACE"           # Maximum experiment observer verbosity
    track_timing: true
    track_steps: true

tests:
  - name: "Event System Focus Test"
    description: "Test event-focused logging for debugging event flow, state management, and observer patterns"
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_server:
        name: "picoquic_server"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
        generate_new_certificates: true

      picoquic_client:
        name: "picoquic_client"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"
        generate_new_certificates: true
    steps:
      wait: 30
