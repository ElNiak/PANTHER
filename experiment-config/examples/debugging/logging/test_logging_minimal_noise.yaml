logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

  # Minimal Noise Mode - Production-like logging with minimal verbosity
  feature_levels:
    # Critical System Components - Only essential information
    error_handling: ERROR         # Only show actual errors
    validation_checks: WARNING    # Only validation warnings and errors

    # Core Execution - Minimal essential information
    experiment_workflow: INFO     # Basic experiment progress
    test_execution: INFO          # Basic test execution status

    # Service Management - Essential service information only
    service_managers: WARNING     # Only service issues
    quic_services: WARNING        # Only QUIC implementation issues
    ivy_operations: WARNING       # Only Ivy issues
    service_coordination: WARNING # Only coordination problems

    # Infrastructure - Only critical infrastructure messages
    docker_operations: WARNING    # Only Docker issues
    docker_compose: WARNING       # Only Docker Compose issues
    network_environments: WARNING # Only network environment issues
    network_setup: WARNING        # Only network problems
    port_management: WARNING      # Only port conflicts

    # Build and Deployment - Minimal information
    command_generation: WARNING   # Only command issues
    template_rendering: WARNING   # Only template issues
    config_processing: WARNING    # Only config issues

    # Environment-specific - Minimal
    execution_environments: WARNING # Only execution environment issues
    shadow_ns: WARNING           # Only Shadow simulator issues
    localhost_container: WARNING # Only container issues

    # Event System - Reduce event noise significantly
    event_system: ERROR          # Only event system errors
    event_emission: ERROR        # Only event emission errors
    event_processing: ERROR      # Only event processing errors
    state_management: ERROR      # Only state management errors
    observer_operations: WARNING # Only observer issues

    # Protocol Operations - Minimal protocol information
    certificate_management: WARNING # Only certificate issues
    protocol_communication: WARNING # Only protocol problems

    # Data and Metrics - Essential metrics only
    metrics_collection: WARNING   # Only metrics issues
    data_storage: WARNING        # Only storage issues
    result_processing: INFO      # Basic result information
    output_aggregation: WARNING  # Only output issues

    # Plugin System - Minimal plugin information
    plugin_loading: WARNING      # Only plugin loading issues

    # File Operations - Only file issues
    file_operations: WARNING     # Only file operation issues

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: false     # Disable Docker events to reduce noise
  use_emojis: true              # Use emojis for cleaner progress display
  redirect_logging: true        # Redirect detailed logging to preserve clean output

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  force_build_docker_image: false     # Use existing images for faster execution

observers:
  logger:
    enabled: true
    log_level: "WARNING"         # Minimal logger observer verbosity
    enable_colors: true
    correlation_tracking: false  # Disable correlation tracking to reduce noise

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "WARNING"         # Minimal metrics observer logging
    publish_interval: 60         # Longer interval for less frequent metrics

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "WARNING"         # Minimal storage observer logging
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "INFO"            # Basic experiment tracking only
    track_timing: false          # Disable detailed timing tracking
    track_steps: false           # Disable detailed step tracking

tests:
  - name: "Minimal Noise Test"
    description: "Test minimal noise logging for production-like clean execution with essential information only"
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_server:
        name: "picoquic_server"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
        generate_new_certificates: true

      picoquic_client:
        name: "picoquic_client"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"
        generate_new_certificates: true
    steps:
      wait: 30
