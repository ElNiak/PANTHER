logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

  # Network Environment Focus - Debug network setup, deployment, and communication
  feature_levels:
    # Network and Environment Operations - Maximum verbosity
    network_environments: TRACE    # Maximum network environment details
    network_setup: TRACE          # Maximum network configuration details
    docker_compose: TRACE         # Maximum Docker Compose orchestration
    port_management: TRACE        # Maximum port allocation debugging
    protocol_communication: DEBUG  # Protocol-level communication details

    # Certificate and Security - Important for network debugging
    certificate_management: DEBUG  # TLS certificate handling

    # Docker Operations - Detailed for deployment
    docker_operations: DEBUG      # Docker operations for deployment

    # Service Coordination - Detailed for network service interaction
    service_coordination: DEBUG   # Service coordination over network
    template_rendering: DEBUG     # Template processing for network configs
    command_generation: DEBUG     # Command building for network operations

    # Environment-specific features - Maximum verbosity
    shadow_ns: TRACE             # Maximum Shadow Network Simulator details
    localhost_container: DEBUG   # Container networking
    execution_environments: INFO # Execution environments

    # Service Management - Basic info for network services
    service_managers: INFO        # Service manager operations
    quic_services: INFO          # QUIC implementations
    ivy_operations: INFO         # Ivy operations
    plugin_loading: INFO         # Plugin loading

    # Core Components - Moderate verbosity
    config_processing: INFO       # Configuration loading
    file_operations: INFO        # File operations

    # Event System - Moderate for network events
    event_system: INFO           # Event emission and processing
    event_emission: INFO         # Event creation
    event_processing: INFO       # Event handling
    state_management: INFO       # State transitions
    observer_operations: INFO    # Observer operations

    # Data and Metrics - Network-related metrics
    metrics_collection: INFO     # System metrics
    result_processing: INFO      # Results
    output_aggregation: INFO     # Output collection
    data_storage: INFO          # Data storage

    # Development and Debugging - Focus on network execution
    test_execution: INFO         # Test execution
    experiment_workflow: INFO   # Experiment workflow
    validation_checks: DEBUG    # Network validation
    error_handling: ERROR       # Network errors

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true      # Show Docker events for network debugging
  use_emojis: false
  redirect_logging: false

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  force_build_docker_image: false    # Use existing images to focus on network setup

observers:
  logger:
    enabled: true
    log_level: "DEBUG"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "INFO"
    track_timing: true
    track_steps: true

tests:
  - name: "Network Environment Focus Test"
    description: "Test network-focused logging for debugging deployment, networking, and communication issues"
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_server:
        name: "picoquic_server"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "8080:8080"  # Additional port for testing port management
        generate_new_certificates: true

      picoquic_client:
        name: "picoquic_client"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"
        generate_new_certificates: true

      # Add second client to test network coordination
      aioquic_client:
        name: "aioquic_client"
        timeout: 60
        implementation:
          name: "aioquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"
        ports:
          - "5000:5000"
        generate_new_certificates: true
    steps:
      wait: 45
