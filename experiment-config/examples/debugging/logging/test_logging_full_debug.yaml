logging:
  level: DEBUG
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

  # Full Debug Mode - Maximum verbosity for all features
  feature_levels:
    # Core Components - All at DEBUG/TRACE
    command_generation: TRACE       # Maximum verbosity for command building
    template_rendering: DEBUG       # Template processing details
    docker_operations: TRACE        # Maximum Docker verbosity
    config_processing: DEBUG        # Configuration loading details
    event_system: DEBUG             # Event emission and processing
    file_operations: DEBUG          # File I/O operations

    # Service Management - All at DEBUG/TRACE
    service_managers: TRACE          # Maximum service manager details
    ivy_operations: DEBUG           # Ivy formal verification
    quic_services: TRACE            # Maximum QUIC implementation details
    plugin_loading: DEBUG           # Plugin discovery and loading
    service_coordination: DEBUG     # Service coordination and dependencies

    # Environment Management - All at DEBUG/TRACE
    network_environments: TRACE     # Maximum network environment details
    execution_environment: DEBUG   # Execution environment configuration
    docker_compose: TRACE          # Maximum Docker Compose details
    shadow_ns: DEBUG                # Shadow Network Simulator
    localhost_container: DEBUG      # Single container deployments

    # Event System - All at DEBUG/TRACE
    event_emission: TRACE           # Maximum event creation details
    event_processing: DEBUG         # Event handling and observers
    state_management: DEBUG         # State transitions
    observer_operations: DEBUG      # Observer pattern implementations

    # Protocol Operations - All at DEBUG/TRACE
    certificate_management: DEBUG   # TLS certificate handling
    network_setup: TRACE           # Maximum network configuration details
    port_management: DEBUG         # Port allocation and conflicts
    protocol_communication: DEBUG   # Protocol-level communication

    # Data and Metrics - All at DEBUG/TRACE
    metrics_collection: DEBUG       # System and custom metrics
    data_storage: DEBUG            # Data persistence and storage
    result_processing: DEBUG       # Test result processing
    output_aggregation: DEBUG      # Output collection and aggregation

    # Development and Debugging - All at DEBUG/TRACE
    test_execution: DEBUG           # Test case execution
    experiment_workflow: TRACE     # Maximum experiment lifecycle details
    validation_checks: DEBUG       # Configuration and input validation
    error_handling: DEBUG          # Error handling and fast-fail

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: false
  redirect_logging: false  # Keep false to preserve colored feature logging

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  force_build_docker_image: false  # Use existing images for faster testing

observers:
  logger:
    enabled: true
    log_level: "TRACE"          # Maximum observer verbosity
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "DEBUG"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "DEBUG"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "TRACE"          # Maximum experiment tracking
    track_timing: true
    track_steps: true

tests:
  - name: "Full Debug Logging Test"
    description: "Test maximum verbosity logging with all features at DEBUG/TRACE level"
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_server:
        name: "picoquic_server"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
        generate_new_certificates: true

      picoquic_client:
        name: "picoquic_client"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"
        generate_new_certificates: true
    steps:
      wait: 30
