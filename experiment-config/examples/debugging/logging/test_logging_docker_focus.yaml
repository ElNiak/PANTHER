logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

  # Docker Operations Focus - Debug Docker and build issues
  feature_levels:
    # Docker and Build Operations - Maximum verbosity
    docker_operations: TRACE        # Maximum Docker verbosity for debugging builds
    docker_compose: TRACE          # Maximum Docker Compose orchestration details
    command_generation: DEBUG       # Command building for Docker operations
    template_rendering: DEBUG       # Template processing for Dockerfiles

    # Infrastructure Setup - Detailed logging
    network_environments: DEBUG     # Network environment setup
    port_management: DEBUG         # Port allocation and conflicts
    network_setup: INFO            # Basic network configuration

    # Core Components - Moderate verbosity
    config_processing: INFO         # Configuration loading
    file_operations: INFO          # File I/O operations
    service_coordination: INFO     # Service coordination

    # Service Management - Basic info
    service_managers: INFO          # Service manager operations
    quic_services: INFO            # QUIC implementations
    ivy_operations: INFO           # Ivy operations
    plugin_loading: INFO           # Plugin loading

    # Event System - Reduce noise unless needed
    event_system: WARNING          # Event emission and processing
    event_emission: WARNING        # Event creation
    event_processing: WARNING      # Event handling
    state_management: WARNING      # State transitions
    observer_operations: INFO      # Observer operations

    # Protocol Operations - Basic info
    certificate_management: INFO   # TLS certificate handling
    protocol_communication: INFO   # Protocol communication

    # Data and Metrics - Minimal noise
    metrics_collection: INFO       # Metrics
    data_storage: INFO            # Storage
    result_processing: INFO       # Results
    output_aggregation: INFO      # Output collection

    # Development and Debugging - Focus on execution
    test_execution: INFO           # Test execution
    experiment_workflow: INFO     # Experiment workflow
    validation_checks: INFO       # Validation
    error_handling: ERROR         # Only show errors

    # Environment-specific features
    execution_environment: INFO   # Execution environments
    shadow_ns: INFO               # Shadow simulator
    localhost_container: DEBUG    # Container debugging

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true       # Show Docker events in progress
  use_emojis: false
  redirect_logging: false

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  force_build_docker_image: false
  log_docker_image_build: true
  use_buildx: true

observers:
  logger:
    enabled: true
    log_level: "DEBUG"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "INFO"
    track_timing: true
    track_steps: true

tests:
  - name: "Docker Operations Focus Test"
    description: "Test Docker-focused logging for debugging container build and deployment issues"
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_server:
        name: "picoquic_server"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
        generate_new_certificates: true

      picoquic_client:
        name: "picoquic_client"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"
        generate_new_certificates: true
    steps:
      wait: 30
