# Example configuration for error-only logging
# Use this configuration to show only error logs during experiment execution

logging:
  level: ERROR  # Only show ERROR and CRITICAL messages
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  plugin_dir: "panther/plugins"

docker:
  force_build_docker_image: false

# Configure all observers to only log errors
observers:
  logger:
    enabled: true
    log_level: "ERROR"  # Only errors from logger observer
    enable_colors: true
    correlation_tracking: false  # Disable verbose correlation tracking

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "ERROR"  # Only errors from metrics observer
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "ERROR"  # Only errors from storage observer
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "ERROR"  # Only errors from experiment observer
    track_timing: true
    track_steps: true

# Optional: Configure progress display to be less verbose
progress:
  enable_progress_bar: true
  show_test_status: false  # Disable test status messages
  show_docker_events: false  # Disable Docker event messages
  use_emojis: false
  redirect_logging: true

# Rest of your experiment configuration goes here...
tests:
  - name: "Your Test"
    description: "Your test description"
    network_environment:
      type: docker_compose
    services:
      # Your services configuration...
