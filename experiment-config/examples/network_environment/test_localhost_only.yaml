logging:
  level: DEBUG
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"

docker:
  force_build_docker_image: false

observers:
  logger:
    enabled: true
    log_level: "DEBUG"
    enable_colors: true
    correlation_tracking: true

tests:
  - name: "Localhost QUIC Client-Server Communication Test"
    description: "Verify that the Picoquic server can communicate with the Picoquic client over localhost network."
    network_environment:
      type: "localhost_single_container"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_server:
        name: "picoquic_server"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "8080:8080"
      picoquic_client:
        timeout: 100
        name: "picoquic_client"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"
        ports:
          - "5000:5000"
          - "8081:8081"
        generate_new_certificates: true
    steps:
      wait: 30
