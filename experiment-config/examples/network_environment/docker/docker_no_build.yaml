logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  force_build_docker_image: False  # Disable Docker builds - use existing images

tests:
  - name: "QUIC Test No Build"
    description: "Test with Docker builds disabled"
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_server:
        name: "picoquic_server"
        timeout: 60
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "8080:8080"
        generate_new_certificates: True

      ivy_client:
        name: "ivy_client"
        timeout: 60
        implementation:
          name: "panther_ivy"
          type: "testers"
          test: quic_server_test_stream
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"
        ports:
          - "5000:5000"
          - "4987:4987"
          - "8081:8081"
        generate_new_certificates: True
    steps:
      wait: 60  # Short wait time for testing
