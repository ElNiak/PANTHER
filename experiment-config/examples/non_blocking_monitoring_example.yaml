# Example configuration for non-blocking Docker Compose monitoring
# This demonstrates how to enable background service monitoring

tests:
  - name: "Non-blocking QUIC Protocol Test"
    description: "Testing QUIC implementation with non-blocking service monitoring"
    
    network_environment:
      type: "docker_compose"
      version: "3.8"
      config:
        # Enable non-blocking monitoring features
        enable_background_monitoring: true
        monitoring_interval_seconds: 5
        failure_threshold_count: 3
        critical_services: ["quic_server", "ivy_client"]  # Services that must stay healthy
        allow_partial_deployment: false  # Terminate if any service fails
    
    execution_environment:
      - type: "gperf"
        cpu_limit: "2.0"
    
    services:
      quic_server:
        name: "quic_server"
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
      
      ivy_client:
        name: "ivy_client"
        implementation:
          name: "panther_ivy"
          type: "tester"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
        depends_on:
          - quic_server
