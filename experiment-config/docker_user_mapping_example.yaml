# Example PANTHER experiment configuration with Docker user mapping
# This demonstrates the new runtime user mapping feature

# Global configuration with Docker user mapping options
logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

# Observer configuration  
observers:
  logger:
    enabled: true
    log_level: "INFO"
    enable_colors: true
  metrics:
    enabled: true
    collect_system_metrics: true
  storage:
    enabled: true
    storage_path: "outputs/storage"

# Path configuration
paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  plugin_dir: "panther/plugins"

# Docker configuration with user mapping
docker:
  build_docker_image: true
  remove_docker_network: true
  remove_docker_volume: true
  
  # Docker user mapping configuration
  user_mapping:
    # Option 1: Run as host user (for volume mount compatibility)
    run_as_host_user: true
    fallback_to_root: true
    
    # Option 2: Custom user ID (uncomment to use instead)
    # run_as_host_user: false
    # custom_uid: 1001
    # custom_gid: 1001
    # user_name: "researcher"

# Fast-fail configuration
fast_fail:
  enabled: true
  test_level: false

# Feature configuration
features:
  logger_observer: true
  storage_handler: true

# Test definitions
tests:
  - name: "QUIC User Mapping Test (Host User)"
    description: "Test QUIC with host user mapping for volume compatibility"
    network_environment:
      type: docker_compose
    execution_environment: []
    services:
      server:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 100
        ports:
          - "4443:4443"
        generate_new_certificates: true
      
      client:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
        timeout: 100
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "QUIC Localhost Container Test (Host User)"
    description: "Test QUIC with localhost single container and host user mapping"
    network_environment:
      type: localhost_single_container
    execution_environment: []
    services:
      server:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 100
        ports:
          - "4444:4444"
        generate_new_certificates: true
      
      client:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
        timeout: 100
        generate_new_certificates: true
    steps:
      wait: 60