# Test Configuration: Error Category Fast-Fail Testing
# Validates selective fast-fail behavior for different error types

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: true
  redirect_logging: true

observers:
  logger:
    enabled: true
    log_level: "INFO"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"
    track_timing: true
    track_steps: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  build_docker_image: true

# Fast-Fail Configuration: Selective Error Type Configuration
fast_fail:
  enabled: true                      # Global fast-fail enabled
  test_level: true                   # Enable per-test control
  
  # Critical infrastructure errors - always fail fast
  docker_build_failures: true       # Critical - container build issues
  docker_runtime_failures: true     # Critical - container runtime issues
  resource_exhaustion: true         # Critical - system resource issues
  network_setup_failures: true      # Critical - network infrastructure
  configuration_failures: true      # Critical - invalid configurations
  
  # Service-level errors - configurable
  service_start_failures: true      # High priority - service startup
  port_conflict_failures: true      # High priority - network conflicts
  certificate_failures: true        # High priority - TLS/security issues
  
  # Test-specific errors - more permissive
  ivy_compilation_failures: false   # Allow Ivy compilation to continue
  timeout_cascades: true           # Still detect cascades
  
  # Advanced settings
  critical_only: false              # Don't limit to critical only
  max_errors_before_fail: 15        # Higher tolerance for testing
  timeout_cascade_threshold: 4      # More permissive cascade detection
  disk_space_threshold_gb: 0.5      # Lower disk space threshold

tests:
  - name: "Critical Infrastructure Test"
    description: "Test should fail fast on Docker/network/config errors"
    fast_fail_enabled: true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_infra"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_infra"
        ports:
          - "5000:5000"
          - "8081:8081"
        generate_new_certificates: true

      ivy_server_infra:
        name: "ivy_server_infra"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"
          - "8080:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Ivy Compilation Tolerance Test"
    description: "Test should continue even if Ivy compilation fails (ivy_compilation_failures: false)"
    fast_fail_enabled: true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_ivy_tolerant"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_ivy_tolerant"
        ports:
          - "5001:5000"
          - "8082:8081"
        generate_new_certificates: true

      ivy_server_ivy_tolerant:
        name: "ivy_server_ivy_tolerant"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max  # This might fail compilation
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4444:4443"
          - "4988:4987"
          - "8083:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Service Error Tolerance Test"
    description: "Test should fail fast on service start errors (service_start_failures: true)"
    fast_fail_enabled: true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_service_test"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_service_test"
        ports:
          - "5002:5000"
          - "8084:8081"
        generate_new_certificates: true

      ivy_server_service_test:
        name: "ivy_server_service_test"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4445:4443"
          - "4989:4987"
          - "8085:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Port Conflict Test"
    description: "Test should fail fast on port conflicts (port_conflict_failures: true)"
    fast_fail_enabled: true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_port_test"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_port_test"
        ports:
          - "5003:5000"
          - "8086:8081"
        generate_new_certificates: true

      ivy_server_port_test:
        name: "ivy_server_port_test"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4446:4443"
          - "4990:4987"
          - "8087:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Research Test with Disabled Fast-Fail"
    description: "Research test that should continue on all errors"
    fast_fail_enabled: false          # Override to disabled for research
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_research"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_research"
        ports:
          - "5004:5000"
          - "8088:8081"
        generate_new_certificates: true

      ivy_server_research:
        name: "ivy_server_research"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4447:4443"
          - "4991:4987"
          - "8089:8080"
        generate_new_certificates: true
    steps:
      wait: 60