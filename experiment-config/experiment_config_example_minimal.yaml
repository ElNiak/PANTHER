logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"

observers:
  logger:
    enabled: true
    log_level: "INFO"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"  # Log all messages for experiment observer
    track_timing: true
    track_steps: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  build_docker_image: false

tests:
  - name: "QUIC Client-Server Communication Test"
    description: "Verify that the Picoquic server can communicate with the Picoquic client over Shadow network."
    network_environment:
      type: "docker_compose"  # Environment plugin name
    iterations: 1
    execution_environment: []
    debug_environment: [ ]
    services:
      picoquic_client:
        timeout: 50
        name: "picoquic_client"  # Added 'name' key
        implementation:
          name: "picoquic"
          type: "iut"
          # swag: swag # Invalid key
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server"  # Docker Compose service name
          # target: "ivy_server"  # Duplicate key
        ports:
          - "5000:5000"  # Example port if needed
          - "8081:8081"  # Changed to avoid port conflict
        generate_new_certificates: True

      ivy_server:
        name: "ivy_server"  # Added 'name' key
        timeout: 50
        implementation:
          type: "testers"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"  #
          - "8080:8080"  # Health check endpoint
        generate_new_certificates: True
    steps:
      wait: 50  # seconds to wait during the test