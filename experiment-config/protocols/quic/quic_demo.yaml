logging:
  level: INFO

paths:
  output_dir: outputs

docker:
  build_docker_image: true
  # true - Rebuild the image if already present
  # but even at false, if the image build is done
  # if the image does not exist

tests:
  - name: "QUIC Connection (PicoQUIC)"
    description: "My first experiement"
    network_environment:
      type: docker_compose
    services:
      server:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
      client:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
    steps:
      wait: 15
  - name: "QUIC Connection test (PicoQUIC)"
    description: "My second experiement"
    network_environment:
      type: docker_compose
    execution_environment: # strace
      - type: strace
    services:
      server:
        timeout: 100
        implementation:
          name: panther_ivy
          type: testers
          test: quic_client_test_max
        protocol:
          name: quic
          version: rfc9000
          role: server
        ports:
          - "4443:4443"
          - "4987:4987"
      client:
        timeout: 100
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
    steps:
      wait: 100
