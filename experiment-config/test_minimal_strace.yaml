logging:
  level: DEBUG

docker:
  build_docker_image: false

tests:
  - name: "Minimal Strace Test"
    description: "Test strace output collection"
    network_environment:
      type: docker_compose
    execution_environment:
      - type: strace
    services:
      picoquic_server:
        name: picoquic_server
        timeout: 30
        implementation:
          name: picoquic
          type: IUT
        protocol:
          name: quic
          version: rfc9000
          role: server
        ports:
          - "4443:4443"
      
      picoquic_client:
        name: picoquic_client
        timeout: 30
        implementation:
          name: picoquic
          type: IUT
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: picoquic_server
    steps:
      wait: 10