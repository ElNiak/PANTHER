# Test configuration with proper timing
logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"

observers:
  logger:
    enabled: true
    log_level: "INFO"
  metrics:
    enabled: true
  storage:
    enabled: true
  experiment:
    enabled: true
    log_level: "DEBUG"

docker:
  build_docker_image: false  # Use existing images

tests:
  - name: "Simple QUIC Test with Timing Fix"
    description: "Test with increased timeouts to allow services to start properly"
    iterations: 1
    network_environment:
      type: docker_compose
    services:
      picoquic_server:
        name: picoquic_server
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 300  # 5 minutes timeout
        ports:
          - "4443:4443"
        generate_new_certificates: true

      picoquic_client:
        name: picoquic_client
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: picoquic_server
        timeout: 300  # 5 minutes timeout
        generate_new_certificates: true

    steps:
      wait: 180  # 3 minutes to allow services to fully start and communicate