logging:
  level: DEBUG

docker:
  build_docker_image: True

tests:
  - name: "QUIC IyvClient-Server Test"
    description: "Verify that the Picoquic server can communicate with the Ivy-Tester client over Docker Compose network."
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_server:
        name: "picoquic_server"
        timeout: 100
        implementation:
          name: "picoquic"
          type: "IUT"  # Using uppercase IUT as required by the schema
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "8080:8080"
        generate_new_certificates: True

      ivy_client:
        name: "ivy_client"
        timeout: 100
        implementation:
          name: "panther_ivy"
          type: "TESTERS" # Using uppercase TESTERS as required by the schema
          test: quic_server_test_stream
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"
        ports:
          - "5000:5000"
          - "4987:4987"
          - "8081:8081"
        generate_new_certificates: True
    steps:
      wait: 100
