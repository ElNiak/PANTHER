# Test configuration with log statistics enabled
# This configuration demonstrates the log statistics collection capabilities

# Global configuration
logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true
  
  # Enable log statistics collection
  statistics:
    enabled: true
    collection_interval: 5
    buffer_size: 1000
    real_time_display: false  # Disable for validation script
    generate_reports: true
    export_formats: ["json", "csv", "text"]
    track_performance: true
    handler_type: "standard"
  
  # Feature-specific levels for testing
  feature_levels:
    docker_operations: DEBUG
    service_management: INFO
    network_setup: INFO
    event_system: DEBUG
    plugin_operations: INFO

# Observer configuration
observers:
  logger:
    enabled: true
    log_level: "INFO"
    enable_colors: true
    correlation_tracking: true
  metrics:
    enabled: true
    collect_system_metrics: false
  storage:
    enabled: true
    storage_path: "outputs/storage"
  experiment:
    enabled: true
    track_timing: true
    track_steps: true

# Path configuration
paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  plugin_dir: "panther/plugins"

# Docker configuration
docker:
  build_docker_image: false
  remove_containers_after: true
  remove_images_after: false

# Fast-fail configuration
fast_fail:
  enabled: false  # Disable for validation to see full execution

# Test definitions
tests:
  - name: "Statistics Collection Validation"
    description: "Test basic QUIC connection with log statistics collection"
    network_environment:
      type: docker_compose
    execution_environment: []
    services:
      server:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 60
        ports:
          - "4443:4443"
        generate_new_certificates: true
      
      client:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
        timeout: 50
        generate_new_certificates: true
    
    steps:
      wait: 30