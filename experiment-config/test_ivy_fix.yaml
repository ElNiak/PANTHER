# Test configuration for Ivy service
logging:
  level: DEBUG

docker:
  build_docker_image: false  # Use existing images

tests:
  - name: "Ivy Protocol Test"
    description: "Test Ivy formal verification with proper timing"
    iterations: 1
    network_environment:
      type: docker_compose
    services:
      ivy_panther_ivy:
        name: ivy_panther_ivy
        implementation:
          name: panther_ivy
          type: testers
          test: quic_client_test_max
          parameters:
            log_level: DEBUG
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 300  # 5 minutes for Ivy compilation and testing
        ports:
          - "4443:4443"
          - "4987:4987"
      picoquic_client:
        name: picoquic_client
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: ivy_panther_ivy
        timeout: 300  # 5 minutes timeout
        generate_new_certificates: true
    steps:
      wait: 240  # 4 minutes to allow Ivy to compile and services to run tests