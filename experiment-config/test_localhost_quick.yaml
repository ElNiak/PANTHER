logging:
  level: DEBUG

observers:
  logger:
    enabled: true
    log_level: "DEBUG"

docker:
  build_docker_image: false

tests:
  - name: "Test Localhost Quick"
    description: "Quick test of localhost Dockerfile.jinja fix"
    network_environment:
      type: localhost_single_container
    iterations: 1
    services:
      server:
        name: server
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 20
        ports:
          - "4443:4443"
    steps:
      wait: 5