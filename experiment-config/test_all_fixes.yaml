logging:
  level: DEBUG
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"

observers:
  logger:
    enabled: true
    log_level: "DEBUG"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true

  storage:
    enabled: true
    storage_path: "outputs/storage"

  experiment:
    enabled: true
    track_timing: true
    track_steps: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"

docker:
  build_docker_image: false  # Use existing images for faster testing

tests:
  # Test 1: Localhost environment (tests Dockerfile.jinja fix)
  - name: "Test Localhost Fix"
    description: "Test that localhost environment works after Dockerfile.jinja template fix"
    network_environment:
      type: localhost_single_container
    iterations: 1
    services:
      server:
        name: server
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 30
        ports:
          - "4443:4443"
      client:
        name: client
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
        timeout: 30
    steps:
      wait: 10

  # Test 2: Docker Compose with environment variables (tests environment variable extraction)
  - name: "Test Environment Variables Fix"
    description: "Test that Docker compose environment variables work with dynamic extraction"
    network_environment:
      type: docker_compose
    iterations: 1
    services:
      ivy_server:
        name: ivy_server
        implementation:
          name: panther_ivy
          type: testers
          test: quic_client_test_basic
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 60
        ports:
          - "4443:4443"
      picoquic_client:
        name: picoquic_client
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: ivy_server
        timeout: 45
    steps:
      wait: 20

  # Test 3: Execution environment (tests abstract method fix)
  - name: "Test Execution Environment Fix"
    description: "Test that strace execution environment loads properly with abstract method fix"
    network_environment:
      type: docker_compose
    execution_environment:
      - type: strace
    iterations: 1
    services:
      server:
        name: server
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 30
        ports:
          - "4443:4443"
      client:
        name: client
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
        timeout: 30
    steps:
      wait: 15

  # Test 4: Shadow NS environment (tests plugin_setup flag fix)
  - name: "Test Shadow NS Fix"
    description: "Test that Shadow NS environment sets plugin_setup flag correctly"
    network_environment:
      type: shadow_ns
    iterations: 1
    services:
      server:
        name: server
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 30
        ports:
          - "4443:4443"
      client:
        name: client
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
        timeout: 30
    steps:
      wait: 10