logging:
  level: DEBUG
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  
paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  build_docker_image: True
 
tests:
  - name: "Localhost QUIC Client-Server Communication Test"
    description: "Verify that the Picoquic server can communicate with the Picoquic client over localhost network."
    network_environment: 
      type: "localhost_single_container"  # Environment plugin name
    iterations: 1
    execution_environment: [] 
    debug_environment: [ ]
    services:
      picoquic_server:
        name: "picoquic_server"  # Added 'name' key
        implementation: 
          name: "picoquic" # parameters are presents in folder plugins/services/implementations/quic/picoquic/config.yaml
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "8080:8080"  # Health check endpoint
      picoquic_client:
        timeout: 100
        name: "picoquic_client"  # Added 'name' key
        implementation: 
          name: "picoquic"
          type: "iut"
          # swag: swag # Invalid key
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"  # Docker Compose service name
          # target: "ivy_server"  # Duplicate key
        ports:
          - "5000:5000"  # Example port if needed
          - "8081:8081"  # Changed to avoid port conflict
        generate_new_certificates: True

    steps:
      wait: 100  # seconds to wait during the test

  - name: "Localhost QUIC IyvClient-Server Communication Test"
    description: "Verify that the Picoquic server can communicate with the Ivy-Tester client over Localhost network."
    network_environment: 
      type: "localhost_single_container"  # Environment plugin name
    iterations: 1
    execution_environment: [] 
    debug_environment: [ ]
    services:
      picoquic_server:
        name: "picoquic_server"  # Added 'name' key
        implementation: 
          name: "picoquic" # parameters are presents in folder plugins/services/implementations/quic/picoquic/config.yaml
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "8080:8080"  # Health check endpoint
      ivy_client:
        name: "ivy_client"  # Added 'name' key
        implementation:
          name: "panther_ivy"
          type: "testers"
          test: quic_server_test_stream
        protocol:
          name: "quic"
          version:  "rfc9000"
          role: "client"
          target: "picoquic_server"  # Docker Compose service name
        ports:
          - "5000:5000"  # Example port if needed
          - "8081:8081"  # Changed to avoid port conflict
    steps:
      wait: 100  # seconds to wait during the test
  - name: "Localhost QUIC IyvServer-Client Communication Test"
    description: "Verify that the Picoquic client can communicate with the Ivy-Tester server over Localhost network."
    network_environment: 
      type: "localhost_single_container"  # Environment plugin name
    iterations: 1
    execution_environment: [] 
    debug_environment: [ ]
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client"  # Added 'name' key
        implementation: 
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server"  # Docker Compose service name
        ports:
          - "5000:5000"  # Example port if needed
          - "8081:8081"  # Changed to avoid port conflict
        generate_new_certificates: True
      ivy_server:
        name: "ivy_server"  # Added 'name' key
        timeout: 100
        implementation: 
          type: "testers"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"  #
          - "8080:8080"  # Health check endpoint
        generate_new_certificates: True
    steps:
      wait: 100  # seconds to wait during the test