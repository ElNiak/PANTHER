logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: true
  redirect_logging: true  # Set to false to preserve colored logging

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  force_build_docker_image: false

observers:
  logger:
    enabled: true
    log_level: "INFO"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"  # Log all messages for experiment observer
    track_timing: true
    track_steps: true

tests:
  - name: "QUIC Client-Server Communication Test"
    description: "Verify that the Picoquic server can communicate with the Picoquic client over Shadow network."
    network_environment:
      type: "docker_compose"  # Environment plugin name
    iterations: 1
    execution_environment:
      - type: "strace"
    debug_environment: [ ]
    services:
      picoquic_client:
        timeout: 60
        name: "picoquic_client"  # Added 'name' key
        implementation:
          name: "picoquic"
          type: "IUT"
          # swag: swag # Invalid key
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server"  # Docker Compose service name
          # target: "ivy_server"  # Duplicate key
        ports:
          - "5000:5000"  # Example port if needed
          - "8081:8081"  # Changed to avoid port conflict
        generate_new_certificates: True

      ivy_server:
        name: "ivy_server"  # Added 'name' key
        timeout: 60
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"  #
          - "8080:8080"  # Health check endpoint
        generate_new_certificates: True
    steps:
      wait: 60  # seconds to wait during the test

  - name: "BGP Session Establishment (Accept)"
    network_environment:
      type: docker_compose
    iterations: 1
    steps:
      wait: 120
    services:
      frr_server:
        name: frr_server
        timeout: 180
        implementation:
          name: frr_bgp
          type: iut
        protocol:
          name: bgp
          version: rfc4271
          role: server
        ports:
          - "179:179"
      ivy_tester:
        name: ivy_tester
        timeout: 180
        implementation:
          name: panther_ivy
          type: testers
          test: bgp_speaker_test_accept
          z3_source: pip
          log_level_events: DEBUG
          log_level_binary: DEBUG
          optimization_level: O0
          iterations_per_test: 1
          internal_iterations_per_test: 100
        protocol:
          name: bgp
          version: rfc4271
          role: client
          target: frr_server

  - name: "BGP Session Establishment (Join)"
    network_environment:
      type: docker_compose
    iterations: 1
    steps:
      wait: 120
    services:
      frr_server:
        name: frr_server
        timeout: 180
        implementation:
          name: frr_bgp
          type: iut
        protocol:
          name: bgp
          version: rfc4271
          role: server
        ports:
          - "179:179"
      ivy_tester:
        name: ivy_tester
        timeout: 180
        implementation:
          name: panther_ivy
          type: testers
          test: bgp_speaker_test_join
          z3_source: pip
          log_level_events: DEBUG
          log_level_binary: DEBUG
          optimization_level: O0
          iterations_per_test: 1
          internal_iterations_per_test: 100
        protocol:
          name: bgp
          version: rfc4271
          role: client
          target: frr_server

  - name: "BGP UPDATE Compliance"
    network_environment:
      type: docker_compose
    iterations: 1
    steps:
      wait: 120
    services:
      frr_server:
        name: frr_server
        timeout: 180
        implementation:
          name: frr_bgp
          type: iut
        protocol:
          name: bgp
          version: rfc4271
          role: server
        ports:
          - "179:179"
      ivy_tester:
        name: ivy_tester
        timeout: 180
        implementation:
          name: panther_ivy
          type: testers
          test: bgp_speaker_test_update
          z3_source: pip
          log_level_events: DEBUG
