          internal_iterations_per_test: 100
        protocol:
          name: bgp
          version: rfc4271
          role: client
          target: frr_server


  - name: "CoAP Client-Server Communication Test"
    description: "Verify that the ping_pong client can communicate with the Ivy server over docker-compose network."
    network_environment:
      type: "docker_compose"  # Environment plugin name
    iterations: 1
    debug_environment: [ ]
    services:
      coap_client:
        timeout: 100
        name: "coap_client"  # Added 'name' key
        implementation:
          name: "libcoap"
          type: "IUT"
          # swag: swag # Invalid key
        protocol:
          name: "coap"
          version: "rfc7252"
          role: "client"
          target: "ivy_server"  # Docker Compose service name
          # target: "ivy_server"  # Duplicate key
        ports:
          - "5001:5000"  # Client external:internal port
          - "8082:8081"  # Client health check port
        generate_new_certificates: True

      ivy_server:
        name: "ivy_server"  # Added 'name' key
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: coap_client_test
        protocol:
          name: "coap"
          version: "rfc7252"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"  #
          - "8080:8080"  # Health check endpoint
        generate_new_certificates: True
    steps:
      wait: 100  # seconds to wait during the test

  - name: "QUIC IyvClient-Server Communication Test"
    description: "Verify that the Picoquic server can communicate with the Ivy-Tester client over Docker Compose network."
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_server:
        name: "picoquic_server"
        timeout: 60
        implementation:
          name: "picoquic" # parameters are presents in folder plugins/services/implementations/quic/picoquic/config.yaml
          type: "IUT"      # plugin is present plugins/services/iut/quic/picoquic
        protocol:          # plugin is present plugins/services/iut/quic
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "8080:8080"  # Health check endpoint
        generate_new_certificates: True

      ivy_client:
        name: "ivy_client"  # Added 'name' key
        timeout: 60
        implementation:
          name: "panther_ivy"
          type: "TESTERS"
          test: quic_server_test_stream
        protocol:  # plugin is present plugins/services/iut/quic
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "picoquic_server"  # Docker Compose service name
        ports:
          - "5000:5000"
          - "4987:4987"
          - "8081:8081"
        generate_new_certificates: True
    steps:
      wait: 60  # seconds to wait during the test
