  - name: "BGP Error Handling (Cease)"
    network_environment:
      type: docker_compose
    iterations: 1
    steps:
      wait: 120
    services:
      frr_server:
        name: frr_server
        timeout: 180
        implementation:
          name: frr_bgp
          type: iut
        protocol:
          name: bgp
          version: rfc4271
          role: server
        ports:
          - "179:179"
      ivy_tester:
        name: ivy_tester
        timeout: 180
        implementation:
          name: panther_ivy
          type: testers
          test: bgp_speaker_test_error
          z3_source: pip
          log_level_events: DEBUG
          log_level_binary: DEBUG
