logging:
  level: DEBUG
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true
  debug_file_logging: true

  feature_levels:
    command_generation: DEBUG
    template_rendering: DEBUG
    docker_builder: DEBUG
    docker_operations: DEBUG
    config_processing: DEBUG
    event_system: ERROR
    file_operations: ERROR
    service_managers: DEBUG
    ivy_operations: ERROR
    quic_services: ERROR
    plugin_loading: DEBUG
    service_coordination: ERROR
    network_environments: DEBUG
    execution_environment: DEBUG
    docker_compose: DEBUG
    shadow_ns: DEBUG
    localhost_container: DEBUG
    event_emission: ERROR
    event_processing: ERROR
    state_management: ERROR
    observer_operations: ERROR
    event_manager: ERROR
    certificate_management: ERROR
    network_setup: ERROR
    port_management: ERROR
    protocol_communication: ERROR
    metrics_collection: ERROR
    data_storage: ERROR
    result_processing: ERROR
    output_aggregation: ERROR
    test_execution: ERROR
    experiment_workflow: ERROR
    validation_checks: ERROR
    error_handling: ERROR

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: true
  redirect_logging: true

observers:
  logger:
    enabled: true
    log_level: "DEBUG"
    enable_colors: true
    correlation_tracking: true
  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30
  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30
  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"
    track_timing: true
    track_steps: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  force_build_docker_image: false
  log_docker_image_build: true
  use_buildx: false

tests:
  - name: "QUIC Client-Server Test (No BuildX)"
    description: "Test picoquic client with Ivy server using regular Docker build."
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_client:
        timeout: 200
        name: "picoquic_client"
        implementation:
          name: "picoquic"
          type: "iut"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server"
        ports:
          - "5001:5001"
          - "8082:8082"
        generate_new_certificates: True

      ivy_server:
        name: "ivy_server"
        timeout: 200
        implementation:
          build_mode: "rel-lto"
          type: "testers"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "8080:8080"
        generate_new_certificates: True
    steps:
      wait: 200
