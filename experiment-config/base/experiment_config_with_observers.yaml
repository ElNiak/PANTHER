# Example Observer Configuration in experiment-config YAML file
# This example shows how to configure observers using OmegaConf and dataclasses
# Include this section in your experiment-config file to customize observer behavior

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

# Observer configuration section - Configure log levels per observer type
observers:
  logger:
    enabled: true
    auto_register: true
    priority: 0
    log_level: "INFO"  # Standard log level for logger observer
    include_data: true
    include_event_id: true
    include_timestamp: true
    enable_colors: true
    output_file: "outputs/event_log.log"
    correlation_tracking: true
    structured_output: false
    max_data_length: 500

  metrics:
    enabled: true
    auto_register: true
    priority: 10
    log_level: "DEBUG"  # More detailed logging for metrics observer
    publish_metrics: true
    collect_system_metrics: true
    publish_interval: 30
    enable_real_time_monitoring: false

  storage:
    enabled: true
    auto_register: true
    priority: 20
    log_level: "WARNING"  # Less verbose logging for storage observer
    storage_path: "outputs/storage"
    enable_compression: true
    max_storage_size: 0  # 0 means unlimited
    auto_backup: true
    backup_interval: 3600  # 1 hour
    retention_days: 30
    batch_size: 100
    async_storage: false

  experiment:
    enabled: true
    auto_register: true
    priority: 5
    log_level: "ERROR"  # Only log errors for experiment observer
    track_timing: true
    track_steps: true

  resource:
    enabled: true
    auto_register: true
    priority: 15
    log_level: "INFO"  # Standard logging for resource observer
    monitor_interval: 5.0  # Seconds between resource measurements
    detailed_monitoring: true
    auto_start: true

# Rest of your experiment config follows...
tests:
  - name: "Example Test"
    # Test configuration details...
