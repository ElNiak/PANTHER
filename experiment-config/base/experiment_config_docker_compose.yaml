logging:
  level: DEBUG
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: true
  redirect_logging: true  # Set to false to preserve colored logging

observers:
  logger:
    enabled: true
    log_level: "DEBUG"
    enable_colors: true
    correlation_tracking: true

docker:
  force_build_docker_image: True

tests:
  - name: "QUIC IvyServer-Client Communication Test "
    description: "Verify that the Picoquic server can communicate with the Ivy-Tester client over Docker Compose network."
    network_environment:
      type: "docker_compose"
      # should_no_be_ignore : "should_no_be_ignore"
    execution_environment:
      - type: "helgrind"
    iterations: 1
    services:
      # should_no_be_ignore : "should_no_be_ignore"
      picoquic_client:
        name: "picoquic_client"
        timeout: 150
        implementation:
          name: "picoquic" # parameters are presents in folder plugins/services/implementations/quic/picoquic/config.yaml
          type: "IUT" # plugin is present plugins/services/iut/quic/picoquic
          # should_no_be_ignore : "should_no_be_ignore"
        protocol:
          # plugin is present plugins/services/iut/quic
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server" # Docker Compose service name
        ports:
          - "4443:4443"
          - "8080:8080" # Health check endpoint
        generate_new_certificates: True

      ivy_server:
        name: "ivy_server" # Added 'name' key
        timeout: 150
        implementation:
          name: "panther_ivy"
          type: "TESTERS" # plugin is present plugins/services/testers/panther_ivy
          test: quic_client_test_max
        # TODO: we should be able to validate that quic_server_test_stream is available for the selected protocol and role
        protocol:
          # plugin is present plugins/services/iut/quic
          name: "quic"
          version: "rfc9000"
          role: "server"
          target: "picoquic_client" # Docker Compose service name
        ports:
          - "5000:5000"
          - "4987:4987"
          - "8081:8081"
        generate_new_certificates: True
    steps:
      wait: 150 # seconds to wait during the test

