# Quick Fast-Fail Validation Configuration
# Optimized for rapid validation of fast-fail behavior without Docker builds

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: true
  redirect_logging: true

observers:
  logger:
    enabled: true
    log_level: "INFO"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: false  # Disable for faster validation

  storage:
    enabled: false  # Disable for faster validation

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"
    track_timing: true
    track_steps: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

# Docker Configuration: Disable building for quick validation
docker:
  build_docker_image: false  # Skip Docker builds for quick validation

# Fast-Fail Configuration: Global Enabled for Testing
fast_fail:
  enabled: true                      # Global fast-fail enabled
  test_level: true                   # Enable per-test control for testing
  docker_build_failures: true       # Should fail if Docker issues occur
  docker_runtime_failures: true     # Should fail on Docker runtime errors
  plugin_load_failures: true        # Should fail on plugin issues
  service_start_failures: true      # Should fail on service startup errors
  network_setup_failures: true      # Should fail on network setup errors
  port_conflict_failures: true      # Should fail on port conflicts
  ivy_compilation_failures: false   # Allow Ivy compilation to continue
  resource_exhaustion: true         # Should fail on resource exhaustion
  certificate_failures: true        # Should fail on certificate errors
  configuration_failures: true      # Should fail on configuration errors
  timeout_cascades: true           # Should detect timeout cascades
  critical_only: false              # Don't limit to critical only
  max_errors_before_fail: 3         # Low threshold for testing
  timeout_cascade_threshold: 2      # Quick cascade detection
  disk_space_threshold_gb: 0.5      # Low disk space threshold

tests:
  - name: "Quick Fast-Fail Test - Global Default"
    description: "Test inherits global fast-fail enabled setting"
    # fast_fail_enabled not specified - should inherit global enabled=true
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      simple_service:
        timeout: 30  # Short timeout for quick validation
        name: "simple_service"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
        generate_new_certificates: true
    steps:
      wait: 5  # Very short wait for quick validation

  - name: "Quick Fast-Fail Test - Override Disabled"
    description: "Test explicitly overrides to disable fast-fail"
    fast_fail_enabled: false          # Override global enabled=true to disabled
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      simple_service_2:
        timeout: 30
        name: "simple_service_2"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4444:4443"
        generate_new_certificates: true
    steps:
      wait: 5

  - name: "Quick Fast-Fail Test - Override Enabled"
    description: "Test explicitly overrides to enable fast-fail"
    fast_fail_enabled: true           # Explicit override to enabled
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      simple_service_3:
        timeout: 30
        name: "simple_service_3"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4445:4443"
        generate_new_certificates: true
    steps:
      wait: 5