# Test Configuration: Global Fast-Fail Disabled
# Validates fast-fail behavior when globally disabled

logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"
  enable_colors: true

progress:
  enable_progress_bar: true
  show_test_status: true
  show_docker_events: true
  use_emojis: true
  redirect_logging: true

observers:
  logger:
    enabled: true
    log_level: "INFO"
    enable_colors: true
    correlation_tracking: true

  metrics:
    enabled: true
    collect_system_metrics: true
    log_level: "INFO"
    publish_interval: 30

  storage:
    enabled: true
    storage_path: "outputs/storage"
    enable_compression: true
    log_level: "INFO"
    retention_days: 30

  experiment:
    enabled: true
    auto_register: true
    priority: 115
    log_level: "DEBUG"
    track_timing: true
    track_steps: true

paths:
  output_dir: "outputs"
  log_dir: "outputs/logs"
  config_dir: "panther/configs"
  plugin_dir: "panther/plugins"

docker:
  build_docker_image: true

# Fast-Fail Configuration: Global Disabled, No Test-Level Control
fast_fail:
  enabled: false                     # Global fast-fail disabled
  test_level: false                  # No per-test control
  docker_build_failures: true       # These settings are ignored when enabled=false
  docker_runtime_failures: true     # But included for completeness
  plugin_load_failures: true
  service_start_failures: true
  network_setup_failures: true
  port_conflict_failures: true
  ivy_compilation_failures: true
  resource_exhaustion: true
  certificate_failures: true
  configuration_failures: true
  timeout_cascades: true
  critical_only: false
  max_errors_before_fail: 10
  timeout_cascade_threshold: 3
  disk_space_threshold_gb: 2.0

tests:
  - name: "Fast-Fail Global Disabled Test 1"
    description: "Test should inherit global fast-fail disabled setting - errors should not stop experiment"
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server"
        ports:
          - "5000:5000"
          - "8081:8081"
        generate_new_certificates: true

      ivy_server:
        name: "ivy_server"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"
          - "8080:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Fast-Fail Global Disabled Test 2"
    description: "Second test should also inherit global fast-fail disabled setting"
    # Note: Even if we specify fast_fail_enabled here, it should be ignored
    # because test_level=false
    fast_fail_enabled: true  # This should be IGNORED
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_2"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_2"
        ports:
          - "5001:5000"
          - "8082:8081"
        generate_new_certificates: true

      ivy_server_2:
        name: "ivy_server_2"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4444:4443"
          - "4988:4987"
          - "8083:8080"
        generate_new_certificates: true
    steps:
      wait: 60

  - name: "Fast-Fail Global Disabled Test 3"
    description: "Third test to validate consistent disabled behavior across multiple tests"
    network_environment:
      type: "docker_compose"
    iterations: 1
    execution_environment: []
    debug_environment: []
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client_3"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server_3"
        ports:
          - "5002:5000"
          - "8084:8081"
        generate_new_certificates: true

      ivy_server_3:
        name: "ivy_server_3"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4445:4443"
          - "4989:4987"
          - "8085:8080"
        generate_new_certificates: true
    steps:
      wait: 60