logging:
  level: DEBUG

observers:
  logger:
    enabled: true
    log_level: "DEBUG"

docker:
  build_docker_image: false  # Use existing images

tests:
  - name: "Test PicoQUIC Fix"
    description: "Test that picoquic commands are generated correctly"
    network_environment:
      type: docker_compose
    services:
      server:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 30
        ports:
          - "4443:4443"
        generate_new_certificates: true
      
      client:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
        timeout: 30
        generate_new_certificates: true
    steps:
      wait: 10