logging:
  level: DEBUG

observers:
  logger:
    enabled: true
    log_level: "DEBUG"

docker:
  build_docker_image: false  # Use existing images

tests:
  - name: "Test Localhost Fix"
    description: "Test that localhost environment works after template fix"
    network_environment:
      type: localhost_single_container
    services:
      server:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 30
        ports:
          - "4443:4443"
      client:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
        timeout: 30
    steps:
      wait: 15

  - name: "Test Environment Variables Fix"
    description: "Test that Docker compose environment variables work"
    network_environment:
      type: docker_compose
    services:
      ivy_server:
        implementation:
          name: panther_ivy
          type: testers
          test: quic_client_test_basic
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 60
        ports:
          - "4443:4443"
      picoquic_client:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: ivy_server
        timeout: 45
    steps:
      wait: 30

  - name: "Test Execution Environment Fix"
    description: "Test that strace execution environment loads properly"
    network_environment:
      type: docker_compose
    execution_environment:
      - type: strace
    services:
      server:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 30
        ports:
          - "4443:4443"
      client:
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
        timeout: 30
    steps:
      wait: 20