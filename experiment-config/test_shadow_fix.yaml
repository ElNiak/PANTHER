logging:
  level: DEBUG

observers:
  logger:
    enabled: true
    log_level: "DEBUG"

docker:
  build_docker_image: false  # Use existing images

tests:
  - name: "Test Shadow NS Fix"
    description: "Test that Shadow NS environment sets plugin_setup flag correctly"
    network_environment:
      type: shadow_ns
    iterations: 1
    services:
      server:
        name: server
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: server
        timeout: 30
        ports:
          - "4443:4443"
      client:
        name: client
        implementation:
          name: picoquic
          type: iut
        protocol:
          name: quic
          version: rfc9000
          role: client
          target: server
        timeout: 30
    steps:
      wait: 15