logging:
  level: DEBUG
  format: "%(asctime)s [%(levelname)s] - %(module)s - %(message)s"

observers:
  logger:
    enabled: true
    log_level: "DEBUG"

docker:
  build_docker_image: true

tests:
  - name: "QUIC Client-Server Communication Test"
    description: "Verify that the Picoquic server can communicate with the Picoquic client over Docker Compose network."
    network_environment:
      type: "docker_compose"
    iterations: 1
    services:
      picoquic_client:
        timeout: 100
        name: "picoquic_client"
        implementation:
          name: "picoquic"
          type: "IUT"
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "client"
          target: "ivy_server"
        ports:
          - "5000:5000"
          - "8081:8081"
        generate_new_certificates: True

      ivy_server:
        name: "ivy_server"
        timeout: 100
        implementation:
          type: "TESTERS"
          name: "panther_ivy"
          test: quic_client_test_max
        protocol:
          name: "quic"
          version: "rfc9000"
          role: "server"
        ports:
          - "4443:4443"
          - "4987:4987"
          - "8080:8080"
        generate_new_certificates: True
    steps:
      wait: 100