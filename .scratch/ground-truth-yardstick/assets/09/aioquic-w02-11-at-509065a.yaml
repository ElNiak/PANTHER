- id: h3-22-frame-settings
  statement: The SETTINGS frame (type=0x4) conveys configuration parameters that affect how endpoints
    communicate, such as preferences and constraints on peer behavior. Individually, a SETTINGS parameter
    can also be referred to as a "setting"; the identifier and value of each setting parameter can be
    referred to as a "setting identifier" and a "setting value".
