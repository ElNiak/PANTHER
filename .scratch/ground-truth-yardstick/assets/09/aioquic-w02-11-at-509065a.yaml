- id: h3-22-frame-cancel-push
  statement: The CANCEL_PUSH frame (type=0x3) is used to request cancellation of a server push prior to
    the push stream being received. The CANCEL_PUSH frame identifies a server push by Push ID (see Section
    7.2.6), encoded as a variable-length integer.
