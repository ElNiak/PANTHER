- id: h3-22-frame-max-push-id
  statement: The MAX_PUSH_ID frame (type=0xD) is used by clients to control the number of server pushes
    that the server can initiate. This sets the maximum value for a Push ID that the server can use in
    a PUSH_PROMISE frame. Consequently, this also limits the number of push streams that the server can
    initiate in addition to the limit set by the QUIC MAX_STREAMS frame.
  symbol: MAX_PUSH_ID
  value: '0xD'
  kind: frame_type
  source:
