- id: h3-22-frame-goaway
  statement: The GOAWAY frame (type=0x7) is used to initiate graceful shutdown of a connection by a server.
    GOAWAY allows a server to stop accepting new requests while still finishing processing of previously
    received requests. This enables administrative actions, like server maintenance. GOAWAY by itself
    does not close a connection.
  symbol: GOAWAY
  value: '0x7'
  kind: frame_type
  source:
