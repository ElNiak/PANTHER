# pyproject.toml - Enhanced version with conservative dependency constraints
[build-system]
requires = ["setuptools>=68.0", "wheel>=0.41.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
zip-safe = false
include-package-data = true
packages = { find = { exclude = ["docs*", "docs_src*", "tests*", "scripts*", "outputs*", "custom_output*", "__pycache__*", "site*", "*.egg-info", "*.dist-info", ".venv*", "venv*", "build*", "htmlcov*", "container-tar*", "experiment-config*", "plans*", "todos*", ".claude*", "pytest-of-*"] } }

#  package-data definition with explicit patterns
package-data = { panther = [
    "*.yml",
    "*.yaml",
    "*.jinja",
    "*.sh",
    "py.typed",
    "**/Dockerfile",
    "**/Dockerfile.*",
    "webapp/**",
    "plugins/**/*.yaml",
    "**/*.jinja",
    "**/*.j2",
    "plugins/services/tutorials/**/template/**",
    "plugins/environments/tutorials/**/template/**",
    "plugins/protocols/tutorials/**/template/**",
    "plugins/services/tutorials/**/template/**/*.j2",
    "plugins/environments/tutorials/**/template/**/*.j2",
    "plugins/protocols/tutorials/**/template/**/*.j2",
    "plugins/services/iut/**",
    "plugins/services/testers/panther_ivy/ivy/**",
    "plugins/services/testers/panther_ivy/scripts/**",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.ivy",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.h",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.c",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.txt",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.key",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.pem",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.cert",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.html",
    "plugins/services/testers/panther_ivy/lib/**",
    "plugins/services/testers/panther_ivy/version_configs/**",
    "plugins/services/testers/panther_ivy/templates/**",
] }

[tool.setuptools.exclude-package-data]
panther = [
    "plugins/services/testers/panther_ivy/protocol-testing/apt/test/nordsec/**",
    "plugins/services/testers/panther_ivy/submodules/**",
    "plugins/services/testers/ai_rfc/harness/**",
]

[project]
name = "panther-net"
version = "1.2.1"
description = "Panther: Protocol formal Analysis and formal Network Threat Evaluation Resources"
readme = "README.md"
authors = [
    { name = "ElNiak", email = "christophe.crochet.researcher@gmail.com" },
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Framework :: FastAPI",                     # NiceGUI is built on FastAPI
    "Environment :: Console",
    "Environment :: Web Environment",
]
requires-python = ">=3.10"
keywords = [
    "testing",
    "networking",
    "protocols",
    "formal-verification",
    "docker",
    "security",
]

# Conservative dependency version constraints
dependencies = [
    # Core dependencies with version constraints
    "omegaconf>=2.3.0,<3.0",
    "cerberus>=1.3.4,<2.0",
    "jinja2>=3.1.0,<4.0",
    "requests>=2.28.0,<3.0",
    "importlib_resources>=5.12.0,<7.0",
    "PyYAML>=6.0,<7.0",
    "importlib_metadata>=6.0.0,<8.0",
    "packaging",
    "pydantic>=2.0.0,<3.0",

    # Command line interface
    "termcolor>=2.3.0,<3.0",
    "terminal_banner>=0.2.0,<1.0",
    "tqdm>=4.65.0,<5.0",
    "colorlog>=6.7.0,<7.0",

    # Docker support
    "docker>=6.0.0,<8.0",

    # Network and system utilities
    "execnet>=1.9.0,<3.0",
    "pexpect>=4.8.0,<5.0",
    "chardet>=5.0.0,<8.0",
    "gperf",                # Limited versions available
    "pandas>=2.0.0,<3.0",
    "ply>=3.11,<4.0",
    "plantuml>=0.3.0,<1.0",
    "scapy>=2.5.0,<3.0",
    "click>=8.0.0,<9.0",

    # Metrics and monitoring
    "psutil>=5.9.0,<6.0",
]

[project.optional-dependencies]
# Testing dependencies with version constraints
tests = [
    "pytest>=7.3.0,<9.0",
    "pytest-cov>=4.1.0,<6.0",
    "hypothesis>=6.80.0,<7.0",
    "pytest-mock>=3.11.0,<4.0",
    "pytest-timeout>=2.1.0,<3.0",
    "pytest-xdist>=3.3.0,<4.0",
    "pytest-docker>=3.1.0,<4.0",
    "hypothesis",
    "selenium>=4.10.0,<5.0",
    "webdriver-manager>=4.0.0,<5.0",
]

# Linting and code quality
lint = [
    "black>=23.7.0,<25.0",
    "flake8>=6.0.0,<8.0",
    "pylint>=2.17.0,<5.0",
    "pre-commit>=3.3.0,<4.0",
    "isort>=5.12.0,<6.0",
    "mypy>=1.4.0,<2.0",
]

# Documentation dependencies
doc = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-git-revision-date-localized-plugin",
    "markdown-callouts",
    "mkdocs-coverage",
    "pymdown-extensions",
    "mkdocs-material-extensions",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocstrings[python]",
    "mkdocstrings-python",
    "mkdocs-same-dir",
    "mkdocs-mermaid2-plugin",
    "griffe-pydantic",
    "mkdocs-click",
    "mkdocs-material[imaging]",
]

# Development dependencies (combines all optional deps)
dev = [
    "panther-net[tests,lint,doc]",
    "twine>=4.0.0,<7.0",
    "build>=0.10.0,<2.0",
    "wheel>=0.41.0,<1.0",
]

# Security scanning tools
security = [
    "safety>=2.3.0,<4.0",
    "bandit[toml]>=1.7.5,<2.0",
    "semgrep>=1.45.0,<2.0",
    "pip-audit>=2.6.0,<3.0",
]

# Web interface (NiceGUI + PydanticForm)
web = [
    "nicegui>=3.0.0,<4.0",
    "uvicorn[standard]>=0.20.0,<1.0",
    "websockets>=12.0,<14.0",
]

# Performance profiling
profiling = [
    "py-spy>=0.3.14,<1.0",
    "memory-profiler>=0.61.0,<1.0",
    "line-profiler>=4.1.0,<5.0",
]

[project.urls]
repository = "https://github.com/ElNiak/PANTHER"
documentation = "https://elniak.github.io/PANTHER/"
ivy = "https://github.com/ElNiak/PANTHER-Ivy"
issues = "https://github.com/ElNiak/PANTHER/issues"
changelog = "https://github.com/ElNiak/PANTHER/blob/main/CHANGELOG.md"

[project.scripts]
panther = "panther.cli.core.main:main"
panther-plugin-tool = "panther.tools.plugins.plugin_migration_tool:create_cli"

# Tool configurations

[tool.black]
line-length = 88
target-version = ['py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # Directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | outputs*
  | panther/plugins/services/testers/panther_ivy
  | panther/plugins/services/testers/ai_rfc
)/
'''

[tool.ruff.lint]
select = ["D"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D101", "D102", "D103", "D104", "D107"]
"panther/core/events/**" = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88
skip_gitignore = true
skip_glob = ["panther/plugins/services/testers/panther_ivy/**/*", "panther/plugins/services/testers/ai_rfc/**/*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=panther",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=70",
]
testpaths = ["tests"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require Docker)",
    "e2e: End-to-end tests (full workflow tests)",
    "property: Property-based tests using Hypothesis",
    "requires_docker: Tests that require Docker to be running",
    "requires_network: Tests that require network access",
    "requires_ivy: Tests that require Ivy tester",
    "slow: Tests that take more than 10 seconds",
    "critical: Critical functionality tests that must pass",
]
filterwarnings = ["error", "ignore::UserWarning", "ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["panther"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/conftest.py",
    "*/__main__.py",
    "*/migrations/*",
    "*/webapp/static/*",
    "*/metrics/*",
    "*/panther_ivy/*",
    "*/ai_rfc/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
precision = 2
show_missing = true

[tool.bandit]
exclude_dirs = [
    "tests",
    "docs",
    "scripts",
    "panther/plugins/services/testers/panther_ivy",
    "panther/plugins/services/testers/ai_rfc",
]
skips = ["B101", "B601", "B602"] # Skip specific tests
severity = "medium" # Report medium and higher severity issues

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
ignore_missing_imports = true
pretty = true
show_error_codes = true
show_error_context = true
show_column_numbers = true

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "panther.webapp.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "panther.plugins.services.testers.panther_ivy.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "panther.plugins.services.testers.ai_rfc.*"
ignore_errors = true

[tool.pylint.main]
py-version = "3.10"
jobs = 0                                                                     # Use all available processors
load-plugins = ["pylint.extensions.docparams", "pylint.extensions.docstyle"]

[tool.pylint."MASTER"]
ignore-paths = "panther/plugins/services/testers/panther_ivy,panther/plugins/services/testers/ai_rfc"

[tool.pylint.messages-control]
max-line-length = 88
disable = [
    "C0111", # missing-docstring
    "C0103", # invalid-name
    "R0903", # too-few-public-methods
    "R0913", # too-many-arguments
    "W0212", # protected-access
    "W0621", # redefined-outer-name
]

[tool.pylint.reports]
output-format = "colorized"
reports = "no"
score = "yes"

[tool.pylint.design]
max-args = 10
max-locals = 25
max-returns = 10
max-branches = 20
max-statements = 100
max-parents = 10
max-attributes = 20
min-public-methods = 1
max-public-methods = 30

[tool.pyright]
include = ["panther"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/outputs*",
    "panther/plugins/services/testers/panther_ivy",
    "panther/plugins/services/testers/ai_rfc",
    "tests",
    "docs",
    "scripts",
    "build",
    "dist",
]
defineConstant = { DEBUG = true }
stubPath = "typings"
reportMissingImports = true
reportMissingTypeStubs = false
reportOptionalSubscript = "warning"
reportOptionalMemberAccess = "warning"
reportOptionalCall = "warning"
reportOptionalIterable = "warning"
reportOptionalContextManager = "warning"
reportOptionalOperand = "warning"
reportDuplicateImport = "warning"
reportUnusedImport = "warning"
reportUnusedClass = "information"
reportUnusedFunction = "information"
reportUnusedVariable = "warning"
reportUntypedFunctionDecorator = "information"
reportUntypedClassDecorator = "information"
reportUntypedBaseClass = "information"
reportUntypedNamedTuple = "information"
reportPrivateUsage = "information"
reportConstantRedefinition = "warning"
reportIncompatibleMethodOverride = "warning"
reportIncompatibleVariableOverride = "warning"
reportMissingParameterType = "information"
reportMissingTypeArgument = "information"
reportInvalidTypeVarUse = "warning"
reportCallInDefaultInitializer = "information"
reportUnnecessaryIsInstance = "information"
reportUnnecessaryCast = "information"
reportUnnecessaryComparison = "information"
reportAssertAlwaysTrue = "warning"
reportSelfClsParameterName = "warning"
reportImplicitStringConcatenation = "information"
pythonVersion = "3.10"
pythonPlatform = "All"
executionEnvironments = [
    { root = "panther", pythonVersion = "3.10", pythonPlatform = "All" },
    { root = "tests", pythonVersion = "3.10", pythonPlatform = "All", extraPaths = [
        "panther",
    ] },
]
