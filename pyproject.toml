# pyproject.toml
[build-system]
requires = ["setuptools>=69.0.0", "wheel>=0.41.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
packages = { find = { exclude = ["docs*", "tests*"] } }

# Keep the package-data definition for backward compatibility
package-data = { panther = [
    "*.yml", "*.yaml", "*.jinja", "*.sh", "py.typed",
    "**/Dockerfile", "**/Dockerfile.*", "webapp/**",
    "plugins/**/*.yaml", "**/*.jinja", "**/*.j2",
    "plugins/services/tutorials/**/template/**",
    "plugins/environments/tutorials/**/template/**",
    "plugins/protocols/tutorials/**/template/**",
    "plugins/services/tutorials/**/template/**/*.j2",
    "plugins/environments/tutorials/**/template/**/*.j2",
    "plugins/protocols/tutorials/**/template/**/*.j2",
    "plugins/services/iut/**",
    "plugins/services/testers/panther_ivy/ivy/**",
    "plugins/services/testers/panther_ivy/submodules/**",
    "plugins/services/testers/panther_ivy/scripts/**",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.ivy",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.h",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.c",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.txt",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.key",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.pem",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.cert",
    "plugins/services/testers/panther_ivy/protocol-testing/**/*.html",
    "plugins/services/testers/panther_ivy/lib/**",
    "plugins/services/testers/panther_ivy/version_configs/**",
    "plugins/services/testers/panther_ivy/templates/**"
] }

# include = ["*.yaml", "*.yml", "panther"]
[project]
name = "panther-net"
version = "1.1.3"
description = "Panther: Protocol formal Analysis and formal Network Threat Evaluation Resources"
readme = "README.md"
authors = [
    { name = "ElNiak", email = "christophe.crochet.researcher@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
requires-python = ">=3.10"

dependencies = [
    # Core dependencies
    "omegaconf",
    "cerberus",
    "jinja2",
    "requests",
    "importlib_resources",
    "PyYAML",
    "importlib_metadata",

    # Command line interface
    "termcolor",
    "terminal_banner",
    "tqdm",
    "colorlog",

    # Docker support
    "docker",

    # Web interface dependencies
    "flask",
    "flask_session",
    "flask_wtf",
    "django",
    "flask-socketio",
    "Flask-Cors",
    "npf-web-extension",

    # Network and system utilities
    "execnet",
    "pexpect",
    "chardet",
    "gperf",
    "pandas",
    "ply",
    "plantuml",
    "scapy",
    "argcomplete",

    # Metrics and monitoring
    "psutil"
]

[project.optional-dependencies]
tests = [
  "pytest",
  "pytest-cov",
  "hypothesis",
  "pytest-mock",
  "unitest",
]
lint = [
  "black",
  "flake8",
  "pylint",
  "pre_commit",
]
doc = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-minify-plugin",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-git-authors-plugin",
    "mkdocs-table-reader-plugin",
    "mkdocs-img2fig-plugin",
    "mknotebooks",
    "mkdocs-awesome-pages-plugin",
    "mkdocs-enumerate-headings-plugin",
    "mkdocs-print-site-plugin",
    "mkgendocs",
    "markdown-callouts",
    "mkdocs-coverage",
    "PyYAML",
    "pymdown-extensions",
    "mkdocs-material-extensions",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
    "mkdocs-section-index",
    "mkdocstrings[python]",
    "mkdocs-exclude",
    "mkdocs-same-dir",
    "mkdocs-mermaid2-plugin"
]

[project.urls]
repository = "https://github.com/ElNiak/PANTHER"
documentation = "https://elniak.github.io/PANTHER/"
ivy = "https://github.com/ElNiak/PANTHER-Ivy"


[project.scripts]
panther = "panther.__main__:main"
panther-metrics = "panther.metrics.cli:main"
