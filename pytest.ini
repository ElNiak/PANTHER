[pytest]
# Pytest configuration for PANTHER test suite
testpaths = tests
pythonpath = . panther/plugins/services/testers
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Custom markers for test organization
markers =
    unit: Fast unit tests that don't require external dependencies
    integration: Integration tests that test component interactions
    e2e: End-to-end tests that test complete workflows
    property_based: Property-based tests using hypothesis
    slow: Tests that take a long time to run
    requires_docker: Tests that require Docker daemon to be running
    requires_network: Tests that require network connectivity
    requires_ivy: Tests that require Ivy formal verification tools
    requires_root: Tests that require root privileges
    plugin_test: Tests for plugin functionality
    plugin_manager: Tests for the PluginManager core component
    experiment_manager: Tests for the ExperimentManager core component
    event_system: Tests for the event-driven architecture
    command_generation: Tests for command generation pipeline
    template_rendering: Tests for template rendering system
    config_validation: Tests for configuration validation
    docker_compose: Tests specific to Docker Compose environment
    docker_system: Tests for Docker builder and operations
    observer_system: Tests for observer pattern implementation
    plugin_system: Tests for plugin discovery and management
    shadow_ns: Tests specific to Shadow NS environment
    localhost: Tests specific to localhost environment
    performance: Performance and benchmark tests
    security: Security-related tests
    compliance: Compliance and formal verification tests
    docker_lifecycle: Tests for Docker image lifecycle management
    service_config: Property-based tests for service configuration
    docker_validation: Tests for Docker image validation
    output_collection: Tests for output collection edge cases
    functional: Functional tests for end-to-end scenarios
    docker_failures: Tests for Docker image failure scenarios
    benchmark: Performance benchmark tests
    docker_integration: Integration tests for Docker examples
    stress: Stress and load tests

# Test discovery patterns
addopts =
    --strict-markers
    --strict-config
    --tb=short
    --durations=10
    -v

# Minimum version
minversion = 6.0

# Note: timeout and workers are handled by pytest-timeout and pytest-xdist plugins
# timeout = 300
# workers = auto
