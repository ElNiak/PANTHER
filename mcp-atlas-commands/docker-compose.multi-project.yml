# Multi-Project Docker Compose for ATLAS Hierarchical Cache
# This demonstrates how multiple projects share ML models while maintaining isolation

services:
  # Project A: Software-Engineer-AI-Agent-Atlas
  atlas-project-a:
    build:
      context: .
      dockerfile: Dockerfile
    image: atlas-commands-mcp:latest
    container_name: atlas-project-a
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PROJECT_NAME=Software-Engineer-AI-Agent-Atlas
      - ATLAS_STORAGE_PATH=/app/REPOS
      - ATLAS_STARTUP_MODE=fast
      - ATLAS_LAZY_LOADING=true
      - ATLAS_TOKEN_MODE=auto
      # Hierarchical cache configuration
      - ATLAS_PROJECT_ID=Software-Engineer-AI-Agent-Atlas
      - ATLAS_CACHE_MODE=hierarchical
      - ATLAS_WORKSPACE_ISOLATION=true
    volumes:
      - ${PWD}/REPOS:/app/REPOS
      - ./config:/app/config:ro
      # Shared global cache (178MB ML models shared)
      - ~/.atlas/global:/app/.atlas/global:ro
      # Project-specific cache (isolated)
      - ~/.atlas/projects/$(echo "Software-Engineer-AI-Agent-Atlas" | sha256sum | cut -c1-16):/app/.atlas/project:rw
      # Shared HuggingFace models
      - ~/.atlas/global/models:/root/.cache/huggingface:ro
    command: python -m atlas_commands.server
    user: "${UID:-1000}:${GID:-1000}"

  # Project B: PANTHER Events Deduplication
  atlas-project-b:
    build:
      context: .
      dockerfile: Dockerfile
    image: atlas-commands-mcp:latest
    container_name: atlas-project-b
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PROJECT_NAME=PANTHER-events-deduplication
      - ATLAS_STORAGE_PATH=/app/REPOS
      - ATLAS_STARTUP_MODE=fast
      - ATLAS_LAZY_LOADING=true
      - ATLAS_TOKEN_MODE=auto
      # Hierarchical cache configuration
      - ATLAS_PROJECT_ID=PANTHER-events-deduplication
      - ATLAS_CACHE_MODE=hierarchical
      - ATLAS_WORKSPACE_ISOLATION=true
    volumes:
      - ${PWD}/REPOS:/app/REPOS
      - ./config:/app/config:ro
      # Same shared global cache (NO 178MB duplication!)
      - ~/.atlas/global:/app/.atlas/global:ro
      # Different project-specific cache (isolated)
      - ~/.atlas/projects/$(echo "PANTHER-events-deduplication" | sha256sum | cut -c1-16):/app/.atlas/project:rw
      # Same shared HuggingFace models
      - ~/.atlas/global/models:/root/.cache/huggingface:ro
    command: python -m atlas_commands.server
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8001:8000"  # Different port for second project

  # Project C: API Gateway
  atlas-project-c:
    build:
      context: .
      dockerfile: Dockerfile
    image: atlas-commands-mcp:latest
    container_name: atlas-project-c
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - PROJECT_NAME=api-gateway
      - ATLAS_STORAGE_PATH=/app/REPOS
      - ATLAS_STARTUP_MODE=fast
      - ATLAS_LAZY_LOADING=true
      - ATLAS_TOKEN_MODE=auto
      # Hierarchical cache configuration
      - ATLAS_PROJECT_ID=api-gateway
      - ATLAS_CACHE_MODE=hierarchical
      - ATLAS_WORKSPACE_ISOLATION=true
    volumes:
      - ${PWD}/REPOS:/app/REPOS
      - ./config:/app/config:ro
      # Same shared global cache (NO 178MB duplication!)
      - ~/.atlas/global:/app/.atlas/global:ro
      # Different project-specific cache (isolated)
      - ~/.atlas/projects/$(echo "api-gateway" | sha256sum | cut -c1-16):/app/.atlas/project:rw
      # Same shared HuggingFace models
      - ~/.atlas/global/models:/root/.cache/huggingface:ro
    command: python -m atlas_commands.server
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "8002:8000"  # Different port for third project

volumes:
  # Global shared cache volume (created once, shared by all)
  atlas-global-cache:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/.atlas/global

# Usage:
# 1. Start all projects: docker-compose -f docker-compose.multi-project.yml up
# 2. Start specific project: docker-compose -f docker-compose.multi-project.yml up atlas-project-a
# 3. Scale projects: docker-compose -f docker-compose.multi-project.yml up --scale atlas-project-a=3

# Benefits:
# - 178MB ML models shared across all projects (saved: 178MB * (N-1) projects)
# - Complete project isolation for tasks, memory, cache
# - Cross-project insights available through shared global cache
# - Same Docker image, different project contexts