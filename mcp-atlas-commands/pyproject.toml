[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-commands"
version = "1.0.0"
description = "MCP server for ATLAS command system shared utilities"
authors = [
    {name = "ATLAS", email = "atlas@anthropic.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.5.0",
    "psutil>=5.9.0",
    "numpy",
    # Redis caching support
    "redis>=4.0.0",
    # Core PyTorch and ML dependencies
    "torch>=2.0.0",
    "torch-geometric>=2.4.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    # OpenTelemetry observability with exporters
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-semantic-conventions>=0.45b0",
    "opentelemetry-exporter-otlp>=1.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.2.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]
ml = [
    # Advanced ML dependencies
    "torch-geometric>=2.4.0"
]
observability = [
    # Full observability stack
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-exporter-jaeger>=1.21.0",
    "opentelemetry-exporter-prometheus>=0.45b0",
    "opentelemetry-instrumentation-logging>=0.45b0"
]

[project.scripts]
atlas-commands = "atlas_commands.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true