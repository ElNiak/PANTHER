repos:

#
# Fail fast
#
-   repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.24.1
    hooks:
    - id: validate-pyproject
      fail_fast: true

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    # General
    -   id: check-merge-conflict
        fail_fast: true
    -   id: check-case-conflict
        fail_fast: true
    -   id: destroyed-symlinks
        fail_fast: true
    -   id: check-symlinks
        fail_fast: true
    -   id: check-added-large-files
        fail_fast: true
    # Syntax
    -   id: check-toml
        fail_fast: true
    -   id: check-json
        fail_fast: true
        exclude: |
            (?x)(
                ^dev/|
                ^data/|
                ^output/|
                ^docs-gen/|
                ^docs/|
                mkdocs.yml|
                mkgendocs.yml
            )
    -   id: check-yaml
        fail_fast: false
        exclude: |
            (?x)(
                ^data/|
                ^output/|
                ^docs-gen/|
                ^docs/|
                mkdocs.yml|
                mkgendocs.yml
            )

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: check-ast
        fail_fast: true

#
# Modifiers
#

-   repo: https://github.com/asottile/setup-cfg-fmt
    rev: v2.8.0
    hooks:
    -   id: setup-cfg-fmt
        args: ["--include-version-classifiers"]

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
    -   id: mixed-line-ending
    -   id: trailing-whitespace

-   repo: https://github.com/dannysepler/rm_unneeded_f_str
    rev: v0.2.0
    hooks:
    -   id: rm-unneeded-f-str

-   repo: https://github.com/asottile/pyupgrade
    rev: v3.20.0
    hooks:
    -   id: pyupgrade
        args: [--py310-plus]

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.11
    hooks:
    - id: ruff
      args: [--fix-only]
      fail_fast: false

# Last modifier: Coding Standard
-   repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
    -   id: black
        args: ["--line-length", "100"]


