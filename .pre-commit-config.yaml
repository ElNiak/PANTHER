repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(tests/tests_ressources/|\.codacy/)
      - id: end-of-file-fixer
        exclude: ^(tests/tests_ressources/|\.codacy/)
      - id: check-yaml
        exclude: mkdocs.yml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        files: ^(tests|panther)/.*\.py$
        exclude: ^tests/tests_ressources/

  - repo: https://github.com/pycqa/isort
    rev: 5.12.0
    hooks:
      - id: isort
        files: ^(tests|panther)/.*\.py$
        exclude: ^tests/tests_ressources/
        args: ["--profile", "black"]

  - repo: https://github.com/pycqa/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        files: ^(tests|panther)/.*\.py$
        exclude: ^tests/tests_ressources/
        args: ["--max-line-length=88", "--extend-ignore=E203,W503"]
        stages: [manual]

  - repo: local
    hooks:
      - id: fast-tests
        name: Fast Test Suite
        entry: bash -c 'cd /Users/elniak/Documents/Project/PANTHER && source .venv/bin/activate 2>/dev/null || true && python -m pytest tests/unit/ -m "not slow" --tb=line -q --maxfail=3 --no-header --disable-warnings -x --durations=5'
        language: system
        pass_filenames: false
        stages: [manual]

      - id: test-syntax
        name: Test Syntax Check
        entry: bash -c 'find tests/ -name "*.py" -exec python -m py_compile {} \;'
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: import-check
        name: Import Validation
        entry: bash -c 'source .venv/bin/activate 2>/dev/null || true; python -c "import panther; print(\"✅ PANTHER imports OK\")"'
        language: system
        pass_filenames: false
        stages: [pre-commit]

  - repo: https://github.com/pycqa/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        files: ^(tests|panther)/.*\.py$
        exclude: ^tests/tests_ressources/
        args: ["-ll", "-i"]  # Low level issues only, skip assert usage
        stages: [manual]

# CI: false  # Disable automatic CI runs for pre-commit.ci
