site_name: Panther Documentation
site_description: Comprehensive documentation for the PANTHER protocol testing framework
site_author: PANTHER Project Team
site_url: https://elniak.github.io/PANTHER

repo_name: elniak/PANTHER
repo_url: https://github.com/elniak/PANTHER

theme:
  name: material
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.sections
    # - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Installation: INSTALL.md
      - Quick Start: QUICK_START.md
      - Plugins:
          - Overview: plugins_overview.md
          - Inventory: plugins_inventory.md
          - Environment Plugins:
              - Overview: environment_plugins.md
              - Network Environment: network_environment.md
              - Execution Environment: execution_environment.md
          - Protocol Plugins:
              - Overview: protocol_plugins.md
              - Client-Server Protocols: client_server_protocols.md
              - Peer-to-Peer Protocols: peer_to_peer_protocols.md
          - Service Plugins:
              - Overview: service_plugins.md
              - Implementation Under Tests (IUTs):
                  - Overview: iut_plugins.md
                  - QUIC Implementations:
                      - Overview: iut_quic_overview.md
                      - Picoquic: iut_quic_picoquic.md
                      - Aioquic: iut_quic_aioquic.md
                      - Quinn: iut_quic_quinn.md
                      - Quic-Go: iut_quic_quic_go.md
                      - Quiche: iut_quic_quiche.md
                      - LSQUIC: iut_quic_lsquic.md
                      - mvfst: iut_quic_mvfst.md
                      - Quant: iut_quic_quant.md
                  - MinIP Implementations:
                      - Ping Pong: iut_minip_ping_pong.md
              - Testing Services:
                  - Overview: testing_services.md
                  - Panther Ivy:
                      - Overview: tester_panther_ivy.md
                      - Ivy Tool: tester_panther_ivy_ivy.md
                      - Protocol Testing: tester_panther_ivy_protocol-testing.md
                      - QUIC Tests: tester_panther_ivy_protocol-testing_quic.md
                      - Examples: tester_panther_ivy_examples_liveness.md
  - Developer Guide:
      - Contributing: contributing.md
      - Plugin Development:
          - Overview: plugin_development.md
          - Environment Plugins:
              - Overview: plugin_development_environment.md
              - Network Environment: plugin_development_network.md
              - Execution Environment: plugin_development_execution.md
          - Protocol Plugins: protocol_development.md
          - Service Plugins:
              - Overview: service_development.md
              - Implementation Under Tests (IUTs): iut_development.md
              - Testing Services: testers_development.md
  - Project Information:
      - Changelog: changelog.md
      - License: license.md
  # defer to gen-files + literate-nav
  - Code Reference: panther/


markdown_extensions:
  - attr_list
  - admonition
  - tables
  - def_list
  - md_in_html
  - callouts
  - footnotes
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.gemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_alt
  - pymdownx.superfences:
        # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.highlight:
      pygments_lang_class: true
  - pymdownx.inlinehilite:
      style_plain_text: python
  - pymdownx.magiclink
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: "¤"
use_directory_urls: false
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - git-revision-date-localized
  - same-dir
  - mermaid2:
      javascript: https://unpkg.com/mermaid@10.4.0/dist/mermaid.esm.min.mjs
  # - exclude: # NOT WORKING
  #     glob:
  #       - '../panther/panther_worker/app/panther-ivy/**'
  #       - '../panther/outputs/**'
  #       - '../panther/panther_webapp/app/res/tmp/**'
  #       - '*.tmp'
  #       - '*.pdf'
  #       - '*.gz'
  #       - '**/setup.py'
  #     regex:
  #       - '.*\.(tmp|bin|tar)$'
  - gen-files:
      scripts:
        - panther/tools/docs_gen/mkdocs/gen_ref_pages.py  # Path to the script generating reference pages
  - literate-nav:
      nav_file: SUMMARY.md  # Path to the generated navigation file
  - section-index
  - coverage
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # setup_commands:
          #   - import sys
          #   - from pathlib import Path
          #   - sys.path.append(str(Path('.').resolve()))
          paths:
            - panther/*
            - tests/*
          options:
            docstring_options:
              ignore_init_summary: true
            filters: ["!^_"]
            heading_level: 2
            show_docstring_attributes: true
            show_root_toc_entry: true
            show_docstring_modules: true
            show_root_members_full_path: false
            inherited_members: true
            merge_init_into_class: true
            parameter_headings: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_docstring_returns: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true

            show_labels: true
            docstring_section_style: table
            find_stubs_package: true
            show_inheritance_diagram: true
