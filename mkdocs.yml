site_name: Panther Documentation
site_description: Comprehensive documentation for the PANTHER protocol testing framework
site_author: PANTHER Project Team
site_url: https://elniak.github.io/PANTHER

repo_name: elniak/PANTHER
repo_url: https://github.com/elniak/PANTHER

theme:
  name: material
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16

  palette:
    - scheme: default      # Light theme
      primary: indigo      # Primary color
      accent: indigo       # Accent color
      toggle:
        icon: material/brightness-7  # Sun icon
        name: Switch to dark mode

    - scheme: slate        # Dark theme
      primary: indigo      # Primary color
      accent: indigo       # Accent color
      toggle:
        icon: material/brightness-4  # Moon icon
        name: Switch to light mode

  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.path
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    # - navigation.expand
    - toc.follow
    - toc.integrate
    - navigation.indexes
    - navigation.top
    - search.highlight
    - search.share
    - content.action.edit
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Installation: INSTALL.md
      - Quick Start: QUICK_START.md
      - Architecture: workflow.md
  - Guides:
      - Plugin Development: plugin_development.md
      - Plugin Inventory: plugins_inventory.md
  - Project:
      - Contributing: contributing.md
      - Changelog: changelog.md
      - License: license.md
  # defer to gen-files + literate-nav
  - Code Reference: panther/


markdown_extensions:
  - attr_list
  - admonition
  - tables
  - def_list
  # - md_in_html
  - callouts
  - footnotes
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - pymdownx.superfences:
        # make exceptions to highlighting of code:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid
  - pymdownx.highlight:
      pygments_lang_class: true
      anchor_linenums: true
      use_pygments: true
      auto_title: true
  - pymdownx.smartsymbols
  - pymdownx.inlinehilite:
      style_plain_text: python
  - pymdownx.magiclink
  - pymdownx.snippets:
      base_path: [!relative $config_dir]
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.details
  - pymdownx.betterem
  - pymdownx.blocks.caption
  - toc:
      permalink: "¤"

use_directory_urls: false

plugins:
  - optimize
  - search:
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - git-revision-date-localized
  - same-dir
  - mermaid2:
      javascript: https://unpkg.com/mermaid@11.12.3/dist/mermaid.esm.min.mjs
  - gen-files:
      scripts:
        - panther/tools/docs_gen/mkdocs/gen_ref_pages.py  # Path to the script generating reference pages
  - literate-nav:
      nav_file: SUMMARY.md  # Path to the generated navigation file
  - section-index
  - coverage
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # setup_commands:
          #   - import sys
          #   - from pathlib import Path
          #   - sys.path.append(str(Path('.').resolve()))
          paths:
            - "."
          options:
            allow_inspection: false
            extensions:
              - panther/tools/docs_gen/mkdocs/griffe_exclude_ivy.py:ExcludeIvyExtension
              - griffe_pydantic:
                schema: true
            docstring_style: google
            docstring_options:
              ignore_init_summary: false
            filters: ["!^_"]
            heading_level: 2
            show_docstring_attributes: true
            show_root_toc_entry: true
            show_docstring_modules: true
            show_root_members_full_path: false
            inherited_members: true
            merge_init_into_class: true
            parameter_headings: true
            separate_signature: true
            show_root_heading: true
            show_root_full_path: false
            show_docstring_returns: true
            show_signature_annotations: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            signature_crossrefs: true
            summary: true

            show_labels: true
            docstring_section_style: table
            show_source: true
            find_stubs_package: true
            show_inheritance_diagram: true
